# cargo-nextest configuration.
#
# WHY NEXTEST IS HERE. `cargo test` runs test BINARIES serially -- each binary
# parallelises only its own #[test] fns (rust-lang/cargo#5609). ferric has 317
# fast-tier binaries and 262 of them finish in under 5 s (MEASURED, CI run
# 35377097468), so the short ones were executed one at a time with most cores
# idle. nextest runs binaries concurrently.
#
# THE HAZARD THIS FILE EXISTS TO MANAGE. nextest is PROCESS-PER-TEST. The
# workflow sets FERRIC_MEM_BUDGET_GB=3, and every ferric process reads that as
# ITS OWN budget. Under `cargo test` at most one test binary ran at a time, so
# 3 GB meant 3 GB. Under nextest, N concurrent processes each believe they may
# use 3 GB -- an N-times overcommit on a runner with ~14 GB free. That is the
# same defect class already recorded for ferric-batch. The groups below cap
# concurrency for the tests that actually allocate against the pool.

[profile.default]
# `runlog_writer` spawns examples/runlog_probe as a subprocess. That binary is
# not a test target, so `nextest archive` leaves it out unless it is listed
# here. The CI build job builds it BEFORE archiving; `on-missing = "error"`
# makes a skipped build fail the archive step instead of a shard. Shipping it
# inside the archive means it cannot arrive without the tests that need it,
# which a second artifact file did intermittently (runs 35483904588,
# 35486199559, 36013053462).
archive.include = [
    { path = "debug/examples/runlog_probe", relative-to = "target", on-missing = "error" },
]

[profile.ci]
# Fail slow: report EVERY failing test, matching --no-fail-fast. A red run that
# surfaces one failure per cycle costs one full CI round trip per bug.
fail-fast = false
# One retry. The MPI and pool probes have a measured launch/scheduling flake
# ("a rank failed or never started"); a single retry distinguishes a flake from
# a real failure instead of forcing a manual re-run. A test that fails twice is
# reported as failed.
retries = 1
# Default parallelism. Left at the core count for the ~262 sub-5s binaries,
# which are the entire reason for adopting nextest; the memory-heavy minority
# is constrained by the group below, not by throttling everything.
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# Tests that allocate against the shared MemoryPool. FERRIC_MEM_BUDGET_GB is
# per-process, so these must not run many-at-once: 4 concurrent x 3 GB is
# 12 GB against a runner that has ~14 GB free and has already died with
# "No space left on device" once (run 33210162947).
#
# max-threads = 2 is a DELIBERATE, CONSERVATIVE choice, not a measurement:
# 2 x 3 GB = 6 GB leaves headroom for the rest of the shard. Raise it only
# with a measured peak-RSS number for the group.
[test-groups]
memory-pool = { max-threads = 2 }

#
# MEASURED match counts (cargo nextest list -E '<filter>', this workspace,
# --workspace --all-targets), because a filterset that silently matches
# NOTHING is indistinguishable from one that works:
#
#   binary_id(/mwe_.*pool/)     88   <- the pool MWE binaries
#   test(/pool/)                64
#   test(/budget/)             163
#   test(/_charges_the_pool/)    1
#   the union below            264
#
# `binary_id()` rather than `test()` for the MWE binaries: nextest matches
# `test()` against the TEST name, not the binary name, so the obvious-looking
# `test(/^mwe_.*pool/)` matched 0 tests -- `mwe_cc_charge_lifetime` is the
# binary, and the test inside it is `the_pooled_band_width_is_...`. That dead
# branch was previously OR'd with `pool.*$`, which happened to cover the same
# 64 tests, so the group worked while encoding a false belief about why.
[[profile.ci.overrides]]
filter = 'binary_id(/mwe_.*pool/) or test(/pool/) or test(/budget/) or test(/_charges_the_pool/)'
test-group = 'memory-pool'

# BLAS/rayon-heavy numerics. OPENBLAS_NUM_THREADS=1 is set workflow-wide, so
# each of these is single-threaded in BLAS, but they still spawn rayon pools
# sized to the machine. Capping their mutual concurrency keeps a shard from
# oversubscribing the runner's 4 cores several times over.
[test-groups.numerics]
max-threads = 2

[[profile.ci.overrides]]
filter = 'test(/scf|dft|rimp2|ccsd|rpa|cosx|link_k/)'
test-group = 'numerics'

# The weekly `validation` job (.github/workflows/ci.yml): ferric vs committed
# external references, `--run-ignored only -E 'binary(/^validation_/)'`.
# Profiles inherit from [profile.default], not from [profile.ci], so the CI
# test groups above do not apply here; concurrency is capped directly instead.
[profile.validation]
fail-fast = false
# NO retries, unlike [profile.ci]: a validation test compares a number against
# a reference at a derived tolerance, and a pass-on-retry would hide exactly
# the nondeterminism (thread-count-dependent reductions, a guess that lands on
# a different state) this tier exists to expose.
retries = 0
# 2 concurrent x FERRIC_MEM_BUDGET_GB=3 per process = 6 GB, the same headroom
# argument as the memory-pool group above.
test-threads = 2
# Validation tests may run several SCFs with stability analysis each; allow
# 30 min before termination rather than the ci profile's 8.
slow-timeout = { period = "300s", terminate-after = 6 }

[profile.validation.junit]
path = "junit-validation.xml"
