# Amplitude-threshold local MP2 (WSHG23 single-threshold, closed-shell).
# eps = 0 reproduces rimp2 exactly; the default 1e-4 carries a one-sided,
# ~linear-in-eps truncation error. `lmp2_reference = true` opts in to the
# canonical RI-MP2 reference (a full N^5 canonical run; off by default) so the
# output prints that error against it. See wiki/amplitude-threshold-lmp2.md.
[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "6-31g"

[method]
kind = "lmp2"

[mp2]
auxbasis = "cc-pvdz-ri"
frozen_core = 1
lmp2_eps = 1e-4
lmp2_reference = true
