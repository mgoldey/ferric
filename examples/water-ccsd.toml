# Closed-shell RI-CCSD on water / cc-pVDZ (spin-adapted solver, all electrons).
#
# Every integral is built from the density-fitted three-index tensor with the
# [mp2] auxbasis below; the RHF reference uses exact integrals. PySCF CCSD run
# on the same density-fitted integrals gives E_corr = -0.2135061893 Ha for this
# geometry, basis and aux (scripts/validation/gen_cc.py); this file prints
# -0.2135061899 Ha at the default convergence. The density-fitting
# error itself, against exact-integral CCSD, is about 1.3e-4 Ha here: choose
# the aux for the accuracy you need.
[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "ccsd"

[mp2]
auxbasis = "cc-pvdz-ri"
