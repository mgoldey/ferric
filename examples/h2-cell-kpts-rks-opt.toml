# Periodic k-point RKS geometry optimization: stretched H2 / STO-3G (1.0
# Angstrom) in a 4 Angstrom simple-cubic cell on a 1x1x3 Gamma-centred k-mesh,
# PBE0 (a global hybrid).
#
# task = "optimize" with [cell] kmesh relaxes the ATOMS at a FIXED lattice with
# the analytic k-point Kohn-Sham force (ferric_pbc::kxcgrad: closed-shell LDA,
# GGA or global-hybrid functionals, dense or rsgdf J/K) and ferric's Cartesian
# BFGS. Every step rebuilds the lattice sums, XC grid and J/K at the new
# positions and runs a fresh k-point SCF, which must converge. The force
# differentiates the energy on the [cell] n_radial x n_angular grid with its
# neighbour cutoff, and for a hybrid the SCF's own exxdiv. The run prints the
# final geometry and the final gradient dE/dR (Hartree/Bohr per cell).
# The pure meta-GGAs SCAN and r2SCAN also have the closed-shell force; UKS/ROKS
# and ROHF have it too (see h-cell-kpts-uks.toml). Range-separated hybrids and
# VV10 functionals have no k-point force and are refused; there is no lattice
# relaxation.
#
# Seconds to minutes to run:
#   OPENBLAS_NUM_THREADS=1 cargo run --release --bin ferric -- examples/h2-cell-kpts-rks-opt.toml

[molecule]
xyz = "testdata/molecules/h2_stretched.xyz"

[basis]
name = "sto-3g"

[method]
kind = "ksdft"
task = "optimize"

[dft]
functional = "PBE0"

[cell]
lattice = [[4.0, 0.0, 0.0], [0.0, 4.0, 0.0], [0.0, 0.0, 4.0]]
kmesh = [1, 1, 3]
exxdiv = "ewald"
jk = "dense"
# A lighter periodic XC grid than the 75 x 302 default, to keep the example
# fast; the force is the exact derivative of the energy on this grid.
n_radial = 50
n_angular = 110
# Set explicitly for an optimization (the default max(10 Bohr, covering bound)
# depends on the atom positions in a large sparse cell and the force omits that
# dependence): 7.5 Angstrom = 14.17 Bohr.
neighbour_cutoff = 7.5

[optimize]
max_steps = 30
