[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "laplace-sos-mp2"

[mp2]
auxbasis = "cc-pvdz-ri"
# Jung/Head-Gordon SOS-MP2 (JCP 121, 9793 (2004)). c_os = 1.3 is the default.
# c_os = 1.0 recovers the bare opposite-spin MP2 energy, which is the hard
# internal reference the ferric-mp2 tests assert against.
c_os = 1.3
# Minimax Laplace grid. Must be 3, 5 or 7 — anything else is a hard error
# rather than a silent cap. 7 is the tightest supported.
n_quad = 7
# "mo" (default), "ao", or "ao-sparse".
#
# "mo" and "ao" are both EXACT and agree to round-off, so choosing between them
# is an implementation choice, not a physics one. The AO pseudo-density path is
# dense here and is the correctness reference for that limit — selecting it is
# not a scaling win.
#
# "ao-sparse" restricts the pseudo-densities to Boys-orbital AO domains and
# requires `domain_cutoff_bohr`. It is the one APPROXIMATE variant: it converges
# to "ao" as the cutoff grows and is exact once the domains span the molecule.
# Measured 2026-07-28 against the exact AO path (n-alkanes, c_os = 1.0,
# n_quad = 7): chemical accuracy (< 1.6 mHa) needs r = 3-5 Bohr from ethane to
# dodecane, so r/diameter FALLS 0.52 -> 0.17 -- a finite decay length, not strict
# saturation. Danuglipron (71 atoms, 31 Bohr, STO-3G) is within 0.05% at 4 Bohr.
# Pinned by ferric-mp2's sos_ao_sparse_truncation_radius_is_transferable_across_sizes.
# The AO algebra is still DENSE, so a cutoff does not yet save time or memory.
# (An earlier "radius tracks the molecular diameter" result was an artifact of a
# domain-mask index bug, fixed 2026-07-27.) See site/src/methods/mp2.md.
sos_formulation = "mo"
# domain_cutoff_bohr = 12.0   # required by (and ONLY valid with) "ao-sparse"

# There is deliberately no c_ss: SOS-MP2 IS the c_ss = 0 limit, and that is
# exactly what makes the Laplace denominator factorize. Setting c_ss here warns
# and is ignored; use kind = "scs-mp2" if you want a same-spin term.

[memory]
# Caps the resident 3-index tensors. The AO path fails fast with a clear error
# if the dense naux*nbas^2 tensors would exceed it, rather than overshooting.
budget_gb = 4.0
