# EXACT direct RPA (dRPA@HF), closed-shell: the drCCD Riccati solve with no
# amplitude truncated, anchored to the canonical plasmon formula. Riccati,
# plasmon and full-rank PDEP (kind = "pdep-rpa" with [rpa] trunc_thresh = 0)
# are algorithms for this same energy.
#
# The Riccati solve holds an no^3 * nv^2 ring-product plan, so it is the
# small-system path: a run that cannot fit the memory budget is refused
# before the SCF and pointed at pdep-rpa. For the local approximation see
# water-drpa-local.toml. Same calculation as Python ferric.run_drpa(...).

[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "6-31g"

[method]
kind = "drpa"

[mp2]
auxbasis = "cc-pvdz-ri"
frozen_core = 1
