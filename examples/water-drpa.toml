# EXACT direct RPA (dRPA@HF), closed-shell: ln det(1 + Pi) - tr Pi
# integrated over imaginary frequency in the dressed aux basis (Gauss-Legendre,
# 48 points), nothing truncated and no static eigensolve. The drCCD Riccati
# solve (Python ferric.run_drpa) and the canonical plasmon formula are
# algorithms for this same energy.
#
# A run that cannot fit the memory budget is refused before the SCF. For the
# local approximation see water-drpa-local.toml.

[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "6-31g"

[method]
kind = "drpa"

[mp2]
auxbasis = "cc-pvdz-ri"
frozen_core = 1
