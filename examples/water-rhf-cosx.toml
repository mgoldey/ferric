# RHF with COSX seminumerical exchange (Neese 2009; Izsak-Neese 2011 overlap fit).
#
# k_builder = "cosx" replaces the direct 4-centre K by a grid-based
# seminumerical K. J is integral-direct here; with df_j_aux set (or for a
# Kohn-Sham run, where RI-J is the default) J comes from RI-J and the run is
# RIJCOSX. A named df_k_aux next to k_builder = "cosx" is an error. RHF, UHF
# and ROHF all honour k_builder.
#
# cosx_grid defaults to { radial = 35, angular = 194, prune = "sgx" } (pruned
# ORCA/PySCF-style around the peak order), and by default exchange is then
# re-evaluated once on a larger final grid
# ({ radial = 50, angular = 302, prune = "sgx" }) and that energy is reported
# (cosx_final_pass = false turns it off; geometry tasks always run without
# it). angular must be one of 6/14/26/50/110/194/302/434/590; a table without
# prune is a flat grid, e.g. { radial = 50, angular = 110 }. Measured accuracy
# and cost of each choice are in site/src/methods/scf.md ("Choosing how
# exchange is built").
# cosx_overlap_fit defaults to true. cosx_backend selects the 3c1e kernel:
# "md3c1e" (default, batched McMurchie-Davidson) or "cosx-a" (per-point
# libint2, ~3.2-3.5x slower, exact vs md3c1e to ~1e-15 — the cross-check).
# Every cosx_* key is a hard error with any other k_builder; unknown values
# are a hard error.
#
# Measured (water/cc-pVDZ, this file): E(COSX) - E(direct) is reported in
# crates/ferric-scf/tests/cosx_scf.rs.

[molecule]
xyz = "testdata/molecules/water.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "rhf"

[scf]
max_iter = 100
energy_conv = 1e-8
density_conv = 1e-7
diis_size = 8
integral_thresh = 1e-12
k_builder = "cosx"
cosx_grid = { radial = 50, angular = 110 }
cosx_overlap_fit = true
cosx_backend = "md3c1e"
