# B3LYP / cc-pVDZ on benzene with RI-J and RI-K, meant to be run under MPI.
#
# The file itself is an ordinary ksdft input: MPI is selected at build and
# launch time, not in the TOML. Build the MPI binary and launch it with, e.g.,
#
#   cargo build --release --workspace --features mpi
#   mpirun -np 2 target/release/ferric examples/benzene-dfb3lyp-mpi.toml
#
# The same file runs serially with the normal binary. The MPI build splits the
# DF-J/K work across ranks; the ranks agree with each other exactly, and the
# 2-rank energy differs from the serial one by about 5e-6 Ha on benzene (a
# GEMM-shape effect; crates/ferric-scf/tests/mpi_dfjk_banding.rs).
[molecule]
xyz = "testdata/molecules/benzene.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "ksdft"

[dft]
functional = "B3LYP"

[scf]
max_iter = 100
energy_conv = 1e-8
density_conv = 1e-7
diis_size = 8
integral_thresh = 1e-12
df_j_aux = "def2-universal-jkfit"
df_k_aux = "def2-universal-jkfit"
