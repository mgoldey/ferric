# Fully specified input: method.kind = "nevpt2", task = "energy".
#
# Every key of every section this run reads is written at the value the
# CLI uses when the key is omitted, so this file and the minimal input
# below describe the same run. A key with no value to write (its default
# is "unset", or it is read only under another key's value or by another
# kind) is listed in a `# key: ...` comment instead. Not written at all:
# [cosmo], [pcm], [external_potential], [qmmm], [cell], [cdft],
# each of which turns a feature on when present.
#
# Generated by crates/ferric-cli/src/full_examples.rs; regenerate with
#   FERRIC_WRITE_FULL_EXAMPLES=1 cargo test -p ferric-cli --release full_example
#
# --- minimal input (begin) ---
#   [molecule]
#   xyz = "testdata/molecules/water.xyz"
#   [basis]
#   name = "sto-3g"
#   [method]
#   kind = "nevpt2"
#   [cas]
#   n_active = 4
#   n_elec_active = [2, 2]
# --- minimal input (end) ---

[molecule]
xyz = "testdata/molecules/water.xyz"  # XYZ geometry in Angstrom, relative to the working directory (required) [minimal input]
charge = 0                            # total charge
multiplicity = 1                      # 2S + 1

[basis]
name = "sto-3g"  # bundled basis name, case-insensitive (required unless path is set) [minimal input]
# path: Gaussian-94 basis file; not read here: read only when name is absent

[method]
kind = "nevpt2"  # the method (required) [minimal input]
task = "energy"  # energy | optimize | frequencies | md

[scf]
max_iter = 200       # SCF iteration cap
energy_conv = 1e-3   # energy-change bound, a sanity bound and not the convergence signal
density_conv = 1e-6  # density-change threshold, the convergence signal
# diis_size: DIIS subspace size; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# diis: pulay | adiis | ediis; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# diis_switch_thresh: error level where ADIIS/EDIIS hand over to Pulay; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# smearing_sigma: Fermi-Dirac smearing width, Hartree; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# guess: minao | sad (alias of minao) | hcore; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# guess_basis: secondary-basis guess: converge in this basis first, then project; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# guess_projection: fock | overlap; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# soscf: second-order (Newton) step in the SCF tail; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# aurora: AURORA auxiliary-curvature accelerator; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# trah_trigger: DIIS error below which the TRAH solver takes over; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# integral_thresh: integral screening threshold; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# eri_precision: libint primitive-screening precision, 0 to 1e-8 (omitted: FERRIC_ERI_PRECISION, else 1e-20); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# jk_storage: RI tensor storage: auto | memory | disk | direct | split; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# ri_j_precision: RI-J tensor storage precision: f32 | f64 (omitted: f32 for energy, f64 for optimize/frequencies/md); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# ri_k_precision: RI-K tensor storage precision: f64 | f32; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# k_builder: exchange builder: direct | link | cosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# screening: four-centre screening: schwarz | csb | csam; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# eri: four-centre J/K build: auto | direct | incore; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# gc_rotation: direct J/K contraction rotation: auto | rot1 | off (unset: FERRIC_GC_ROTATE, then auto); unset by default: FERRIC_GC_ROTATE, then auto
# jk_digest: direct J/K quartet digest: pair | legacy (unset: FERRIC_JK_DIGEST, then pair); unset by default: FERRIC_JK_DIGEST, then pair
# relativistic: x2c1e: spin-free X2C-1e core Hamiltonian (energy only); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_grid: COSX SCF grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_final_pass: COSX final pass on a larger grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_final_grid: COSX final-pass grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_grid_schedule: coarse-then-production COSX grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_overlap_fit: COSX overlap fitting; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_backend: COSX kernel; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_screen_thresh: COSX screen; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_half_transform: COSX half transform; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# cosx_fp64_multiplier: COSX precision-router threshold; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_j_aux: RI-J auxiliary basis; "" is exact J; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_k_aux: RI-K auxiliary basis; "" is exact K; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# jk: reference J/K route of the MP2 family: exact | rijk | rijcosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# jk_aux: JK-fit basis of jk = rijk/rijcosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# level_shift: virtual-block level shift, Hartree; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# mom_after_iter: maximum-overlap pinning after this many iterations; 0 = aufbau; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# mom_reference: previous | initial; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# verbose: one line per SCF iteration; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_guess: two-stage SCF: DF first, then exact; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_guess_aux: aux basis of the DF-guess pre-stage; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_increments: DF-corrected incremental Fock SCF; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# df_increments_aux: aux basis of df_increments; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# check_stability: diagnostic orbital-Hessian check of the converged SCF; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# stability_descent: follow a downhill mode at a saddle and re-converge; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# symmetry: point-group-blocked closed-shell RHF/RKS; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# irrep_nelec: electrons per irrep; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# save_reference: write the converged reference SCF to this file; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# read_reference: read the reference SCF from a save_reference file instead of solving it; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# read_reference_other_build: accept a read_reference file written by another build; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest
# ladder: [[scf.ladder]] convergence-ladder rungs; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv, density_conv, gc_rotation and jk_digest

[cas]
n_active = 4            # active spatial orbitals (required) [minimal input]
n_elec_active = [2, 2]  # [n_alpha, n_beta] active electrons (required) [minimal input]
reference = "casscf"    # casscf | casci
grad_tol = 1e-7         # orbital-gradient norm threshold
energy_tol = 1e-12      # energy-change threshold, Hartree
max_iter = 300          # macro iterations
max_step = 0.2          # largest rotation-step element, rad
optimizer = "ah"        # ah | bfgs
integrals = "auto"      # auto | direct | dense | ri
stability = "off"       # off | check | follow
# n_core: doubly occupied orbitals below the active window; unset by default: (N - n_alpha - n_beta) / 2
# canonicalize: canonical core/virtual and natural active orbitals; not read here: casscf only
# integral_thresh: not read here: only with integrals = "direct" (default 1e-12)
# auxbasis: not read here: only with integrals = "ri", where it is required
# ci: the [cas.ci] table below; not read here: written as [cas.ci]

[cas.ci]
conv_thresh = 1e-10  # CI residual threshold
max_subspace = 50    # Davidson subspace before a restart
max_iter = 200       # Davidson iterations

[memory]
# budget_gb: memory budget, GB; unset by default: FERRIC_MEM_BUDGET_GB, else 0.8 x available RAM; machine-dependent, so not written
# three_index_budget_gb: not read here: deprecated alias of budget_gb

[parallel]
# blas_threads: OpenBLAS threads of the serial sections; unset by default: FERRIC_BLAS_THREADS, else the rayon thread count; machine-dependent, so not written

[output]
json = true  # run-log path; true = <input-stem>.ferric.jsonl beside the input, false = off
