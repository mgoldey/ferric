# Fully specified input: method.kind = "ksdft", task = "energy".
#
# Every key of every section this run reads is written at the value the
# CLI uses when the key is omitted, so this file and the minimal input
# below describe the same run. A key with no value to write (its default
# is "unset", or it is read only under another key's value or by another
# kind) is listed in a `# key: ...` comment instead. Not written at all:
# [cosmo], [pcm], [external_potential], [qmmm], [cell], [cdft],
# each of which turns a feature on when present.
#
# Generated by crates/ferric-cli/src/full_examples.rs; regenerate with
#   FERRIC_WRITE_FULL_EXAMPLES=1 cargo test -p ferric-cli --release full_example
#
# --- minimal input (begin) ---
#   [molecule]
#   xyz = "testdata/molecules/water.xyz"
#   [basis]
#   name = "sto-3g"
#   [method]
#   kind = "ksdft"
# --- minimal input (end) ---

[molecule]
xyz = "testdata/molecules/water.xyz"  # XYZ geometry in Angstrom, relative to the working directory (required) [minimal input]
charge = 0                            # total charge
multiplicity = 1                      # 2S + 1

[basis]
name = "sto-3g"  # bundled basis name, case-insensitive (required unless path is set) [minimal input]
# path: Gaussian-94 basis file; not read here: read only when name is absent

[method]
kind = "ksdft"   # the method (required) [minimal input]
task = "energy"  # energy | optimize | frequencies | md

[scf]
max_iter = 200                     # SCF iteration cap
energy_conv = 1e-3                 # energy-change bound, a sanity bound and not the convergence signal
density_conv = 1e-6                # density-change threshold, the convergence signal
diis_size = 8                      # DIIS subspace size
diis = "pulay"                     # pulay | adiis | ediis
guess = "minao"                    # minao | sad (alias of minao) | hcore
soscf = false                      # second-order (Newton) step in the SCF tail
integral_thresh = 1e-12            # integral screening threshold
eri_precision = 1e-20              # libint primitive-screening precision, 0 to 1e-8 (omitted: FERRIC_ERI_PRECISION, else 1e-20)
jk_storage = "auto"                # RI tensor storage: auto | memory | disk | direct | split
ri_j_precision = "f32"             # RI-J tensor storage precision: f32 | f64 (omitted: f32 for energy, f64 for optimize/frequencies/md)
ri_k_precision = "f64"             # RI-K tensor storage precision: f64 | f32
df_j_aux = "def2-universal-jkfit"  # RI-J auxiliary basis; "" is exact J
df_k_aux = "def2-universal-jkfit"  # RI-K auxiliary basis; "" is exact K
level_shift = 0.0                  # virtual-block level shift, Hartree
mom_after_iter = 0                 # maximum-overlap pinning after this many iterations; 0 = aufbau
verbose = false                    # one line per SCF iteration
check_stability = false            # diagnostic orbital-Hessian check of the converged SCF
stability_descent = false          # follow a downhill mode at a saddle and re-converge
symmetry = false                   # point-group-blocked closed-shell RHF/RKS
# diis_switch_thresh: error level where ADIIS/EDIIS hand over to Pulay; not read here: only with diis = "adiis" or "ediis" (default 1e-1)
# smearing_sigma: Fermi-Dirac smearing width, Hartree; unset by default: integer occupations
# guess_basis: secondary-basis guess: converge in this basis first, then project; unset by default: no secondary-basis guess
# guess_projection: fock | overlap; not read here: only with guess_basis (default "fock")
# aurora: AURORA auxiliary-curvature accelerator; not read here: closed-shell rhf only
# trah_trigger: DIIS error below which the TRAH solver takes over; not read here: rhf and uhf only
# k_builder: exchange builder: direct | link | cosx; not read here: only on a four-centre exchange route; this run fits K
# screening: four-centre screening: schwarz | csb | csam; not read here: only on a four-centre exchange route; this run fits K
# eri: four-centre J/K build: auto | direct | incore; not read here: only on a four-centre exchange route; this run fits K
# gc_rotation: direct J/K contraction rotation: auto | rot1 | off (unset: FERRIC_GC_ROTATE, then auto); not read here: only on a four-centre exchange route; this run fits K
# jk_digest: direct J/K quartet digest: pair | legacy (unset: FERRIC_JK_DIGEST, then pair); not read here: only on a four-centre exchange route; this run fits K
# relativistic: x2c1e: spin-free X2C-1e core Hamiltonian (energy only); unset by default: nonrelativistic
# cosx_grid: COSX SCF grid; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_final_pass: COSX final pass on a larger grid; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_final_grid: COSX final-pass grid; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_grid_schedule: coarse-then-production COSX grid; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_overlap_fit: COSX overlap fitting; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_backend: COSX kernel; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_screen_thresh: COSX screen; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_half_transform: COSX half transform; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# cosx_fp64_multiplier: COSX precision-router threshold; not read here: only with k_builder = "cosx" or jk = "rijcosx"
# jk: reference J/K route of the MP2 family: exact | rijk | rijcosx; not read here: MP2-family kinds only
# jk_aux: JK-fit basis of jk = rijk/rijcosx; not read here: only with jk
# mom_reference: previous | initial; not read here: UHF/UKS only
# df_guess: two-stage SCF: DF first, then exact; not read here: not composed with the rhf/ksdft convergence ladder
# df_guess_aux: aux basis of the DF-guess pre-stage; not read here: only with df_guess
# df_increments: DF-corrected incremental Fock SCF; not read here: same scope as df_guess
# df_increments_aux: aux basis of df_increments; not read here: only with df_increments = true (default def2-universal-jkfit)
# irrep_nelec: electrons per irrep; not read here: only with symmetry = true
# save_reference: write the converged reference SCF to this file; not read here: correlated kinds with task = "energy" only
# read_reference: read the reference SCF from a save_reference file instead of solving it; not read here: correlated kinds with task = "energy" only
# read_reference_other_build: accept a read_reference file written by another build; not read here: only with read_reference
# ladder: [[scf.ladder]] convergence-ladder rungs; unset by default: the built-in ladder; [[scf.ladder]] rungs replace it

[dft]
functional = "LDA"            # XC functional name (LDA, PBE, B3LYP, ...) or libxc name
grid_prune = "nwchem-radial"  # none | nwchem | nwchem-radial | defgrid1..3
grid_radial = 75              # radial points per atom
grid_angular = 110            # Lebedev order
grid_weight_cut = 1e-14       # drop grid points with |weight| below this; 0 = off
# lambda: wB97X-L-V double-hybrid lambda; not read here: wb97x-l-v only
# omega: wB97X-L-V double-hybrid omega, Bohr^-1; not read here: wb97x-l-v only
# dispersion: d3bj | d3bj(<functional>) | mbd | mbd(<functional>); unset by default: no dispersion correction

[memory]
# budget_gb: memory budget, GB; unset by default: FERRIC_MEM_BUDGET_GB, else 0.8 x available RAM; machine-dependent, so not written
# three_index_budget_gb: not read here: deprecated alias of budget_gb

[parallel]
# blas_threads: OpenBLAS threads of the serial sections; unset by default: FERRIC_BLAS_THREADS, else the rayon thread count; machine-dependent, so not written

[gpu]
preset = "off"  # off | auto | on | mixed | auto-mixed
mode = "off"    # off | auto | on
# device: not read here: only with mode = "auto" or "on" (default 0)
# memory_gb: not read here: only with mode = "auto" or "on"
# min_flops: not read here: only with mode = "auto" or "on"
# precision: not read here: deprecated alias of [precision] mode
# mixed_kernels: not read here: deprecated alias of [precision] mixed_kernels

[precision]
mode = "f64"  # f64 | mixed
# mixed_kernels: not read here: only with mode = "mixed"

[output]
json = true  # run-log path; true = <input-stem>.ferric.jsonl beside the input, false = off
