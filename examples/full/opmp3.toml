# Fully specified input: method.kind = "opmp3", task = "energy".
#
# Every key of every section this run reads is written at the value the
# CLI uses when the key is omitted, so this file and the minimal input
# below describe the same run. A key with no value to write (its default
# is "unset", or it is read only under another key's value or by another
# kind) is listed in a `# key: ...` comment instead. Not written at all:
# [cosmo], [pcm], [external_potential], [qmmm], [cell], [cdft],
# each of which turns a feature on when present.
#
# Generated by crates/ferric-cli/src/full_examples.rs; regenerate with
#   FERRIC_WRITE_FULL_EXAMPLES=1 cargo test -p ferric-cli --release full_example
#
# --- minimal input (begin) ---
#   [molecule]
#   xyz = "testdata/molecules/water.xyz"
#   [basis]
#   name = "6-31g"
#   [method]
#   kind = "opmp3"
# --- minimal input (end) ---

[molecule]
xyz = "testdata/molecules/water.xyz"  # XYZ geometry in Angstrom, relative to the working directory (required) [minimal input]
charge = 0                            # total charge
multiplicity = 1                      # 2S + 1

[basis]
name = "6-31g"  # bundled basis name, case-insensitive (required unless path is set) [minimal input]
# path: Gaussian-94 basis file; not read here: read only when name is absent

[method]
kind = "opmp3"   # the method (required) [minimal input]
task = "energy"  # energy | optimize | frequencies | md

[scf]
max_iter = 200       # SCF iteration cap
energy_conv = 1e-10  # energy-change bound, a sanity bound and not the convergence signal
density_conv = 1e-8  # density-change threshold, the convergence signal
# diis_size: DIIS subspace size; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# diis: pulay | adiis | ediis; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# diis_switch_thresh: error level where ADIIS/EDIIS hand over to Pulay; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# smearing_sigma: Fermi-Dirac smearing width, Hartree; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# guess: minao | sad (alias of minao) | hcore; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# guess_basis: secondary-basis guess: converge in this basis first, then project; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# guess_projection: fock | overlap; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# soscf: second-order (Newton) step in the SCF tail; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# aurora: AURORA auxiliary-curvature accelerator; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# trah_trigger: DIIS error below which the TRAH solver takes over; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# integral_thresh: integral screening threshold; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# eri_precision: libint primitive-screening precision, 0 to 1e-8 (omitted: FERRIC_ERI_PRECISION, else 1e-20); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# jk_storage: RI tensor storage: auto | memory | disk | direct | split; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# ri_j_precision: RI-J tensor storage precision: f32 | f64 (omitted: f32 for energy, f64 for optimize/frequencies/md); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# ri_k_precision: RI-K tensor storage precision: f64 | f32; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# k_builder: exchange builder: direct | link | cosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# screening: four-centre screening: schwarz | csb | csam; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# eri: four-centre J/K build: auto | direct | incore; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# gc_rotation: direct J/K contraction rotation: auto | rot1 | off (unset: FERRIC_GC_ROTATE, then auto); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# jk_digest: direct J/K quartet digest: pair | legacy (unset: FERRIC_JK_DIGEST, then pair); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# gc_kernel: shared-primitive (ss|ss)/(ss|sp) kernel of the rotated direct J/K walk: auto | off (unset: FERRIC_GC_KERNEL, then off); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# relativistic: x2c1e: spin-free X2C-1e core Hamiltonian (energy only); not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_grid: COSX SCF grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_final_pass: COSX final pass on a larger grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_final_grid: COSX final-pass grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_grid_schedule: coarse-then-production COSX grid; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_overlap_fit: COSX overlap fitting; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_backend: COSX kernel; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_screen_thresh: COSX screen; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_half_transform: COSX half transform; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# cosx_fp64_multiplier: COSX precision-router threshold; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_j_aux: RI-J auxiliary basis; "" is exact J; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_k_aux: RI-K auxiliary basis; "" is exact K; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# jk: reference J/K route of the MP2 family: exact | rijk | rijcosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# jk_aux: JK-fit basis of jk = rijk/rijcosx; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# level_shift: virtual-block level shift, Hartree; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# mom_after_iter: maximum-overlap pinning after this many iterations; 0 = aufbau; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# mom_reference: previous | initial; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# verbose: one line per SCF iteration; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_guess: two-stage SCF: DF first, then exact; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_guess_aux: aux basis of the DF-guess pre-stage; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_increments: DF-corrected incremental Fock SCF; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# df_increments_aux: aux basis of df_increments; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# check_stability: diagnostic orbital-Hessian check of the converged SCF; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# stability_descent: follow a downhill mode at a saddle and re-converge; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# symmetry: point-group-blocked closed-shell RHF/RKS; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# irrep_nelec: electrons per irrep; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# save_reference: write the converged reference SCF to this file; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# read_reference: read the reference SCF from a save_reference file instead of solving it; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# read_reference_other_build: accept a read_reference file written by another build; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv
# ladder: [[scf.ladder]] convergence-ladder rungs; not read here: refused: this kind runs its own reference SCF, which reads only max_iter, energy_conv and density_conv

[opmp3]
reference = "hf"     # hf or a functional name
x_ss = 0.0           # same-spin damping (the paper's value for the reference)
integrals = "exact"  # exact | ri
frozen_core = 0      # frozen occupied orbitals of each spin
# auxbasis: not read here: only with integrals = "ri", where it is required

[local]
scheme = "none"  # none | amplitude-threshold
# eps: amplitude threshold (required with amplitude-threshold; no default); not read here: only with scheme = "amplitude-threshold", where it is required
# eps_sweep: several eps on one SCF (drpa); not read here: only with scheme = "amplitude-threshold"
# reference: also run the exact method; not read here: only with scheme = "amplitude-threshold"
# integral_direct: integral-direct local MP2; not read here: only with scheme = "amplitude-threshold"
# aux_radius: not read here: only with integral_direct = true
# virt_radius: not read here: only with integral_direct = true
# ao_tail: not read here: only with integral_direct = true
# schwarz_skip: not read here: only with integral_direct = true
# batch_merge: not read here: only with integral_direct = true
# eri3_pass: not read here: only with integral_direct = true
# gate_cal: not read here: only with integral_direct = true
# virt_schwarz_kappa: not read here: only with integral_direct = true
# pair_skip: not read here: only with integral_direct = true
# fock_screen: not read here: only with scheme = "amplitude-threshold" (rimp2, att-rimp2, opmp3)
# virtual_space: not read here: only with scheme = "amplitude-threshold" (rimp2, att-rimp2, opmp3)
# virtual_tau: not read here: only with virtual_space = "local"
# virtual_tau_loose: not read here: only with virtual_space = "local"
# virtual_solve_radius: not read here: only with virtual_space = "local"
# virtual_boys_tau: not read here: only with virtual_space = "local"
# lambda_boys: not read here: only with scheme = "amplitude-threshold" (rimp2, att-rimp2, opmp3)
# cg_energy_target: stop of the amplitude PCG: energy-error target, Ha (default 1e-7), or "strict" (relres 1e-6 tightened to a 1e-10 Ha bound); not read here: only with scheme = "amplitude-threshold" (rimp2, att-rimp2)

[memory]
# budget_gb: memory budget, GB; unset by default: FERRIC_MEM_BUDGET_GB, else 0.8 x available RAM; machine-dependent, so not written
# three_index_budget_gb: not read here: deprecated alias of budget_gb

[parallel]
# blas_threads: OpenBLAS threads of the serial sections; unset by default: FERRIC_BLAS_THREADS, else the rayon thread count; machine-dependent, so not written

[output]
json = true  # run-log path; true = <input-stem>.ferric.jsonl beside the input, false = off
