# Variant configuration for conda/recipe.yaml (rattler-build loads a
# variants.yaml next to the recipe automatically).
#
# pyo3 0.23 (workspace Cargo.toml) supports CPython up to 3.13; the list
# matches the PyPI wheel matrix in .github/workflows/wheels.yml.
python:
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"

c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.28"
