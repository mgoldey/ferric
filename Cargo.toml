[workspace]
members = ["crates/*", "benchmarks/harness"]
resolver = "2"

[workspace.package]
authors = ["Matthew Goldey <matthew.goldey@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgoldey/ferric"

# G1 correctness gate (docs/perf-tasks/G1-correctness-ci-gate.md): allow-list
# derived empirically from `cargo clippy --workspace --all-targets` on current,
# accepted main (2026-07-16) -- every entry below is a lint that already fires
# on real, reviewed numerical code, not a guess. Categories tolerated per the
# repo's clippy lint policy (prod lib is 0-warning on everything else; these
# are numerical/formatting idioms this codebase deliberately keeps):
#   - excessive_precision: literal rational-approximation/quadrature constants
#     copied verbatim from reference sources (e.g. qqr3.rs Cody erf coefficients)
#     -- truncating digits would silently change the constant.
#   - neg_multiply: `-1.0 * x` / `1.0 * x` terms in spherical-harmonic and
#     tensor-contraction expansions (ao_grid.rs) kept for readability/symmetry
#     with the surrounding formula, not accidental.
#   - needless_range_loop: index-based loops in tight integral/tensor kernels
#     (qqr3.rs) where the index itself (not just the element) is used in the
#     body (flat-index arithmetic) -- idiomatic `.iter()` rewrite would obscure
#     the math, not simplify it.
#   - doc_lazy_continuation: doc-comment list items (field docs in
#     oo_rimp2.rs-style structs) whose continuation lines aren't re-indented;
#     cosmetic doc-rendering nit, not a correctness or clarity issue.
#   - derivable_impls / field_reassign_with_default: hand-written `Default`
#     impls / post-default field assignment in CLI config structs
#     (ferric-cli/src/config.rs) that predate #[derive(Default)] support for
#     the same shape; cosmetic.
#   - redundant_pattern_matching / unnecessary_map_or / unnecessary_min_or_max:
#     small idiom nits in vv10.rs/ladder.rs/lanczos.rs on already-reviewed,
#     validated code.
#   - type_complexity: cpks_polar.rs return-type tuple flagged by the default
#     complexity threshold; a type alias would be pure bookkeeping.
#   - needless_borrows_for_generic_args: benchmarks/harness probe example, not
#     production code.
#   - if_same_then_else: rsh_rpa_dispersion.rs test bisection branches that are
#     textually identical but exist for documentation/symmetry of the two NaN
#     guard conditions; not a logic bug (see the comments at the call site).
#   - unused_parens: parenthesized block-return value in a test-only comparator
#     closure (terfc_base_validation.rs); harmless.
# too_many_arguments is NOT in this list any more (roadmap item 14): it is
# warn-by-default, so a NEW function over 7 arguments fails `-D warnings`
# unless it carries an item-level `#[allow(clippy::too_many_arguments)]`, and
# scripts/too_many_arguments_ratchet.py then refuses to let the number of
# those allows grow past scripts/too_many_arguments_baseline.json.
# Deliberately NOT allow-listed (would still fail the gate if they appear):
# everything else, including all `clippy::correctness`/`clippy::suspicious`
# lints and plain `unused`/dead-code warnings outside the one instance above.
# See scripts/ci-gate.sh for the matching allow-list used by the wrapper script
# -- keep the two in sync.
[workspace.lints.clippy]
excessive_precision = "allow"
neg_multiply = "allow"
needless_range_loop = "allow"
doc_lazy_continuation = "allow"
derivable_impls = "allow"
field_reassign_with_default = "allow"
redundant_pattern_matching = "allow"
unnecessary_map_or = "allow"
unnecessary_min_or_max = "allow"
type_complexity = "allow"
needless_borrows_for_generic_args = "allow"
if_same_then_else = "allow"
# NaN-aware comparison idiom: `!(a < b)` is deliberately NOT `a >= b` — a NaN
# must take the guard branch (DIIS fallbacks, config validation). Rewriting per
# the lint would silently change NaN behavior. Same policy class as
# excessive_precision above (see the clippy-lint-policy note).
neg_cmp_op_on_partial_ord = "allow"

[workspace.lints.rust]
unused_parens = "allow"

# Numerical test suite: debug-mode (opt-level 0) SCF/MP2/RPA math is 10-50x
# slower, pushing the workspace suite past 30 minutes. opt-level 2 for test
# builds (and for dependencies like ndarray in dev/test builds) fixes that.
# debug-assertions and overflow-checks remain ON by default in these
# profiles, so coverage is unchanged.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# The PyPI wheels (.github/workflows/wheels.yml and wheels-macwin.yml:
# `maturin build --profile wheel`). Release plus whole-program LTO in one
# codegen unit. Measured 2026-11-25 (local build, libint2/libxc linked dynamically) against
# `release` of the same tree: 0.46 MB smaller deflated, and single-thread
# KS-DFT/TDA/CCSD/RHF CPU time within run-to-run noise (ABBA pairs; the
# numbers are next to the maturin args in wheels.yml), energies bitwise
# identical.
[profile.wheel]
inherits = "release"
lto = "fat"
codegen-units = 1

# Cold leaf crates: input parsing, file export, TOML/JSON/Python-literal
# parsers. Size over speed. Only LEAF crates may go here, never the crate
# being linked: with fat LTO the merged whole-program pipeline runs at the
# ROOT crate's opt-level, so an "s" on ferric-python (the cdylib) turned loop
# and SLP vectorisation off for all of the Rust numerics (packed-double
# arithmetic in ferric.abi3.so fell from 19,133 to 1,549 instructions). For
# the same reason this profile must not be used to build the `ferric` /
# `ferric-cli` binaries (ferric-cli is their root); nothing does, they are
# built with `release`. Inside the wheel ferric-cli is a library under
# ferric-python, so the "s" there only shapes its own pre-LTO code.
[profile.wheel.package.ferric-cli]
opt-level = "s"
[profile.wheel.package.ferric-export]
opt-level = "s"
[profile.wheel.package.toml_edit]
opt-level = "s"
[profile.wheel.package.toml]
opt-level = "s"
[profile.wheel.package.serde_json]
opt-level = "s"
[profile.wheel.package.py_literal]
opt-level = "s"
[profile.wheel.package.pest]
opt-level = "s"

[workspace.dependencies]
ndarray = "0.16"
ndarray-linalg = { version = "0.17", features = ["openblas-system"] }
openblas-src = { version = "0.10", features = ["system", "rustls"] }
lapack-sys = "0.14"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse number-typed JSON f64 correctly rounded (tests compare
# CLI run-log energies with the library via to_bits). Basis/ECP JSON is unaffected:
# those loaders read exponents and coefficients as strings.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "0.8"
rayon = "1"
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
cc = "1"
sprs = "0.11"
ctrlc = "3"
mpi = "0.7"
# GPU backend (opt-in `gpu` feature). `dynamic-loading` dlopens libcuda/libcublas
# at RUN time, so no CUDA toolkit is needed to build — CI has none. `cuda-12000`
# matches the local toolkit (Pascal/sm_61 needs CUDA 12.x; 13.x drops it).
# nvrtc: only for Ptx/load_module of COMMITTED PTX; no compile_ptx call exists in the tree.
# Override at build with CUDARC_CUDA_VERSION=12080 etc.; never use
# `cuda-version-from-build-system` (it shells out to nvcc).
cudarc = { version = "0.19", default-features = false, features = [
    "std", "driver", "cublas", "cublaslt", "cusolver", "nvrtc", "dynamic-loading", "cuda-12000",
] }
libloading = "0.8"
