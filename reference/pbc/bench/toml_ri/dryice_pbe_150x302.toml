# aux = cc-pvdz-ri, ferric defaults (SR column rotation ON). Derived from toml/ by sed (issue #228 addendum). # ferric PBC real-size benchmark: dryice_pbe. Gamma PBE, SSF 150x302 (issue #228 fourth-session grid ladder: angular 302/434/590 at radial 150, radial 100/150/200/250 at angular 590; reference 250x590).
# Generated by reference/pbc/bench/make_geometries.py; run via run_ferric_bench.sh from the worktree root.
# Energies are Hartree PER CELL. RS-GDF at its fixed defaults (omega 1, precision 1e-13, lindep 1e-10);
# hcore precision 1e-14 with omega = min(2.5 sqrt(pi)/V^(1/3), 0.9636) (PeriodicHcoreConfig::for_cell). Nothing here is tuned for speed.

[molecule]
xyz = "reference/pbc/bench/dryice.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "ksdft"

[dft]
functional = "PBE"

[cell]
unit = "bohr"
lattice = [[10.627819724553907, 0.0, 0.0], [0.0, 10.627819724553907, 0.0], [0.0, 0.0, 10.627819724553907]]
exxdiv = "ewald"
jk = "rsgdf"
auxbasis = "cc-pvdz-ri"
n_radial = 150
n_angular = 302

[memory]
budget_gb = 10
