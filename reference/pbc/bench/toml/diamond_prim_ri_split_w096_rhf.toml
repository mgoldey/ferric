# ferric PBC real-size benchmark: diamond_prim_ri_split_rhf. Gamma, 2 C, nao 28.
# Copy of diamond_prim_ri_rhf.toml (generated by reference/pbc/bench/make_geometries.py) plus
# range_split = true (opt-in RS-GDF range split, lambda = 1; commit 6bbd7897). Hand-written; run via run_ferric_bench.sh from the worktree root.
# Energies are Hartree PER CELL. RS-GDF at its fixed defaults (omega 1, precision 1e-13, lindep 1e-10);
# hcore precision 1e-14 with omega PINNED by [cell] omega = 0.96 (the default would be
# min(2.5 sqrt(pi)/V^(1/3), 0.9636) = 0.9636 here, PeriodicHcoreConfig::for_cell). Nothing here is tuned for speed.

[molecule]
xyz = "reference/pbc/bench/diamond_prim.xyz"

[basis]
name = "cc-pvdz"

[method]
kind = "rhf"

[cell]
omega = 0.96
unit = "bohr"
lattice = [[0.0, 3.370326543161788, 3.370326543161788], [3.370326543161788, 0.0, 3.370326543161788], [3.370326543161788, 3.370326543161788, 0.0]]
exxdiv = "ewald"
jk = "rsgdf"
auxbasis = "cc-pvdz-ri"
range_split = true

[memory]
budget_gb = 10
