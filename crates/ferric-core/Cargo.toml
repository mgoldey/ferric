[package]
name = "ferric-core"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
lapack-sys = { workspace = true }
mpi = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[features]
default = []
mpi = ["dep:mpi"]
# CUDA backend. Compiles and runs (reporting `Unavailable`) on a machine with
# no driver or toolkit; see src/gpu/mod.rs.
gpu = ["dep:cudarc", "dep:libloading"]
# Fault-injection and mutation statics for the device tests (FORCE_KERNEL_FAILURE).
# Never enabled by a shipped build.
test-seams = ["gpu"]

[dev-dependencies]
serde_json = { workspace = true }
# LAPACK backend so the standalone `cargo test -p ferric-core` binary resolves
# the OpenBLAS symbols the `linalg::eigh_dc` FFI calls (dsyevd_). In workspace
# builds the backend is already linked via the SCF/RPA crates; this dev-dep
# only matters for isolated per-crate test runs.
openblas-src = { workspace = true }
ndarray-linalg = { workspace = true }
