[package]
name = "ferric-integrals"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ndarray = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
bytemuck = "1"
libc = "0.2"

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
ferric-testkit = { path = "../ferric-testkit" }
serde = { workspace = true }
serde_json = { workspace = true }
# Lebedev angular sets for the md3c1e measurement harness (grid positions
# rebuilt without a ferric-dft dependency); ferric-quadrature depends only
# on ferric-core, so no cycle.
ferric-quadrature = { path = "../ferric-quadrature" }
# Reference-file format for examples/gen_cuest_oe_reference.rs (CPU-only
# build of ferric-cuest; it depends only on ferric-core, so no cycle).
ferric-cuest = { path = "../ferric-cuest" }

[features]
libint2_terf = []
