[package]
name = "ferric-dft"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-quadrature = { path = "../ferric-quadrature" }
ndarray = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }

[features]
default = []
# Device offload of the screened XC grid's per-batch GEMMs (xc_batch::gpu).
# Additive; default builds unchanged.
gpu = ["ferric-core/gpu"]
# FORCE_HOST seam for the device tests. Never enabled by a shipped build.
test-seams = ["gpu", "ferric-core/test-seams"]

[dev-dependencies]
ferric-scf = { path = "../ferric-scf" }
# Used by tests/grid_prune_live_scf.rs to read the same PySCF reference JSONs
# the ferric-scf DFT reference suites gate on, so the pruned-SCF validation
# reuses those tolerances verbatim rather than inventing its own.
serde = { workspace = true }
serde_json = { workspace = true }
