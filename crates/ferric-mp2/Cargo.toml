[package]
name = "ferric-mp2"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-scf = { path = "../ferric-scf" }
# att_vv10.rs (attenuated MP2 + VV10, "MP2-V") needs the VV10 nonlocal
# functional and the Becke-Lebedev grid it integrates on. NO CYCLE: ferric-dft
# depends only on ferric-core + ferric-integrals (it takes ferric-scf as a
# DEV-dependency only), so this edge points strictly down the graph. It also
# adds NO new link-time cost: ferric-scf already depends on ferric-dft, so
# every ferric-mp2 consumer was already pulling libxc in transitively.
ferric-dft = { path = "../ferric-dft" }
ferric-tensors = { path = "../ferric-tensors" }
ferric-quadrature = { path = "../ferric-quadrature" }
# `rayon` feature enables ndarray::Zip::into_par_iter for the par-over-aux-P
# 3-center MO transform (mo_transform.rs). Additive feature, local to this crate.
ndarray = { workspace = true, features = ["rayon"] }
ndarray-linalg = { workspace = true }
rayon = { workspace = true }
mpi = { version = "0.7", optional = true }

[features]
default = []
# ferric-scf/mpi is required, not just ferric-core/mpi: RHF's DF-J/DF-K
# builders (ferric_scf::df_j::DfJ / df_k::DfK) gate their cross-rank
# Allreduce behind `#[cfg(feature = "mpi")]` INSIDE ferric-scf itself. Without
# enabling ferric-scf's own mpi feature, ferric-core/mpi alone still makes
# ParallelContext report a real multi-rank world (so DfJ/DfK stripe the aux
# band via new_banded(Some(ctx))), but the Allreduce that sums the per-rank
# partial J/K back into the full matrix never compiles in — each rank then
# silently converges "successfully" to a different, wrong energy built from
# only its own band. (Found empirically while building T9: -np 2 water RHF
# converged to two different garbage energies, ~+108111 Ha and ~+108176 Ha,
# with `cargo build -p ferric-mp2 --features mpi`; the same RHF call via
# `cargo build -p ferric-scf --features mpi` was correct, which is what
# traced this to the missing feature edge.)
mpi = ["dep:mpi", "ferric-core/mpi", "ferric-scf/mpi"]

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
