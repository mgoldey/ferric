[package]
name = "ferric-export"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-dft = { path = "../ferric-dft" }
ferric-integrals = { path = "../ferric-integrals" }
ndarray = { workspace = true }
# Writes Stored npz only (NpzWriter::new); no deflate/zopfli in the wheel.
# default-features = false also drops the other default, num-complex-0_4
# (complex-element .npy read/write); every exported array is real.
ndarray-npy = { version = "0.9", default-features = false, features = ["npz"] }
thiserror = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
ferric-scf = { path = "../ferric-scf" }
