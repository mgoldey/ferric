[package]
name = "ferric-cli"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

# CLI logic (main() + config parsing) lives here as a LIBRARY, not only a
# binary, so ferric-python can depend on this crate and call ferric_cli::main()
# from a #[pyfunction] compiled into its OWN .so -- the `ferric` console-script
# entry point pip installs, with no second compiled binary in the wheel (see
# crates/ferric-python/src/lib.rs and pyproject.toml [project.scripts]).
[lib]
name = "ferric_cli"
path = "src/lib.rs"

# Primary CLI driver, still built as real binaries for `cargo build`/`cargo
# run` and everything that already invokes them (README/tutorials/scripts,
# ferric-batch's std::process::Command shellout). Both are now thin wrappers
# over the lib above rather than main.rs directly: `ferric-cli` (historical
# name) and `ferric` (friendlier; the name `ferric-batch` shells out to --
# see src/bin/ferric-batch.rs).
[[bin]]
name = "ferric-cli"
path = "src/bin/ferric-cli.rs"

[[bin]]
name = "ferric"
path = "src/bin/ferric.rs"

[[bin]]
name = "ferric-batch"
path = "src/bin/ferric-batch.rs"

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-scf = { path = "../ferric-scf" }
ferric-mp2 = { path = "../ferric-mp2" }
# Needed by the `mp2-v` config builder: AttVv10Config's `nlc_grid`
# (ferric_dft::grid::AtomicGridConfig) and `vv10_damping`
# (ferric_dft::vv10::Vv10Damping) are ferric-dft types re-exported through
# ferric-mp2's public API, so the CLI must name the crate to construct them.
ferric-dft = { path = "../ferric-dft" }
ferric-rpa = { path = "../ferric-rpa" }
ferric-gw = { path = "../ferric-gw" }
ferric-export = { path = "../ferric-export" }
ferric-cc = { path = "../ferric-cc" }
ferric-tddft = { path = "../ferric-tddft" }
toml = { workspace = true }
serde = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
