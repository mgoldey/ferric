[package]
name = "ferric-pbc"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Periodic-boundary-condition primitives for ferric (cell, Ewald, Madelung, analytic pair-density Fourier transforms, Gamma-point periodic hcore)"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
# JBuilder/KBuilder traits (dense_aft) and solve_rhf_injected in tests. No
# cycle: ferric-scf does not depend on ferric-pbc.
ferric-scf = { path = "../ferric-scf" }
ndarray = { workspace = true }
# eigh of the RS-GDF aux metric (explicit lindep cut; never Cholesky/LU).
ndarray-linalg = { workspace = true }
# Same spec as ferric-gw (the only other num-complex user); resolves to 0.4.6.
num-complex = "0.4"

[dev-dependencies]
serde_json = { workspace = true }
