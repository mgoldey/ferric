[package]
name = "ferric-scf"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-dft = { path = "../ferric-dft" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-pcm = { path = "../ferric-pcm" }
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }
openblas-src = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
mpi = { workspace = true, optional = true }

[features]
default = []
mpi = ["dep:mpi", "ferric-core/mpi"]
# Incomplete CFMM J-builder. OFF by default: CfmmJ::build returns an
# identically-zero Coulomb matrix because add_shell_multipoles /
# add_far_field_to_j / direct_interaction are unimplemented stubs (see
# wiki/cfmm-m2l-investigation.md). It implements the public JBuilder trait,
# so leaving it compiled-in makes a silently-wrong J reachable. Enable only
# to work ON the CFMM implementation.
cfmm-incomplete = []

[dev-dependencies]
ferric-dft = { path = "../ferric-dft" }
serde = { workspace = true }
serde_json = { workspace = true }
