[package]
name = "ferric-tddft"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-scf = { path = "../ferric-scf" }
ferric-dft = { path = "../ferric-dft" }
ferric-mp2 = { path = "../ferric-mp2" }
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# validation_tddft.rs anchors run_tddft against the PySCF-validated library
# TDA path (ferric_gw::tddft::run_tda_dft). Dev-only: ferric-gw does not depend
# on ferric-tddft, so there is no cycle.
ferric-gw = { path = "../ferric-gw" }
