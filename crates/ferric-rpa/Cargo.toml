[package]
name = "ferric-rpa"
version = "0.1.0"
license.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-integrals = { path = "../ferric-integrals" }
ferric-scf = { path = "../ferric-scf" }
ferric-mp2 = { path = "../ferric-mp2" }
ferric-quadrature = { path = "../ferric-quadrature" }
ferric-dft = { path = "../ferric-dft" }
serde = { workspace = true }
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }
openblas-src = { workspace = true }
rayon = { workspace = true }
mpi = { workspace = true, optional = true }

[features]
default = []
# Same transitive-feature-edge lesson T9 documented for ferric-mp2/Cargo.toml:
# ferric-core/mpi alone makes ParallelContext report a real multi-rank world,
# but does NOT compile in the #[cfg(feature = "mpi")] Allreduce blocks that
# live INSIDE ferric-scf (DF-J/DF-K) or ferric-mp2 (RI-MP2 aux-band
# reduction) themselves. run_pdep_rpa_mpi calls compute_rpa_intermediates
# (ferric-mp2) on top of a DF-J/DF-K RHF reference (ferric-scf), so both of
# those crates' OWN mpi features must be enabled transitively, not just
# ferric-core's.
mpi = ["dep:mpi", "ferric-core/mpi", "ferric-scf/mpi", "ferric-mp2/mpi"]

[dev-dependencies]
ferric-pcm = { path = "../ferric-pcm" }
serde = { workspace = true }
serde_json = { workspace = true }
