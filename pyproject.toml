[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ferric"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.13.0",
    "maturin[patchelf]>=1.13.3",
    "matplotlib>=3.8",
    "requests>=2.34.0",
    "numpy>=2.0.0",
    "scipy>=1.11",
    "h5py>=3.9",
    "pyscf>=2.10",
    "sympy>=1.14.0",
]

[tool.maturin]
manifest-path = "crates/ferric-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Prevent uv from rebuilding the Rust extension on every `uv run`.
# The maturin editable install in .venv is the source of truth; cargo is invoked explicitly.
no-build-isolation-package = ["ferric"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
