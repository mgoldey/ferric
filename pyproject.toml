[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ferric"
version = "0.1.0"
description = "Python bindings for ferric, a Rust-native quantum chemistry engine"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Matthew Goldey", email = "matthew.goldey@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.0",
    "gemmi>=0.7",
]

# `pip install ferric` puts `ferric` on PATH -- calls straight into
# ferric_cli::main() (crates/ferric-cli/src/lib.rs) compiled into the SAME
# .so this extension module already is, via the `_cli_main` #[pyfunction]
# (crates/ferric-python/src/lib.rs). No second compiled binary in the wheel:
# maturin's own docs recommend exactly this shape ("Both binary and
# library?") over shipping ferric-cli's existing standalone binary
# separately, which would roughly double the wheel by linking
# OpenBLAS/libxc/libint2 a second time. Compiled-code performance is
# identical to the standalone `ferric`/`ferric-cli` binaries -- same
# --release-optimized Rust, same native linkage -- the only added cost is a
# one-time Python-interpreter boot, noise against the SCF/MP2/RPA job
# runtimes this CLI runs.
[project.scripts]
ferric = "ferric:_cli_main"

[project.optional-dependencies]
# Docking (tier 1 of the cost hierarchy -- see tools/campaign/hierarchy.py).
# Vina SEARCHES pose space; nothing else in this repo does. Apache-2.0
# engine, LGPL-2.1 prep layer.
#
# These are an EXTRA rather than a core dependency because the compiled
# `ferric` extension does not use them -- only `tools/docking` does, and it
# imports them at call time. Keeping them core made `pip install ferric`
# fail outright on Python 3.13: PyPI's vina 1.2.7 ships wheels for cp38-cp312
# only, so 3.13 falls back to the sdist, which needs Boost headers that are
# not present on a stock runner. That broke the wheel smoke test for a
# reason having nothing to do with the wheel.
#
# rdkit and scipy are listed explicitly even though only meeko imports them
# directly: meeko 0.8.0 declares zero dependencies on PyPI (`pip show meeko`
# reports an empty `Requires:`) despite needing several at import time.
# Chased to the end in an isolated venv carrying ONLY docking's own declared
# deps (not dev's): `import meeko` fails first on rdkit (preparation.py),
# then on scipy (receptor_pdbqt.py), then on gemmi (chemtempgen.py) -- gemmi
# is not re-listed here because it is already a core dependency above, so it
# is always present alongside this extra, but rdkit and scipy are not.
# Installing rdkit alone still fails on scipy: the extra is not usable until
# all of its own gaps are filled, so guessing one fix and stopping there
# would still leave `pip install 'ferric[docking]'` broken. Verified end to
# end against the published wheel (ferric core + this extra, no [dev]):
# meeko preparing a real RDKit molecule to PDBQT, and a bare `Vina(...)`
# construction. Both rdkit and scipy ship wheels across cp310-cp313 (rdkit
# also cp314), so neither reintroduces the source-build problem vina itself
# had on 3.13.
docking = [
    "vina>=1.2.7",
    "meeko>=0.8.0",
    "rdkit>=2024.3",
    "scipy>=1.11",
]
dev = [
    "ipython>=9.13.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "h5py>=3.9",
    "sympy>=1.14.0",
    "pytest>=9.1.1",
]
reference = [
    "pyscf>=2.10",
]
build = [
    "maturin[patchelf]>=1.13.3",
]

[tool.maturin]
manifest-path = "crates/ferric-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Prevent uv from rebuilding the Rust extension on every `uv run`.
# The maturin editable install in .venv is the source of truth; cargo is invoked explicitly.
no-build-isolation-package = ["ferric"]


[tool.pytest.ini_options]
# Make the repo root importable so `tools.tox`, `tools.morph`, `tools.campaign`
# and `tools.active_site` resolve regardless of HOW pytest is invoked.
#
# Without this, `python -m pytest` works (it prepends the cwd to sys.path) while
# a bare `pytest` does NOT, so the suites passed by hand and failed under
# scripts/ci-gate.sh, which calls `uv run --no-sync pytest`. That cost all 17
# tools/ suites -- including the pre-existing active_site ones -- with
# `ModuleNotFoundError: No module named 'tools'` at collection time.
#
# `tools/` is a namespace package (no __init__.py at its root) by design, so
# pythonpath is the fix rather than adding package markers.
pythonpath = ["."]
