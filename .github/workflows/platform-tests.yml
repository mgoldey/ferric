name: Platform tests (macOS / Windows)

# Runs a representative slice of the Rust test suite and the whole Python
# binding suite on macOS arm64 (macos-15) and Windows x86_64 (windows-2025),
# the two platforms the wheels ship for besides Linux. ci.yml stays the Linux
# gate; nothing here changes it.
#
# NON-BLOCKING: this workflow is not a required check. Make it one only after
# it has gone green twice on main.
#
# NATIVE DEPS COME FROM THE CACHE, NEVER FROM A BUILD. Both jobs restore the
# libint2 and OpenBLAS+libxc caches that native-deps-macwin.yml saves (called
# by wheels.yml: nightly on main, tags), under the keys
# scripts/wheels/native-cache-key.sh computes from scripts/wheels/native-pins.env
# (the same script the builder uses). GitHub lets a run restore caches of its
# own ref and of main, so on a PR this hits once main's nightly has built the
# current keys. On a MISS (before the first nightly after a merge, after a pin
# or build-script change, or after cache eviction) every test step is skipped,
# the job ends green, and a notice plus a step-summary line say
# "SKIPPED: no native-deps cache ...". It is skipped rather than failed because this
# check is non-blocking and a cold libint2 build (77-91 min) does not belong in
# a PR check. A green run is a test result only if that notice is absent.
#
# Rust slice: ferric-core (lib + integration tests, incl. memory::sys and
# memory::tests), ferric-integrals (lib + integration tests), ferric-scf lib
# tests. Python: crates/ferric-python/tests against a wheel built and repaired
# (delocate / delvewheel) on the same runner, installed into a fresh venv with
# the build prefixes hidden, exactly as a user would get it.
#
# Tests that cannot run off Linux carry a precondition `#[ignore = "..."]` /
# `#[cfg(...)]` (Rust) or `skipif` (Python) with the reason; the list is in
# the step summary of every run (`-rs`).

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'testdata/**'
      - 'examples/*.toml'
      - 'scripts/ci-platform-env.sh'
      - 'scripts/wheels/**'
      - '.config/nextest.toml'
      - '.github/workflows/platform-tests.yml'
  workflow_dispatch: {}

# Reads the repository and the actions cache, uploads artifacts: nothing more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  PYTHON_VERSION: "3.12"

jobs:
  rust:
    name: rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-2025, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    env:
      # Same pin as ci.yml: tests never auto-detect the budget from a shared
      # runner's momentary MemAvailable.
      FERRIC_MEM_BUDGET_GB: "3"
    steps:
      # The boys.h override tests compare committed bytes (.patch, override
      # header) exactly; CRLF conversion on the Windows checkout breaks that.
      - name: No CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # NATIVE DEPS: the release wheels' own from-source builds (libint2 2.7.2
      # small export, static; OpenBLAS with a fixed TARGET; libxc 6.2.2; Eigen
      # 3.4.0), restored from the actions/cache entries
      # .github/workflows/native-deps-macwin.yml saves (keys from
      # scripts/wheels/native-cache-key.sh, the one definition both use).
      # NO CACHE, NO TEST: this job never builds the deps itself (a cold
      # libint2 build is 77-91 min). On a miss every later step is skipped
      # with a notice and the job ends green; see the header.
      - name: Native deps cache keys
        id: nkeys
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for part in libint2 blas-xc; do
            # An assignment, so a failing key script fails the step (inside
            # `echo "$(...)"` its exit status was lost and the key was empty).
            key="$(bash scripts/wheels/native-cache-key.sh "$part" "$NATIVE_PLATFORM")"
            [ -n "$key" ] || { echo "::error::empty native-deps cache key for $part"; exit 1; }
            echo "$part=$key" | tee -a "$GITHUB_OUTPUT"
          done

      - name: Restore native libint2
        id: c-libint2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-libint2
          key: ${{ steps.nkeys.outputs.libint2 }}

      - name: Restore native OpenBLAS + libxc
        id: c-blas-xc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-blas-xc
          key: ${{ steps.nkeys.outputs.blas-xc }}

      - name: Native deps available?
        id: natives
        env:
          HIT_LIBINT2: ${{ steps.c-libint2.outputs.cache-hit }}
          HIT_BLAS_XC: ${{ steps.c-blas-xc.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$HIT_LIBINT2" = true ] && [ "$HIT_BLAS_XC" = true ]; then
            mkdir -p native
            cp -R native-libint2/. native/
            cp -R native-blas-xc/. native/
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            msg="SKIPPED: no native-deps cache for ${{ matrix.platform }} (libint2 hit: ${HIT_LIBINT2:-false}, blas-xc hit: ${HIT_BLAS_XC:-false}). They are built and cached by native-deps-macwin.yml (wheels.yml's nightly on main, or a wheels run on this branch); this run tests nothing."
            echo "::notice title=platform tests skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Build tools only (libecpint is a CMake build); nothing here is linked.
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        if: steps.natives.outputs.ready == 'true'
        with:
          environment-name: nd
          init-shell: bash
          create-args: >-
            -c conda-forge
            cmake ninja pkg-config

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ steps.natives.outputs.ready == 'true' && (runner.os == 'Windows') }}

      - name: Install Rust toolchain
        if: steps.natives.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          toolchain: 1.99.1  # RUST_PIN: see the note at the first install step

      - name: Restore cargo cache
        if: steps.natives.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-nextest
        if: steps.natives.outputs.ready == 'true'
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Native prefix
        if: steps.natives.outputs.ready == 'true'
        run: |
          echo "DEPS_PREFIX=$GITHUB_WORKSPACE/native" >> "$GITHUB_ENV"
          ls native/lib native/include

      - name: Build tests
        if: steps.natives.outputs.ready == 'true'
        run: |
          set -euo pipefail
          source scripts/ci-platform-env.sh
          rustc --version; cargo --version; "${CXX:-c++}" --version | head -1
          cargo nextest list --locked -p ferric-core -p ferric-integrals > /dev/null
          cargo nextest list --locked -p ferric-scf --lib > /dev/null

      - name: Test ferric-core + ferric-integrals
        if: steps.natives.outputs.ready == 'true'
        run: |
          # No `set -e`: the summary must be written when the tests fail too.
          set -uo pipefail
          source scripts/ci-platform-env.sh || exit 1
          cargo nextest run --locked --profile ci --no-tests=fail \
            -p ferric-core -p ferric-integrals 2>&1 | tee nextest-core-integrals.log
          rc=${PIPESTATUS[0]}
          echo "### ferric-core + ferric-integrals" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Summary|SKIP|FAIL" nextest-core-integrals.log | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      # The k-point code is the only complex Hermitian eigh / complex GEMM
      # user; this pins that layer of the linked OpenBLAS directly.
      - name: Test complex BLAS/LAPACK ABI (ferric-pbc)
        if: ${{ steps.natives.outputs.ready == 'true' && (!cancelled()) }}
        run: |
          set -euo pipefail
          source scripts/ci-platform-env.sh
          cargo nextest run --locked --profile ci --no-tests=fail \
            -p ferric-pbc --test complex_lapack_abi 2>&1 | tee nextest-pbc-abi.log

      - name: Test ferric-scf (lib)
        if: ${{ steps.natives.outputs.ready == 'true' && (!cancelled()) }}
        run: |
          # No `set -e`: the summary must be written when the tests fail too.
          set -uo pipefail
          source scripts/ci-platform-env.sh || exit 1
          cargo nextest run --locked --profile ci --no-tests=fail \
            -p ferric-scf --lib 2>&1 | tee nextest-scf.log
          rc=${PIPESTATUS[0]}
          echo "### ferric-scf --lib" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Summary|FAIL" nextest-scf.log | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: Upload test logs
        if: ${{ steps.natives.outputs.ready == 'true' && (!cancelled()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-tests-${{ matrix.os }}
          path: |
            nextest-*.log
            target/nextest/ci/junit.xml
          retention-days: 14

  python:
    name: python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-2025, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: No CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # NATIVE DEPS: the release wheels' own from-source builds (libint2 2.7.2
      # small export, static; OpenBLAS with a fixed TARGET; libxc 6.2.2; Eigen
      # 3.4.0), restored from the actions/cache entries
      # .github/workflows/native-deps-macwin.yml saves (keys from
      # scripts/wheels/native-cache-key.sh, the one definition both use).
      # NO CACHE, NO TEST: this job never builds the deps itself (a cold
      # libint2 build is 77-91 min). On a miss every later step is skipped
      # with a notice and the job ends green; see the header.
      - name: Native deps cache keys
        id: nkeys
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for part in libint2 blas-xc; do
            # An assignment, so a failing key script fails the step (inside
            # `echo "$(...)"` its exit status was lost and the key was empty).
            key="$(bash scripts/wheels/native-cache-key.sh "$part" "$NATIVE_PLATFORM")"
            [ -n "$key" ] || { echo "::error::empty native-deps cache key for $part"; exit 1; }
            echo "$part=$key" | tee -a "$GITHUB_OUTPUT"
          done

      - name: Restore native libint2
        id: c-libint2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-libint2
          key: ${{ steps.nkeys.outputs.libint2 }}

      - name: Restore native OpenBLAS + libxc
        id: c-blas-xc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-blas-xc
          key: ${{ steps.nkeys.outputs.blas-xc }}

      - name: Native deps available?
        id: natives
        env:
          HIT_LIBINT2: ${{ steps.c-libint2.outputs.cache-hit }}
          HIT_BLAS_XC: ${{ steps.c-blas-xc.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$HIT_LIBINT2" = true ] && [ "$HIT_BLAS_XC" = true ]; then
            mkdir -p native
            cp -R native-libint2/. native/
            cp -R native-blas-xc/. native/
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            msg="SKIPPED: no native-deps cache for ${{ matrix.platform }} (libint2 hit: ${HIT_LIBINT2:-false}, blas-xc hit: ${HIT_BLAS_XC:-false}). They are built and cached by native-deps-macwin.yml (wheels.yml's nightly on main, or a wheels run on this branch); this run tests nothing."
            echo "::notice title=platform tests skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Build tools only (libecpint is a CMake build); nothing here is linked.
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        if: steps.natives.outputs.ready == 'true'
        with:
          environment-name: nd
          init-shell: bash
          create-args: >-
            -c conda-forge
            cmake ninja pkg-config

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ steps.natives.outputs.ready == 'true' && (runner.os == 'Windows') }}

      - name: Install Rust toolchain
        if: steps.natives.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          toolchain: 1.99.1  # RUST_PIN: see the note at the first install step

      - name: Restore cargo cache
        if: steps.natives.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Native prefix
        if: steps.natives.outputs.ready == 'true'
        run: |
          echo "DEPS_PREFIX=$GITHUB_WORKSPACE/native" >> "$GITHUB_ENV"
          ls native/lib native/include

      - name: Build wheel (maturin --release)
        if: steps.natives.outputs.ready == 'true'
        run: |
          set -euo pipefail
          source scripts/ci-platform-env.sh
          PY='${{ steps.py.outputs.python-path }}'
          "$PY" -m pip install -q "maturin>=1.7,<2"
          "$PY" -m maturin build --release --locked -i "$PY" --out dist
          ls -la dist

      - name: Repair (delocate / delvewheel)
        if: steps.natives.outputs.ready == 'true'
        run: |
          set -euo pipefail
          source scripts/ci-platform-env.sh
          PY='${{ steps.py.outputs.python-path }}'
          if [ "$RUNNER_OS" = macOS ]; then
            "$PY" -m pip install -q delocate
            DYLD_LIBRARY_PATH="$LIBS_PREFIX/lib:$DEPS_PREFIX/lib" delocate-wheel -v -w wheelhouse dist/*.whl
          else
            "$PY" -m pip install -q delvewheel
            "$PY" -m delvewheel repair --add-path "$LIBS_PREFIX/bin;$DEPS_PREFIX/bin" -w wheelhouse dist/*.whl
          fi
          ls -la wheelhouse

      # Plain bash from here on: no micromamba activation, and the conda root
      # and the native prefix are renamed away so nothing outside the wheel can
      # satisfy a library load.
      - name: Install the wheel into a fresh venv (build prefixes hidden)
        if: steps.natives.outputs.ready == 'true'
        shell: bash {0}
        run: |
          set -euo pipefail
          mv "$MAMBA_ROOT_PREFIX" "$MAMBA_ROOT_PREFIX.hidden"
          mv native native.hidden
          PY='${{ steps.py.outputs.python-path }}'
          "$PY" -m venv "$RUNNER_TEMP/v"
          if [ "$RUNNER_OS" = Windows ]; then
            VPY="$RUNNER_TEMP/v/Scripts/python.exe"; FERRIC="$RUNNER_TEMP/v/Scripts/ferric.exe"
          else
            VPY="$RUNNER_TEMP/v/bin/python"; FERRIC="$RUNNER_TEMP/v/bin/ferric"
          fi
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          echo "FERRIC=$FERRIC" >> "$GITHUB_ENV"
          "$VPY" -m pip install -q wheelhouse/*.whl
          "$VPY" -m pip install -q numpy scipy h5py sympy matplotlib "pytest>=9.1.1"
          # The suite skips ITSELF when `import ferric` fails, which would read
          # as green. Import here, outside pytest, so that fails the job.
          "$VPY" -c "import ferric; print(ferric.__file__); print(ferric.build_info())"

      # PR #633 ported memory detection to macOS/Windows: with no budget set,
      # the CLI must report the auto-detected budget, not the 2 GiB fallback.
      - name: Memory budget is auto-detected
        if: steps.natives.outputs.ready == 'true'
        shell: bash {0}
        run: |
          set -euo pipefail
          unset FERRIC_MEM_BUDGET_GB FERRIC_OOC_BUDGET_GB FERRIC_ERI3_BUDGET_GB
          "$FERRIC" examples/water-rhf.toml > rhf.out 2> rhf.err || { cat rhf.out rhf.err; exit 1; }
          LINE="$(grep -a "memory budget:" rhf.err)"
          echo "$LINE" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -aF "[source: auto (0.8 × available RAM)]" <<<"$LINE"

      - name: pytest crates/ferric-python/tests
        if: steps.natives.outputs.ready == 'true'
        shell: bash {0}
        env:
          FERRIC_MEM_BUDGET_GB: "3"
          PYTHONUNBUFFERED: "1"
          # Many tests read the repo's own UTF-8 sources/docs with a bare
          # read_text(); Windows' locale default is cp1252.
          PYTHONUTF8: "1"
        run: |
          set -uo pipefail
          # Tests that shell out to the `ferric` console script find the venv's.
          export PATH="$(dirname "$VPY"):$PATH"
          "$VPY" -m pytest crates/ferric-python/tests -q -rs -p no:cacheprovider \
            --junitxml=pytest-junit.xml 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          echo "### pytest (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          grep -aE "^(SKIPPED|FAILED|ERROR)|passed|failed" pytest.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: Upload test logs
        if: ${{ steps.natives.outputs.ready == 'true' && (!cancelled()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-tests-${{ matrix.os }}
          path: |
            pytest.log
            pytest-junit.xml
            rhf.err
          retention-days: 14
