name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  LIBINT_VERSION: "2.7.2"
  LIBINT2_PREFIX: /usr

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    # With libint2 from the distro package the job is build+test only, which
    # ran ~20 min of test time locally. 45 min leaves ample headroom while
    # still failing fast instead of stalling to GitHub's 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libint2-dev

      # libint2 comes from the DISTRO PACKAGE, not a source build.
      #
      # Building the mpqc4 tarball on a 4-vCPU runner takes >75 minutes: it blew
      # a 75-minute job cap on run 32585659903 having done nothing else, and the
      # two runs before it spent 1h16m and 1h55m mostly here. Nothing else in
      # this workflow is slow -- the whole rest of the job is minutes. Caching
      # could not rescue it either, because the cache only populates after a
      # green run, which the timeout prevented.
      #
      # jammy ships libint2-dev 2.7.1 (ferric requires 2.7+) with headers in
      # /usr/include/libint2, libint2.a/.so in /usr/lib/x86_64-linux-gnu, and
      # config.h -- so LIBINT2_PREFIX=/usr just works and the step is seconds.
      #
      # The capability check below is NOT decoration. G12 and 2nd derivatives
      # are fixed when a libint2 export is GENERATED, so a distro build can
      # silently lack them. ferric's gradients need INCLUDE_ERI >= 1; the
      # G12-dependent tests already detect absence at run time and skip. Assert
      # the one we actually depend on rather than discovering it in a test.
      - name: Verify libint2 capabilities
        run: |
          set -euo pipefail
          CFG=/usr/include/libint2/config.h
          echo "--- libint2 config ---"
          grep -E 'INCLUDE_ERI|INCLUDE_ONEBODY|INCLUDE_G12|LIBINT_MAX_AM' "$CFG" || true
          eri=$(sed -n 's/^#define INCLUDE_ERI \([0-9]*\)$/\1/p' "$CFG")
          if [ -z "$eri" ] || [ "$eri" -lt 1 ]; then
            echo "::error::libint2 lacks 1st-derivative ERI (INCLUDE_ERI=${eri:-unset}); ferric gradients cannot work"
            exit 1
          fi
          echo "INCLUDE_ERI=$eri (>=1 required) OK"

          # build.rs links with -L{LIBINT2_PREFIX}/lib, but the Debian package
          # installs to the MULTIARCH dir /usr/lib/x86_64-linux-gnu. Without a
          # bridge the linker silently fails to find libint2.a. Symlink rather
          # than patch build.rs, so the local /home/$USER/.local layout (which
          # does use {prefix}/lib) keeps working unchanged.
          test -f /usr/lib/x86_64-linux-gnu/libint2.a
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libint2.a /usr/lib/libint2.a
          echo "linked /usr/lib/libint2.a -> multiarch"
          ls -la /usr/lib/libint2.a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Same restore/save split as libint2 above: a red test step must not cost
      # the next run a full cold rebuild. Keyed on Cargo.lock so a dependency
      # change still invalidates it.
      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Save cargo cache
        # Same reasoning as the libint2 save: !cancelled() keeps the save on a
        # RED test run (the whole point) but drops it when cancelled, which
        # previously wrote a 208-BYTE entry later runs would have restored.
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
