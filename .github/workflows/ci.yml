name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  LIBINT_VERSION: "2.7.2"
  LIBINT2_PREFIX: /home/runner/libint2

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev

      # RESTORE-only. actions/cache saves in a post-step that runs ONLY when the
      # job succeeds, so while any test was failing libint2 never got cached and
      # every run paid a ~1h rebuild before reaching the tests -- a loop that
      # could not break itself. The matching save step runs right after the
      # build with if: always(), so the cache populates even on a red run.
      - name: Restore libint2 cache
        id: cache-libint
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LIBINT2_PREFIX }}
          key: libint-${{ env.LIBINT_VERSION }}-ubuntu2204-v1

      - name: Build libint2
        if: steps.cache-libint.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q https://github.com/evaleev/libint/releases/download/v${LIBINT_VERSION}/libint-${LIBINT_VERSION}-mpqc4.tgz
          tar xzf libint-${LIBINT_VERSION}-mpqc4.tgz
          cd libint-${LIBINT_VERSION}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$LIBINT2_PREFIX \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      - name: Save libint2 cache
        # if: always() -- libint2 is an EXTERNAL dependency; whether ferric's
        # own tests pass has no bearing on whether this build artifact is
        # reusable. Saving here is what lets a red run stop costing an hour.
        if: always() && steps.cache-libint.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LIBINT2_PREFIX }}
          key: libint-${{ env.LIBINT_VERSION }}-ubuntu2204-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Same restore/save split as libint2 above: a red test step must not cost
      # the next run a full cold rebuild. Keyed on Cargo.lock so a dependency
      # change still invalidates it.
      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
