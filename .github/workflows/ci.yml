name: CI

# `paths-ignore` on push/pull_request ONLY. A docs-only branch pays the full
# whole workspace build and test suite for a Markdown
# edit that cannot affect any of it — measured on the PR that added `site/`.
#
# Deliberately conservative: this lists only paths that CANNOT change compiled
# behaviour or test outcomes. `crates/**`, `Cargo.*`, `scripts/`, `testdata/`
# and `examples/` are all absent on purpose — an examples TOML is an input to
# an integration test, and a scripts/ change can move the gate itself.
#
# NOT applied to `schedule` or `workflow_dispatch`: the nightly run exists to
# catch drift that a path filter would by definition hide, and a manual
# dispatch is someone explicitly asking for a full run.
on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - '**/*.md'
      - 'site/**'
      - 'LICENSE-*'
      - '.gitignore'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore: *docs_only
  schedule:
    # 04:17 UTC daily -- runs the tests the push job defers, so deferring is a
    # latency tradeoff and not a coverage loss. Off-the-hour on purpose.
    #
    # Split into Mon-Sat + Sunday so the WEEKLY `validation` job can key on
    # its own cron string (`github.event.schedule`) while every nightly job
    # still runs exactly once a day: the nightly jobs gate on
    # `event_name == 'schedule'`, which BOTH entries satisfy, and the two
    # never fire on the same day. A third, separate weekly entry would instead
    # have run the whole nightly suite twice every Sunday. The guard test
    # crates/ferric-cli/tests/ci_validation_tier_guard.rs asserts the
    # validation job's `if:` names a cron string that is listed here.
    - cron: '17 4 * * 1-6'
    - cron: '17 4 * * 0'
  workflow_dispatch: {}

concurrency:
  # Cancel a SUPERSEDED run on the SAME pull request -- the job can run up to
  # 170 minutes on a disk-constrained runner, and there is no reason to let a
  # push-3-commits-ago build keep occupying a runner once push-4 has arrived.
  #
  # A `schedule` or `workflow_dispatch` run is NEVER cancelled, because it is
  # ALONE in its group: the key ends in `github.run_id` for those events.
  # Two mechanisms cancel a run in a shared group, and `cancel-in-progress`
  # controls only the first:
  #   - cancel-in-progress: a new run cancels the RUNNING one. Gated on
  #     `pull_request` below, so a running main or schedule run is never hit.
  #   - pending replacement: a group holds at most ONE pending run, and a newer
  #     arrival cancels the older PENDING one REGARDLESS of cancel-in-progress.
  # `github.ref` is `refs/heads/main` for a main push AND for the nightly
  # schedule run, so a key built from the ref alone put them in ONE group. A
  # schedule run that queued behind a running main push was then cancelled,
  # with no jobs, by the next push: runs 38045594810, 38133256076,
  # 39018001505 and 39112980617 (2026-10-10/11/17/18) each ended `cancelled`
  # within seconds of a push being created, and two of those were the Sunday
  # run, so the weekly validation job did not run for two weeks.
  # crates/ferric-cli/tests/ci_validation_tier_guard.rs pins this key.
  #
  # Main pushes still share `<workflow>-push-refs/heads/main`: a pending push
  # run is superseded by a newer push (the newest main commit is tested), and a
  # RUNNING one is never cancelled.
  #
  # Interaction with the cache-poisoning guard below ("Save cargo cache"): a
  # run GitHub cancels because a newer PR run superseded it is, from the
  # cache-save step's point of view, identical to a run a human cancelled by
  # hand -- both hit the job's cancellation path before the save step's `if:`
  # is evaluated. The cargo save reads `if: ${{ !cancelled() }}` (a cancelled
  # run IS `cancelled()`), so it is skipped exactly as it already is for a
  # manual cancellation. Auto-cancellation opens no new path to the
  # truncated/208-byte-cache failure mode those guards exist to prevent.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  # Pin the memory budget so tests never auto-detect it from the runner.
  # Auto-detect is min(cgroup limit, /proc/meminfo MemAvailable); on a shared
  # runner MemAvailable can dip to ~0 for an instant mid-test-burst, and on
  # 2026-09-07 that failed vv10::cutoff_energy_bounded_water with
  # "needs 0.01 GB but the budget is 0.00 GB" on a PR that never touched
  # ferric-dft. Explicit per-test budgets still override this (config > env).
  FERRIC_MEM_BUDGET_GB: "3"
  # Disk WAS the binding constraint on a GitHub runner: ~14 GB free when the
  # incidents below happened. MEASURED 2026-10-27 (build-tests of run
  # 40542404911, ubuntu-22.04 image 20261021.618): / is 146 GB with 87 GB
  # free before the "Free runner disk space" step and 109 GB after it, and
  # build-tests peaked at ~26 GB. The settings below stay because they also
  # shrink the binaries. Each of the ~190 integration-test binaries is
  # 200-335 MB; measured
  # locally, a 236 MB ferric-scf test binary carries 82 MB of .debug_*
  # sections, so line tables trim roughly a third per binary (and
  # `target/debug/incremental` would add GBs more if enabled). A branch
  # that touches ferric-core rebuilds EVERY binary on top of the restored
  # cache, and run 33210162947 died with "No space left on device" (run
  # 33189038313 stalled on the full disk until the job timeout). Line tables
  # keep file:line in panics/backtraces, which is all a CI failure needs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_INCREMENTAL: "0"
  # Force OpenBLAS's runtime kernel choice to the mature AVX2 (Haswell) set.
  # ferric links the DISTRO OpenBLAS (0.3.20 on ubuntu-22.04, via the
  # `system` features of openblas-src / ndarray-linalg), whose DYNAMIC_ARCH
  # dispatch predates the Zen 4 / Sapphire Rapids VMs GitHub now allocates.
  # Run 33213558759 (2026-08-28) produced GARBAGE from that library on a cold
  # rebuild -- 2.5 electrons integrated instead of 10, dsyevd eigenvectors
  # off by O(1), `V cholesky failed: LAPACK return_code 22`, GEMM results
  # changing by O(1) with the thread count -- while the identical binaries
  # are correct locally and were correct on the runner that built the
  # 2026-08-26 cache. Nothing in the tree touches BLAS; the hardware moved.
  # The 'Runner hardware / BLAS' step below prints the CPU model and the
  # active BLAS/LAPACK alternatives so the next such drift is diagnosable.
  OPENBLAS_CORETYPE: Haswell
  LIBINT2_PREFIX: /home/runner/libint2
  # Every job installs the sha256-pinned stock libint2 2.13.1
  # (scripts/install-libint.sh), whose boys.h ferric overrides (GmEval copy,
  # Boys/Tenno table-edge and overflow fixes; shim/libint2_overrides/). Make
  # a boys.h that is not a known stock file a BUILD ERROR here instead of a
  # warning, so a new libint pin or a stale cache cannot silently drop them.
  FERRIC_REQUIRE_PATCHED_BOYS: "1"

jobs:
  lint:
    name: lint (check, clippy, rustdoc)
    runs-on: ubuntu-22.04
    # Generous only to cover a cold cargo cache; the steady
    # state is ~8 min including setup.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The ubuntu-22.04 image ships toolchains this job never uses (.NET,
      # Android SDK, GHC, CodeQL, Swift). Deleting them freed 21 GB (87 ->
      # 109 GB free, run 40542404911); it was added when the runner had only
      # ~14 GB free. `df` before/after so the next
      # disk-space failure is visible in the log instead of a mystery.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          # NOTE /usr/local/share/boost is deleted here, and libint2's
          # engine.impl.h does `#include <boost/preprocessor.hpp>`. That is why
          # `libboost-dev` is in the apt list below and must stay there: without
          # it the shim compile dies with "boost/preprocessor.hpp: No such file
          # or directory", and only on runner images that were relying on the
          # bundled boost this step removes. Observed 2026-08-29 -- the same
          # workflow passed hours earlier on an older image, so this fails
          # intermittently as GitHub rolls images, which makes it look like a
          # branch-specific failure when it is not.
          #
          # Why the apt package is sufficient even though crates/ferric-integrals/
          # build.rs never passes -I/usr/include: libboost-dev pulls in
          # libboost<ver>-dev, which owns /usr/include/boost/preprocessor.hpp,
          # and /usr/include is the compiler's DEFAULT system include path. That
          # is also why the build works on a developer box and not on the runner
          # -- a local machine usually has boost installed already.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt sources that ferric does not
          # depend on. When one serves a stale index, `apt-get update` exits 100
          # and this step fails before any ferric code compiles -- see runs
          # 34384861042 / 34385792258, where dl.google.com/linux/chrome-stable
          # returned a Hash Sum mismatch (their Release file was ~7.5h ahead of
          # the Packages.gz it indexed).
          #
          # Match on CONTENT, not filename: deleting google-chrome.list was not
          # enough, because the runner also defines the same repo elsewhere
          # (sources.list / a .sources file). Drop every apt source that
          # mentions dl.google.com wherever it is defined, so this does not
          # depend on the image's naming.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          # Anything still listing it (e.g. an inline entry we cannot delete
          # wholesale) gets commented out.
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          echo "--- remaining apt sources ---"
          grep -rhE '^[^#]' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | grep -vE '^\s*$' || true
          # NOTE: deliberately no `|| true` on apt-get update itself -- a genuine
          # failure to reach the Ubuntu archive must still fail the job.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      - name: Runner hardware / BLAS
        run: |
          lscpu | grep -E 'Model name|Vendor ID|CPU\(s\)|Flags' | cut -c1-240
          nproc; free -g | head -2
          dpkg -l | awk '/^ii +lib(openblas|lapack|blas)/ {print $2, $3}'
          for a in libblas.so.3-x86_64-linux-gnu liblapack.so.3-x86_64-linux-gnu; do
            update-alternatives --display "$a" 2>/dev/null | grep -E "link currently|^/" | head -4
          done
          echo "OPENBLAS_CORETYPE=${OPENBLAS_CORETYPE:-unset}"

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Verify libint2 capabilities
        run: |
          set -euo pipefail
          CFG="$LIBINT2_PREFIX/include/libint2/config.h"
          echo "--- libint2 config ---"
          grep -E 'INCLUDE_ERI|INCLUDE_ONEBODY|INCLUDE_G12|MAX_AM' "$CFG" || true
          fail=0
          # Derivative order each integral class was generated for. ferric's
          # gradients need >= 1; analytic Hessians need 2.
          for macro in LIBINT_INCLUDE_ERI LIBINT_INCLUDE_ONEBODY LIBINT_INCLUDE_ERI3 LIBINT_INCLUDE_ERI2; do
            v=$(sed -n "s/^#define $macro \([0-9]*\)$/\1/p" "$CFG")
            if [ -z "$v" ] || [ "$v" -lt 2 ]; then
              echo "::error::libint2 lacks $macro >= 2 (got '${v:-unset}'); gradients or analytic Hessians would SIGABRT at run time"
              fail=1
            else
              echo "$macro=$v OK"
            fi
          done
          exit $fail

      # Back to @stable, deliberately. Pinning to 1.95 (2c2a17ba) made clippy
      # reproducible but LOST a passing test run: on stable/1.98 the whole
      # fast-tier suite passed in 1265s, and on 1.95 -- with NO test code change,
      # only the pin -- it failed at 25m. The single 1.98 clippy lint that
      # motivated the pin is now fixed at the source (see
      # crates/ferric-ci/src/strings.rs), and `clippy --workspace --all-targets
      # -- -D warnings` exits 0 on BOTH 1.95 and 1.98 locally, so the pin no
      # longer buys anything the fix does not.
      #
      # The SHA below pins the ACTION (dtolnay/rust-toolchain), not the Rust
      # compiler. `stable` in that repo is a BRANCH, not a release tag, so
      # the commit changes as dtolnay periodically bumps whatever it resolves
      # to -- pinning to this commit freezes the toolchain-INSTALL logic
      # (which channel/target it fetches, how it invokes rustup) for
      # supply-chain reasons, but at run time the action still fetches
      # whatever `rustup toolchain install stable` resolves to that day. That
      # is NOT a contradiction of the "Back to @stable, deliberately" comment
      # above: this pin and that one are answering different questions -- the
      # action-SHA pin is about trusting the code that installs the
      # toolchain, the @stable channel choice is about deliberately letting
      # the Rust VERSION float.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: clippy

      # Restore and save are separate steps: a red test step must not cost
      # the next run a full cold rebuild. Keyed on Cargo.lock so a dependency
      # change still invalidates it.
      #
      # `target` is deliberately NOT cached. Measured 2026-09-07: a target/
      # cache is ~9 GB PER PR MERGE REF (two of them were 18.2 GB against the
      # repo's 10 GB cache limit), so every save evicted the other cache
      # entries -- to save ~5 min of incremental compile. The
      # registry + git sources are a few hundred MB and are kept.
      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Check (all targets)
        timeout-minutes: 60
        # --locked from here on every cargo invocation in this workflow.
        # Without it, a Cargo.lock that has drifted from the manifests is
        # silently REPAIRED in-job and the drift is never reported: exactly
        # what happened when crates/ferric-scf/Cargo.toml gained a dependency
        # on ferric-quadrature in 9a0b955 but the lockfile was never
        # regenerated to match -- no cargo command here passed --locked, so
        # every job quietly fixed it up and discarded the fix. Caught and the
        # lockfile regenerated in c022aad; --locked is what stops it
        # recurring silently. If a FUTURE manifest change trips this
        # ("error: the lock file ... needs to be updated"), the fix is
        # `cargo update -p <crate>` (or a plain `cargo build`/`cargo check`)
        # run locally, with the resulting Cargo.lock diff committed -- not
        # dropping --locked.
        run: cargo check --workspace --all-targets --locked

      # FAST TIER, mirroring scripts/ci-gate.sh's CI_GATE_SLOW_TESTS. Slow
      # integration binaries are deferred, not deleted -- see "Slow tests
      # (deferred)" below, which runs them on a schedule and on demand.
      #
      # RE-MEASURED 2026-09-16 from run 35050103626 (PR #69), which TIMED OUT
      # at the 100-minute step cap with 89.3 min of test time and every test
      # passing -- nothing hung, the suite simply outgrew its budget. main was
      # already running 96-102 min against the same cap and passing on luck.
      # The previous calibration in this comment ("583s of ~1300s") had drifted
      # ~4x and no longer described the suite.
      #
      # Measured per-binary cost in that run, the six that are 74% of the time:
      #   23.8 min  ferric-scf  screening_exactness
      #   13.9 min  ferric-scf  csam_screening
      #    9.5 min  ferric-scf  link_scf_anchor
      #    8.2 min  ferric-scf  link_screen_reachability
      #    6.1 min  ferric-dft  grid_prune_live_scf
      #    5.0 min  ferric-rpa  hirshfeld_symmetry
      # Deferring all six brings the fast tier to ~23 min.
      #
      # These are MOVED, not shrunk. Their cost is real work: screening is
      # INERT on small molecules, and screening_exactness.rs's own header
      # records that alkane_8 (26 atoms, 202 cc-pVDZ functions) is the size at
      # which the mechanism actually fires. Rewriting them onto smaller systems
      # would buy green minutes and verify nothing -- so the large-alkane
      # exactness anchors keep their sizes and move to the scheduled tier.
      # The tradeoff this accepts: screening exactness is no longer proven on
      # every PR. Touching a screening bound means running the slow tier
      # (workflow_dispatch) before merging.
      #
      # Next candidate if this needs trimming again: dft_gradient_rsh (1.2 min,
      # the wB97X-V FD gradient checks). Left in the fast tier deliberately --
      # deferring it saves ~1% and costs a per-PR guard on RSH gradients.
      #
      # NOT invoking scripts/ci-gate.sh directly: it wraps cargo in
      # scripts/ferric-limited, which needs systemd --user scopes that do not
      # exist on a GitHub runner. The deferral list is duplicated here instead;
      # keep the two in sync.
      #
      # Deferring means NOT BUILDING the target. `cargo test -- --skip NAME`
      # filters TEST FUNCTION names, not binary names, and does not work for
      # this (verified: --skip lmp2_amplitude left all 14 of its tests running).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The gpu feature must build and run its skip paths on a machine with NO
      # CUDA toolkit or driver (this runner). cudarc's `dynamic-loading` links
      # nothing at build time; the probe test proves the missing-driver path
      # reports `Unavailable` instead of panicking. Package-qualified features
      # because this is a virtual workspace.
      - name: gpu feature (no toolkit) — check, clippy, doc, skip-path test
        env:
          GPU_FEATURES: ferric-core/gpu,ferric-tensors/gpu,ferric-cli/gpu,ferric-python/gpu,ferric-benchmarks/gpu,ferric-mp2/gpu,ferric-core/test-seams,ferric-scf/test-seams,ferric-dft/test-seams,ferric-mp2/test-seams
        run: |
          set -euo pipefail
          if [ -e /usr/lib/x86_64-linux-gnu/libcuda.so.1 ]; then
            echo "::error::runner has libcuda; the skip-path test would not exercise the missing-driver branch"
            exit 1
          fi
          cargo check --workspace --all-targets --locked --features "$GPU_FEATURES"
          cargo clippy --workspace --all-targets --locked --features "$GPU_FEATURES" -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc -p ferric-core --no-deps --locked --features gpu
          OPENBLAS_NUM_THREADS=1 cargo test -p ferric-core --features gpu --locked --test gpu_probe --test gpu_config -- --nocapture 2>&1 | tee gpu-probe.log
          grep -q 'skipping: no CUDA device' gpu-probe.log
          # The CLI's [gpu] section on a gpu-feature binary with no driver: refusal and
          # notice paths run; the real-device test skips with a printed notice.
          OPENBLAS_NUM_THREADS=1 cargo test -p ferric-cli --features gpu --locked --test gpu_section -- --nocapture 2>&1 | tee gpu-section.log
          grep -q 'skipping: no usable CUDA device' gpu-section.log

      # rustdoc is built HERE, not in docs.yml, and the reason is structural:
      # `cargo doc` does not link, but it DOES run build scripts, and
      # ferric-integrals' build.rs compiles shim/shim.cc against libint2.hpp.
      # So documenting this workspace needs the same libint2 this job has
      # already installed — whereas docs.yml has no libint2 and failed
      # outright when it tried (run 33583179631: "libint2.hpp: No such file").
      # Publishing the API docs from the workflow that already pays for the
      # native build is strictly cheaper than making the docs job pay again.
      #
      # `--exclude ferric-python` is REQUIRED: that crate's lib is deliberately
      # named `ferric` (so Python's `import ferric` works), which collides with
      # the `ferric` facade crate's lib. Both emit to target/doc/ferric/ and
      # rustdoc hard-errors "Only one may be documented at once". Dropping the
      # pyo3 crate is the right side of that trade — it is a cdylib whose
      # rustdoc output is of no use to a Rust reader, and its surface is
      # documented for Python callers in site/src/using/python.md.
      #
      # `-D warnings` is ON, and it should stay on. The count went 373 → 0 in
      # one pass; the whole point of getting there was to make the next broken
      # link fail loudly instead of joining a pile nobody reads. Most of the
      # 373 were not stale references at all — a bare [`Foo`] inside a
      # module-level `//!` doc does not resolve against that module's own
      # items (rustdoc resolves it in the PARENT's scope), so the fix was to
      # qualify the path, not delete the link.
      # NOT gated on main: this step is the only thing that enforces
      # `-D warnings` on rustdoc, and when it was main-only a PR (#21) merged
      # green and then broke main on the very next push (an unescaped
      # `#[pyfunction]` in a doc comment). The build is a few extra seconds
      # on top of clippy's warm target; only the artifact UPLOAD below stays
      # main-only, because it is a handoff to docs.yml, not a check.
      - name: Build API docs
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: |
          cargo doc --workspace --no-deps --exclude ferric-python --locked
          # A workspace has no single root crate, so rustdoc writes no top-level
          # redirect. Point /api at the facade crate explicitly.
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ferric API documentation</title>
          <meta http-equiv="refresh" content="0; url=ferric/index.html">
          <a href="ferric/index.html">ferric API documentation</a>
          HTML

      - name: Upload API docs artifact
        # Consumed by docs.yml, which cannot build these itself. Retention is
        # short on purpose: this is a build-to-build handoff, not an archive.
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-docs
          path: target/doc
          retention-days: 1

  # ── BUILD ONCE: compile the fast-tier test binaries into an archive ────────
  #
  # MEASURED (CI run 35377097468): the old single `build-and-test` was 63.2 min,
  # of which 52.3 min was tests EXECUTING and only ~11 min was compile. So the
  # win here is NOT the compile -- it is running 317 binaries concurrently
  # instead of one at a time. This job exists so that ~11 min is paid ONCE
  # rather than once per shard.
  #
  # `cargo nextest archive` rather than a hand-rolled `cargo test --no-run` +
  # upload-artifact: it remaps CARGO_MANIFEST_DIR and the binary paths on
  # extraction, which is exactly what makes hand-rolled schemes fail when the
  # runner path differs.
  build-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    # When the archives were uploaded (epoch s). test-shard/malloc-perturb
    # use it only to word their error when the archive is gone: past
    # its retention-days, only "Re-run ALL jobs" can rebuild it (#525).
    outputs:
      archives_uploaded_at: ${{ steps.uploaded.outputs.at }}
      # {"<artifact>": {"bytes": N, "sha256": "..."}} of each archive as
      # uploaded, so a shard can tell a failed TRANSFER (re-run the job) from
      # a corrupt UPLOAD (re-run all jobs). Diagnostic only (#525).
      archive_digests: ${{ steps.uploaded.outputs.digests }}
    # NO DEBUG INFO IN THE ARCHIVED BINARIES (#525). Every shard downloads
    # this job's archive, and its size is what made downloads slow or
    # truncated (25-80 min, run 40058633825). The workflow-level
    # `line-tables-only` does not shrink the binaries much: each statically
    # linked test binary still carries the precompiled std's FULL DWARF, plus
    # ferric's own line tables, and the libint shim's C++ `-g` objects.
    # MEASURED on run 40058633825's artifact (every member, streamed): 846
    # files, 70.5 GB uncompressed, of which 51.3 GB (73%) is .debug_*
    # sections; zstd-3 per file 15.30 GB as shipped vs 7.45 GB after
    # `objcopy --strip-debug` (-51%). `debug = 0` + `strip = "debuginfo"`
    # removes all of it. What this does NOT change: opt-level (2, Cargo.toml
    # [profile.test]), debug-assertions, overflow-checks, features and cfgs,
    # so the code under test is the same; only non-loaded .debug_* sections
    # go. Panic messages keep file:line:col (that comes from
    # `core::panic::Location`, compiled into .rodata, not from DWARF), and the
    # symbol table stays, so a RUST_BACKTRACE=1 backtrace still names every
    # function -- it only loses per-frame file:line. The libint shim's `-g`
    # comes from the cc crate, which follows cargo's DEBUG env (so debug = 0
    # already drops it); the linker-level strip is the backstop for any
    # other prebuilt debug info, like std's. Job-scoped on purpose:
    # the coverage/lint/slow-tests jobs keep the workflow-level setting.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The ubuntu-22.04 image ships toolchains this job never uses (.NET,
      # Android SDK, GHC, CodeQL, Swift). Deleting them freed 21 GB (87 ->
      # 109 GB free, run 40542404911); it was added when the runner had only
      # ~14 GB free. `df` before/after so the next
      # disk-space failure is visible in the log instead of a mystery.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          # NOTE /usr/local/share/boost is deleted here, and libint2's
          # engine.impl.h does `#include <boost/preprocessor.hpp>`. That is why
          # `libboost-dev` is in the apt list below and must stay there: without
          # it the shim compile dies with "boost/preprocessor.hpp: No such file
          # or directory", and only on runner images that were relying on the
          # bundled boost this step removes. Observed 2026-08-29 -- the same
          # workflow passed hours earlier on an older image, so this fails
          # intermittently as GitHub rolls images, which makes it look like a
          # branch-specific failure when it is not.
          #
          # Why the apt package is sufficient even though crates/ferric-integrals/
          # build.rs never passes -I/usr/include: libboost-dev pulls in
          # libboost<ver>-dev, which owns /usr/include/boost/preprocessor.hpp,
          # and /usr/include is the compiler's DEFAULT system include path. That
          # is also why the build works on a developer box and not on the runner
          # -- a local machine usually has boost installed already.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt sources that ferric does not
          # depend on. When one serves a stale index, `apt-get update` exits 100
          # and this step fails before any ferric code compiles -- see runs
          # 34384861042 / 34385792258, where dl.google.com/linux/chrome-stable
          # returned a Hash Sum mismatch (their Release file was ~7.5h ahead of
          # the Packages.gz it indexed).
          #
          # Match on CONTENT, not filename: deleting google-chrome.list was not
          # enough, because the runner also defines the same repo elsewhere
          # (sources.list / a .sources file). Drop every apt source that
          # mentions dl.google.com wherever it is defined, so this does not
          # depend on the image's naming.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          # Anything still listing it (e.g. an inline entry we cannot delete
          # wholesale) gets commented out.
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          echo "--- remaining apt sources ---"
          grep -rhE '^[^#]' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | grep -vE '^\s*$' || true
          # NOTE: deliberately no `|| true` on apt-get update itself -- a genuine
          # failure to reach the Ubuntu archive must still fail the job.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      - name: Runner hardware / BLAS
        run: |
          lscpu | grep -E 'Model name|Vendor ID|CPU\(s\)|Flags' | cut -c1-240
          nproc; free -g | head -2
          dpkg -l | awk '/^ii +lib(openblas|lapack|blas)/ {print $2, $3}'
          for a in libblas.so.3-x86_64-linux-gnu liblapack.so.3-x86_64-linux-gnu; do
            update-alternatives --display "$a" 2>/dev/null | grep -E "link currently|^/" | head -4
          done
          echo "OPENBLAS_CORETYPE=${OPENBLAS_CORETYPE:-unset}"

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Verify libint2 capabilities
        run: |
          set -euo pipefail
          CFG="$LIBINT2_PREFIX/include/libint2/config.h"
          echo "--- libint2 config ---"
          grep -E 'INCLUDE_ERI|INCLUDE_ONEBODY|INCLUDE_G12|MAX_AM' "$CFG" || true
          fail=0
          # Derivative order each integral class was generated for. ferric's
          # gradients need >= 1; analytic Hessians need 2.
          for macro in LIBINT_INCLUDE_ERI LIBINT_INCLUDE_ONEBODY LIBINT_INCLUDE_ERI3 LIBINT_INCLUDE_ERI2; do
            v=$(sed -n "s/^#define $macro \([0-9]*\)$/\1/p" "$CFG")
            if [ -z "$v" ] || [ "$v" -lt 2 ]; then
              echo "::error::libint2 lacks $macro >= 2 (got '${v:-unset}'); gradients or analytic Hessians would SIGABRT at run time"
              fail=1
            else
              echo "$macro=$v OK"
            fi
          done
          exit $fail

      # Back to @stable, deliberately. Pinning to 1.95 (2c2a17ba) made clippy
      # reproducible but LOST a passing test run: on stable/1.98 the whole
      # fast-tier suite passed in 1265s, and on 1.95 -- with NO test code change,
      # only the pin -- it failed at 25m. The single 1.98 clippy lint that
      # motivated the pin is now fixed at the source (see
      # crates/ferric-ci/src/strings.rs), and `clippy --workspace --all-targets
      # -- -D warnings` exits 0 on BOTH 1.95 and 1.98 locally, so the pin no
      # longer buys anything the fix does not.
      #
      # The SHA below pins the ACTION (dtolnay/rust-toolchain), not the Rust
      # compiler. `stable` in that repo is a BRANCH, not a release tag, so
      # the commit changes as dtolnay periodically bumps whatever it resolves
      # to -- pinning to this commit freezes the toolchain-INSTALL logic
      # (which channel/target it fetches, how it invokes rustup) for
      # supply-chain reasons, but at run time the action still fetches
      # whatever `rustup toolchain install stable` resolves to that day. That
      # is NOT a contradiction of the "Back to @stable, deliberately" comment
      # above: this pin and that one are answering different questions -- the
      # action-SHA pin is about trusting the code that installs the
      # toolchain, the @stable channel choice is about deliberately letting
      # the Rust VERSION float.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: clippy

      # Restore and save are separate steps: a red test step must not cost
      # the next run a full cold rebuild. Keyed on Cargo.lock so a dependency
      # change still invalidates it.
      #
      # `target` is deliberately NOT cached. Measured 2026-09-07: a target/
      # cache is ~9 GB PER PR MERGE REF (two of them were 18.2 GB against the
      # repo's 10 GB cache limit), so every save evicted the other cache
      # entries -- to save ~5 min of incremental compile. The
      # registry + git sources are a few hundred MB and are kept.
      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Archive the test binaries
        timeout-minutes: 120
        run: |
          set -euo pipefail
          # `runlog_writer` SPAWNS examples/runlog_probe as a subprocess, to
          # exercise the JSON writer from a real process it can SIGKILL
          # mid-stream. Only an explicit `cargo build --example` links that
          # binary (`cargo test --examples` compiles examples as test targets
          # and never produces the executable), so it is built here, BEFORE
          # the archive: .config/nextest.toml's `archive.include` packs it
          # into the archive and errors if it is absent.
          cargo build -p ferric-scf --example runlog_probe --locked
          # Build the test binaries FIRST, with the same target selection and
          # profile `nextest archive` uses (it runs `cargo test --no-run` with
          # these flags), so the debug-info guard below runs before minutes of
          # compression; the archive's own build is then a fresh no-op.
          # It was NOT a no-op until #525 (~10 min rebuild): libecpint's
          # generator rewrote the tracked qgen.hpp inside a directory
          # ferric-integrals' build script watches, and ferric-build-info's
          # `git status` rewrote the .git/index it watches, so both build
          # scripts re-ran and everything above them recompiled. Fixed in
          # crates/ferric-integrals/build.rs (MtimeGuard) and
          # crates/ferric-build-info/src/probe.rs (--no-optional-locks).
          cargo test --no-run --workspace --all-targets --locked
          # DEBUG-INFO GUARD (#525). The job `env:` above must have taken
          # effect: an archived binary with a .debug_info section means the
          # archive is back to ~2x its size, e.g. because a Cargo.toml profile
          # started overriding the env. It FAILS CLOSED: a missing readelf, a
          # readelf error, or too few binaries found (wrong path, empty
          # target/) is an error, never a silent pass. 100 is a floor well
          # under the 728 test binaries the archive held (run 40058633825).
          command -v readelf >/dev/null \
            || { echo "::error::readelf missing -- cannot check the test binaries for debug info (#525)"; exit 1; }
          mapfile -d '' BINS < <(find target/debug/deps target/debug/examples -maxdepth 1 \
            -type f -executable ! -name '*.so' -print0)
          if [ "${#BINS[@]}" -lt 100 ]; then
            echo "::error::debug-info guard found only ${#BINS[@]} test binaries (expected >= 100) -- it would be checking nothing (#525)"
            exit 1
          fi
          WITH_DEBUG=()
          for f in "${BINS[@]}"; do
            SECTIONS=$(readelf -S -W "$f") \
              || { echo "::error::readelf failed on $f (#525 debug-info guard)"; exit 1; }
            if grep -q '\.debug_info' <<<"$SECTIONS"; then WITH_DEBUG+=("$f"); fi
          done
          if [ "${#WITH_DEBUG[@]}" -gt 0 ]; then
            echo "::error::${#WITH_DEBUG[@]} of ${#BINS[@]} test binaries still carry DWARF debug info, which roughly doubles the nextest archive (#525):"
            printf '%s\n' "${WITH_DEBUG[@]}" | head -20
            exit 1
          fi
          echo "debug-info guard: ${#BINS[@]} test binaries checked, none carry .debug_info"
          # PER-SHARD ARCHIVES (#525). One archive per test-shard job, split
          # at the BINARY level, so each shard downloads ~1/SHARDS of the bytes
          # (the single 7.6 GB archive could not be fetched in 20 min at the
          # 5 MB/s slow runners reach; run 40364869971). `--partition hash`
          # split by TEST, so every shard needed every binary; nextest has no
          # binary-level partition, so the split is done here, by filtering
          # what goes into each archive. scripts/ci-shard-plan.sh assigns the
          # fast-tier binaries largest-first by measured time
          # (scripts/ci-shard-weights.tsv) to the least-loaded shard. It
          # selects test binaries by binary_id only; nextest itself packs a
          # package's non-test executables (ferric-cli's, for its
          # CARGO_BIN_EXE_ tests) into each archive that selects one of that
          # package's test binaries, and the member check below fails the
          # job if one is ever missing.
          # SHARDS must equal test-shard's matrix (ci_validation_tier_guard
          # `shard_archives_match_the_matrix`).
          SHARDS=8
          SLOW="$(scripts/ci-shard-plan.sh slow-filter)"
          PLAN=/tmp/shard-plan
          cargo nextest list --workspace --all-targets --locked \
            -E "not ($SLOW)" --message-format json > "$PLAN-full.json"
          scripts/ci-shard-plan.sh assign "$PLAN-full.json" scripts/ci-shard-weights.tsv "$SHARDS" "$PLAN"
          for k in $(seq 1 "$SHARDS"); do
            F="$(cat "$PLAN/$k.filter")"
            cargo nextest archive --workspace --all-targets --locked \
              -E "$F" --archive-file "/tmp/nextest-shard-$k.tar.zst"
          done
          # LONG-WINDOW RECOMPRESSION (#525). nextest compresses each archive
          # member with a small window, so the code every statically linked
          # test binary repeats (std, ndarray, the ferric crates below it) is
          # stored once per binary. `--long=27` (a 128 MiB window) finds those
          # repeats across binaries: shard 1 of run 40542404911 went from
          # 1406 MB to 217 MB in 6 s here. 27 is the CEILING, not a tuning
          # choice: it is the largest window a zstd decoder accepts without
          # an explicit --long/--memory, which is what lets nextest read the
          # result directly (nextest has no window option). MEASURED
          # LOCALLY: `nextest list --archive-file` reads a --long=27 archive
          # and fails a --long=28 one with "Frame requires too much memory
          # for decoding". The output keeps nextest's .tar.zst layout, so
          # test-shard runs it unchanged.
          # pipefail (set above) is load-bearing: a decompress that dies
          # half way still leaves the second zstd a valid, SHORTER frame that
          # passes `zstd -t`. Hence also the tar entry count AND the
          # decompressed byte count (a cut on a member boundary keeps the
          # first and changes the second; the two extra passes cost 3.4 s +
          # 2.3 s locally on shard 1's 3.65 GB tar stream),
          # and the nextest list below, which reads these recompressed
          # files, not the originals.
          for k in $(seq 1 "$SHARDS"); do
            A="/tmp/nextest-shard-$k.tar.zst"
            BEFORE_SIZE=$(stat -c %s "$A")
            BEFORE_N=$(tar -I zstd -tf "$A" | wc -l)
            BEFORE_RAW=$(zstd -dcq "$A" | wc -c)
            zstd -dcq "$A" | zstd -q --long=27 -T0 -3 -c > "$A.long"
            zstd -tq --long=27 "$A.long"
            AFTER_N=$(tar -I 'zstd --long=27' -tf "$A.long" | wc -l)
            AFTER_RAW=$(zstd -dcq --long=27 "$A.long" | wc -c)
            if [ "$BEFORE_N" -eq 0 ] || [ "$AFTER_N" -ne "$BEFORE_N" ] \
                || [ "$AFTER_RAW" -ne "$BEFORE_RAW" ]; then
              echo "::error::nextest-shard-$k changed in the --long=27 recompression: $BEFORE_N -> $AFTER_N tar entries, $BEFORE_RAW -> $AFTER_RAW decompressed bytes (#525)"
              exit 1
            fi
            mv "$A.long" "$A"
            echo "nextest-shard-$k: $BEFORE_SIZE -> $(stat -c %s "$A") bytes with --long=27, $AFTER_N entries, $AFTER_RAW bytes decompressed"
          done
          # EXACTLY-ONCE GUARD (#525). Lists each archive exactly the way its
          # shard will run it, and requires the union of their fast-tier
          # tests to equal the full fast-tier list above, with no test in two
          # archives. Fails closed: a test in no archive would silently stop
          # running; one in two would run twice.
          SHARD_LISTS=()
          for k in $(seq 1 "$SHARDS"); do
            cargo nextest list --archive-file "/tmp/nextest-shard-$k.tar.zst" \
              --workspace-remap . -E "not ($SLOW)" --message-format json > "$PLAN-$k.json"
            SHARD_LISTS+=("$PLAN-$k.json")
          done
          scripts/ci-shard-plan.sh verify "$PLAN-full.json" "${SHARD_LISTS[@]}"
          # The probe from .config/nextest.toml's archive.include must be in
          # EVERY shard archive (runlog_writer asserts it exists), and every
          # archive holding ferric-cli integration tests must carry the
          # ferric-cli executable they run through CARGO_BIN_EXE_ferric-cli.
          for k in $(seq 1 "$SHARDS"); do
            MEMBERS="$(tar -I 'zstd --long=27' -tf "/tmp/nextest-shard-$k.tar.zst")"
            grep -q 'target/debug/examples/runlog_probe$' <<<"$MEMBERS" \
              || { echo "::error::nextest-shard-$k lacks examples/runlog_probe (#525)"; exit 1; }
            if grep -q '^ferric-cli::' "$PLAN/$k.ids" \
                && ! grep -q 'target/debug/ferric-cli$' <<<"$MEMBERS"; then
              echo "::error::nextest-shard-$k has ferric-cli tests but not the ferric-cli executable (#525)"
              exit 1
            fi
          done
          # The malloc-perturb job runs 6 binaries; downloading the whole
          # ~15 GB archive for them was slow and sometimes truncated (#525).
          # A second archive holding only those binaries reuses the binaries
          # just built (no recompile). The filter comes from the same script
          # malloc-perturb reads its canary list from, so the two cannot drift.
          # Assigned on its own line so a failing script trips `set -e` (a
          # command substitution inside an argument does not).
          CANARY_FILTER="$(scripts/ci-malloc-perturb-canaries.sh filter)"
          cargo nextest archive --workspace --all-targets --locked \
            -E "$CANARY_FILTER" \
            --archive-file /tmp/canary-archive.tar.zst
          # Sizes of every archive (the #525 acceptance measurement), and the
          # disk left (83 GB on run 40542404911; this job died once with "No
          # space left on device" back when the runner had ~14 GB free, run
          # 33210162947).
          ls -l /tmp/nextest-shard-*.tar.zst /tmp/canary-archive.tar.zst
          df -h / | tail -1

      # retention-days: 2 (was 1): a "Re-run failed jobs" the next day found
      # the archives EXPIRED and could never pass (#525, run 40579399666).
      # ~1.0 GB per run at 4 shards (4 x ~0.22 GB + 0.1 GB canary); at 8 a
      # little more, since --long=27 dedups less across fewer binaries per
      # archive (not yet measured); public repo, so not
      # billed. scripts/ci-archive-advice.sh's RETENTION_DAYS must match
      # (ci_validation_tier_guard checks it).
      # compression-level 0: the archives are already zstd, so re-zipping them
      # at the default level 6 spends upload time for nothing. One artifact
      # per shard; test-shard downloads `nextest-shard-${{ matrix.partition }}`.
      - name: Upload shard archive 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-1
          path: /tmp/nextest-shard-1.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-2
          path: /tmp/nextest-shard-2.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-3
          path: /tmp/nextest-shard-3.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-4
          path: /tmp/nextest-shard-4.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-5
          path: /tmp/nextest-shard-5.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-6
          path: /tmp/nextest-shard-6.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 7
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-7
          path: /tmp/nextest-shard-7.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload shard archive 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-shard-8
          path: /tmp/nextest-shard-8.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Upload the canary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-archive
          path: /tmp/canary-archive.tar.zst
          retention-days: 2
          compression-level: 0

      - name: Record when the archives were uploaded
        id: uploaded
        run: |
          echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          # Diagnostic only: a failure here leaves the output empty and the
          # build green (scripts/ci-archive-advice.sh then skips its check).
          D='{}'
          for f in /tmp/nextest-shard-*.tar.zst /tmp/canary-archive.tar.zst; do
            D=$(jq -c --arg n "$(basename "$f" .tar.zst)" \
                  --argjson b "$(stat -c %s "$f")" \
                  --arg h "$(sha256sum "$f" | cut -d' ' -f1)" \
                  '.[$n] = {bytes: $b, sha256: $h}' <<<"$D") || { D=''; break; }
          done
          echo "digests=$D" >> "$GITHUB_OUTPUT"
          echo "archive digests: $D"

      - name: Save cargo cache
        if: always() && steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

  # ── RUN: the archived binaries, in 8 parallel shards ──────────────────────
  #
  # WHY 8 (2026-10-29). Runners have 4 vCPUs and the ci profile runs
  # test-threads = num-cpus, so a shard is CPU-saturated: on the last green
  # main run before this change (40957025137) every shard ran at 4.0x its
  # wall time (shard 1: 11,385 s of per-test time in 2,848 s), and the four
  # shards summed 33,901 s (39,618 s on #597's run 40953725119), so wall
  # time only falls by adding runners. At 4 shards the slowest took 55 min
  # (its weights were stale; fresh ones balance LPT to ~8,475 s/shard). The
  # same change moved every test with a mean CI time >= 120 s over those two
  # runs, plus the thread-invariance (`*_bitwise*`) family, to the weekly
  # validation tier with a cheap canary left here for each family
  # (~9,030 s of the 33,901; one exception stays,
  # pbc_gamma_mgga_derivs::r2scan_and_scan_are_distinguished_..., the only
  # per-commit guard of the #355 swap in the Gamma derivative path). LPT
  # over the remaining ~24,870 s with the regenerated weights predicts
  # ~3,110 s per shard at 8 (max/min 1.00: the largest binary is now
  # ~1,050 s), i.e. ~13 min of tests per shard at 4x plus ~3-7 min of
  # download/setup. The new canaries are not in those weights (unmeasured
  # when written; the next scripts/ci-shard-weights.sh run picks them up).
  #
  # The old measurement (run 35377097468, before the per-shard archives):
  #
  #     2 shards -> 26.1 min    3 shards -> 17.4 min
  #     4 shards -> 13.4 min    6 shards -> 13.4 min  (no further gain)
  #
  # flattened at 4 only because `cdft_coupling_hene` alone was 13.4 min; it
  # and the cdft/cosx/qqr3 binaries are deferred to nightly (they are in
  # SLOW, scripts/ci-shard-plan.sh).
  #
  # CRATE-level sharding does NOT work here and was measured before this was
  # written: ferric-scf alone is 33.7 of the 52.3 min (64%), so a
  # crate-granularity split saturates at 33.7 min at ANY shard count.
  #
  # BINARY-level sharding (#525, replaced `--partition hash:i/4`, which split
  # by TEST and so made every shard download every binary). Each shard runs
  # ALL of its own archive, `nextest-shard-<k>`, which build-tests packed
  # from scripts/ci-shard-plan.sh's LPT assignment. Stale weights
  # (scripts/ci-shard-weights.tsv; regenerate with
  # scripts/ci-shard-weights.sh <green-run-id>) only worsen the balance;
  # build-tests' exactly-once guard makes sure no test is lost or doubled.
  #
  # Each shard RESTORES both caches and SAVES NEITHER -- build-tests is the
  # single writer, so adding shards cannot increase eviction pressure on the
  # cargo registry entry.
  test-shard:
    needs: build-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # actions: read -- scripts/ci-download-artifact.sh reads this run's
    # artifacts through the REST API with GITHUB_TOKEN (#525). The repo
    # default already grants it; stated here so a default change cannot
    # silently send this job to the fallback.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The ubuntu-22.04 image ships toolchains this job never uses (.NET,
      # Android SDK, GHC, CodeQL, Swift). Deleting them freed 21 GB (87 ->
      # 109 GB free, run 40542404911); it was added when the runner had only
      # ~14 GB free. `df` before/after so the next
      # disk-space failure is visible in the log instead of a mystery.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          # NOTE /usr/local/share/boost is deleted here, and libint2's
          # engine.impl.h does `#include <boost/preprocessor.hpp>`. That is why
          # `libboost-dev` is in the apt list below and must stay there: without
          # it the shim compile dies with "boost/preprocessor.hpp: No such file
          # or directory", and only on runner images that were relying on the
          # bundled boost this step removes. Observed 2026-08-29 -- the same
          # workflow passed hours earlier on an older image, so this fails
          # intermittently as GitHub rolls images, which makes it look like a
          # branch-specific failure when it is not.
          #
          # Why the apt package is sufficient even though crates/ferric-integrals/
          # build.rs never passes -I/usr/include: libboost-dev pulls in
          # libboost<ver>-dev, which owns /usr/include/boost/preprocessor.hpp,
          # and /usr/include is the compiler's DEFAULT system include path. That
          # is also why the build works on a developer box and not on the runner
          # -- a local machine usually has boost installed already.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt sources that ferric does not
          # depend on. When one serves a stale index, `apt-get update` exits 100
          # and this step fails before any ferric code compiles -- see runs
          # 34384861042 / 34385792258, where dl.google.com/linux/chrome-stable
          # returned a Hash Sum mismatch (their Release file was ~7.5h ahead of
          # the Packages.gz it indexed).
          #
          # Match on CONTENT, not filename: deleting google-chrome.list was not
          # enough, because the runner also defines the same repo elsewhere
          # (sources.list / a .sources file). Drop every apt source that
          # mentions dl.google.com wherever it is defined, so this does not
          # depend on the image's naming.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          # Anything still listing it (e.g. an inline entry we cannot delete
          # wholesale) gets commented out.
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          echo "--- remaining apt sources ---"
          grep -rhE '^[^#]' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | grep -vE '^\s*$' || true
          # NOTE: deliberately no `|| true` on apt-get update itself -- a genuine
          # failure to reach the Ubuntu archive must still fail the job.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      - name: Runner hardware / BLAS
        run: |
          lscpu | grep -E 'Model name|Vendor ID|CPU\(s\)|Flags' | cut -c1-240
          nproc; free -g | head -2
          dpkg -l | awk '/^ii +lib(openblas|lapack|blas)/ {print $2, $3}'
          for a in libblas.so.3-x86_64-linux-gnu liblapack.so.3-x86_64-linux-gnu; do
            update-alternatives --display "$a" 2>/dev/null | grep -E "link currently|^/" | head -4
          done
          echo "OPENBLAS_CORETYPE=${OPENBLAS_CORETYPE:-unset}"

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Verify libint2 capabilities
        run: |
          set -euo pipefail
          CFG="$LIBINT2_PREFIX/include/libint2/config.h"
          echo "--- libint2 config ---"
          grep -E 'INCLUDE_ERI|INCLUDE_ONEBODY|INCLUDE_G12|MAX_AM' "$CFG" || true
          fail=0
          # Derivative order each integral class was generated for. ferric's
          # gradients need >= 1; analytic Hessians need 2.
          for macro in LIBINT_INCLUDE_ERI LIBINT_INCLUDE_ONEBODY LIBINT_INCLUDE_ERI3 LIBINT_INCLUDE_ERI2; do
            v=$(sed -n "s/^#define $macro \([0-9]*\)$/\1/p" "$CFG")
            if [ -z "$v" ] || [ "$v" -lt 2 ]; then
              echo "::error::libint2 lacks $macro >= 2 (got '${v:-unset}'); gradients or analytic Hessians would SIGABRT at run time"
              fail=1
            else
              echo "$macro=$v OK"
            fi
          done
          exit $fail

      # Back to @stable, deliberately. Pinning to 1.95 (2c2a17ba) made clippy
      # reproducible but LOST a passing test run: on stable/1.98 the whole
      # fast-tier suite passed in 1265s, and on 1.95 -- with NO test code change,
      # only the pin -- it failed at 25m. The single 1.98 clippy lint that
      # motivated the pin is now fixed at the source (see
      # crates/ferric-ci/src/strings.rs), and `clippy --workspace --all-targets
      # -- -D warnings` exits 0 on BOTH 1.95 and 1.98 locally, so the pin no
      # longer buys anything the fix does not.
      #
      # The SHA below pins the ACTION (dtolnay/rust-toolchain), not the Rust
      # compiler. `stable` in that repo is a BRANCH, not a release tag, so
      # the commit changes as dtolnay periodically bumps whatever it resolves
      # to -- pinning to this commit freezes the toolchain-INSTALL logic
      # (which channel/target it fetches, how it invokes rustup) for
      # supply-chain reasons, but at run time the action still fetches
      # whatever `rustup toolchain install stable` resolves to that day. That
      # is NOT a contradiction of the "Back to @stable, deliberately" comment
      # above: this pin and that one are answering different questions -- the
      # action-SHA pin is about trusting the code that installs the
      # toolchain, the @stable channel choice is about deliberately letting
      # the Rust VERSION float.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: clippy

      # Restore and save are separate steps: a red test step must not cost
      # the next run a full cold rebuild. Keyed on Cargo.lock so a dependency
      # change still invalidates it.
      #
      # `target` is deliberately NOT cached. Measured 2026-09-07: a target/
      # cache is ~9 GB PER PR MERGE REF (two of them were 18.2 GB against the
      # repo's 10 GB cache limit), so every save evicted the other cache
      # entries -- to save ~5 min of incremental compile. The
      # registry + git sources are a few hundred MB and are kept.
      - name: Restore cargo cache
        id: cache-cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      # HISTORY (#525). Both downloads used to be actions/download-artifact,
      # bounded and continue-on-error: a stalled 15 GB download had eaten the
      # whole 120-min job. Shards 1 and 4 of run 40058633825 then died
      # because BOTH 25-min attempts timed out, and #544 cut each attempt to
      # 15 min, which was safe only because build-tests now strips debug info
      # (archive ~15.2 -> 7.43 GB; shard 2's HEALTHY download of the 15.2 GB
      # archive took 17.9 min). build-tests' debug-info guard still protects
      # the numbers below; if it is ever removed, revisit them.
      #
      # WHY A SCRIPT NOW. Run 40111474993, 7.43 GB, both attempts of each
      # shard: 80 / 77 / 900+900 (timeout) / 831 s. Healthy is ~95 MB/s; bad
      # transfers crawl at ~9 MB/s or hang and do not recover inside 15 min,
      # so 15 min x 2 still failed. scripts/ci-download-artifact.sh fetches
      # the artifact through the REST API with curl and abandons any
      # connection below 25 MB/s for 45 s, then RESUMES from the same byte
      # (HTTP Range) on a fresh connection, so a stall costs ~1 min instead
      # of 15 and an abandoned attempt keeps what it fetched. It checks the
      # byte count, the API's sha256 digest, unzip's CRC and `zstd -t`, and
      # gives up when CI_DL_DEADLINE_S runs out, or after 6 attempts in a row
      # that each moved < 25 MB (a hang). See the script header.
      #
      # CI_DL_DEADLINE_S covers lookup + transfer only; verification (~1-2.6
      # min for 7.4 GB) runs after it, hence deadline = step cap - 5 min.
      # `exec` makes the script the step's shell, so a step-timeout signal
      # reaches it and its trap removes the partial zip.
      #
      # COST ON EVERY RUN: the sha256 pass and the unzip to disk are extra
      # work the action did while streaming -- about 1-3 min per shard even
      # when the download is healthy. That is the price of resumable,
      # stall-detecting transfers; the old path lost 15-30 min per stall.
      #
      # SIZE, NOT RETRIES (#525, run 40364869971). Shards 2 and 4 then failed
      # at 4-14 MB/s with 6.2 and 7.0 of 7.59 GB fetched when the 1200 s
      # deadline ran out: the retry logic worked, but a 7.6 GB file cannot be
      # fetched in 20 min at 5 MB/s. Each shard now downloads only its own
      # archive, `nextest-shard-<k>`: 1.36-1.45 GB as nextest writes it
      # (run 40542404911), then recompressed by build-tests with --long=27
      # (shard 1 of that run: 1406 -> 217 MB, ~45 s even at 5 MB/s; the
      # other shards were not measured). build-tests logs every shard's
      # before/after size.
      #
      # The action stays as ONE fallback for a failure of the script itself
      # (API error, token scope): 6 min is ~4.5x the healthy download time.
      # The step after it makes a fallback VISIBLE (warning + job summary) so
      # a broken script cannot hide behind it. Either way the run step's zstd
      # check below fails closed with the "ARTIFACT DOWNLOAD failure" error.
      #
      # Budget: setup ~2 min + script <= 25 + fallback 6 + run step ~55 min
      # (shards 2/3 of run 40058633825) + shard 1's doctests 3-5 min = ~93
      # min worst case against the 120-min job timeout (old path: ~94).
      - name: Download the archive
        id: download
        timeout-minutes: 25
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_DL_DEADLINE_S: "1200"
        run: exec scripts/ci-download-artifact.sh nextest-shard-${{ matrix.partition }} nextest-shard-${{ matrix.partition }}.tar.zst /tmp

      # A second artifact file (the probe, uploaded next to the archive) went
      # missing on single shards after both the download and a retry (runs
      # 35483904588, 35486199559, 36013053462). The probe now travels INSIDE
      # the archive, so there is one file to check. The fallback stays for
      # the archive itself.
      - name: Fall back to download-artifact if the scripted download failed
        if: steps.download.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 6
        continue-on-error: true
        with:
          name: nextest-shard-${{ matrix.partition }}
          path: /tmp

      - name: Report the download-artifact fallback
        if: steps.download.outcome != 'success'
        run: |
          echo "::warning::scripts/ci-download-artifact.sh FAILED (outcome: ${{ steps.download.outcome }}) and the download-artifact fallback ran -- check the 'Download the archive' log; a script that always fails would otherwise hide behind the fallback (#525)."
          echo "- :warning: \`nextest-shard-${{ matrix.partition }}\`: scripted download ${{ steps.download.outcome }}, used the actions/download-artifact fallback (#525)" >> "$GITHUB_STEP_SUMMARY"

      # Its own step so the token scripts/ci-archive-advice.sh needs is in
      # THIS step's environment only: the test step below (every nextest
      # process) never inherits it (#525).
      - name: Check the archive
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_ARCHIVE_UPLOADED_AT: ${{ needs.build-tests.outputs.archives_uploaded_at }}
          CI_ARCHIVE_DIGESTS: ${{ needs.build-tests.outputs.archive_digests }}
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/nextest-shard-${{ matrix.partition }}.tar.zst
          # --long=27: build-tests recompresses the archive with a 128 MiB
          # window (#525); spelled out so an older zstd with a smaller
          # default decoder limit cannot misreport it as corrupt.
          if [ ! -f "$ARCHIVE" ] || ! zstd -tq --long=27 "$ARCHIVE"; then
            echo "::error::the nextest archive is missing or corrupt after the download" \
                 "AND the fallback."
            # Which re-run can fix it: an EXPIRED archive needs "Re-run ALL
            # jobs" (#525). Advisory only; this step fails either way.
            timeout 60 scripts/ci-archive-advice.sh nextest-shard-${{ matrix.partition }} "$ARCHIVE" || true
            exit 1
          fi

      - name: Run shard ${{ matrix.partition }} of 8
        timeout-minutes: 100
        run: |
          set -euo pipefail
          # The deferred set comes from scripts/ci-shard-plan.sh, the ONE
          # copy of the SLOW list (build-tests and slow-tests read it too). A
          # hand-maintained copy is exactly how a deferral silently becomes a
          # deletion, which this repo has already hit once (2026-09-16,
          # grid_prune_live_scf). build-tests already left these binaries out
          # of every shard archive; the filter below is a safety net.
          SLOW="$(scripts/ci-shard-plan.sh slow-filter)"
          echo "deferring $(scripts/ci-shard-plan.sh slow-names | wc -l) binaries from the fast tier"
          # Verified by "Check the archive" above.
          ARCHIVE=/tmp/nextest-shard-${{ matrix.partition }}.tar.zst
          # Extract to a KNOWN directory (nextest's default is a random temp
          # dir) so the test can be told where the packed probe landed.
          # `runlog_writer` asserts the probe exists rather than skipping.
          EXTRACT=$(mktemp -d)
          export FERRIC_RUNLOG_PROBE="$EXTRACT/target/debug/examples/runlog_probe"
          # NO `--partition`: the archive IS this shard's partition (#525).
          # `--no-tests=fail`: an archive with nothing to run fails closed
          # (exit 4, "no tests to run") instead of a green shard that checked
          # nothing. Spelled out rather than left to nextest's default, which
          # has changed before. build-tests' exactly-once guard already
          # rejects an empty shard; this is the run-side backstop.
          cargo nextest run \
            --profile ci \
            --archive-file "$ARCHIVE" \
            --extract-to "$EXTRACT" \
            --workspace-remap . \
            --no-tests=fail \
            -E "not ($SLOW)"

      # nextest does NOT run doctests -- `cargo nextest run` skips them
      # silently. Without this step doctest coverage would vanish the moment
      # this workflow landed, which is the same failure mode as a SLOW entry
      # with no matching nightly --test line. One shard only; doctests are
      # cheap and sharding them buys nothing.
      - name: Doctests (shard 1 only)
        if: matrix.partition == 1
        run: cargo test --workspace --doc --locked

  # Allocator-perturbation canary (#433 item 4). The Boys/Tenno table-edge
  # defects (#437, #440, #445) were out-of-bounds READS of libint2 tables:
  # the stale bytes past the table were benign under the default allocator and
  # surfaced only as LAPACK failures / non-convergence under MALLOC_PERTURB_.
  # The fast tier never sets it, so a reintroduced edge read would pass CI
  # silently. This job reruns a deliberately SMALL integral-sensitive set from
  # build-tests' canary archive under glibc's MALLOC_PERTURB_ (fresh allocations
  # are filled with the byte ~value):
  #   1   (0xFE) and 170 (0x55): the two values that exposed #433
  #   2   (0xFD): a third pattern
  # 255 is deliberately omitted: glibc fills malloc'd memory with (value ^ 0xff)
  # and freed memory with value, so 255 gives a 0x00 malloc fill (what fresh
  # pages already look like) and only adds a 0xFF free fill -- much less
  # informative for uninitialised-READ bugs than the three values above.
  # The set: the two table-edge binaries plus the non-ignored k-point
  # RS-GDF+ECP+rotation test that first failed under perturbation
  # (far_field_contracted_s_blocks_do_not_read_uninitialised_memory, which
  # itself re-execs its #[ignore]d helper with --include-ignored). It is a
  # canary, not the survey. It also runs pbc_krsgdf, pbc_krsgdf_split and
  # pbc_grad_ecp (RS-GDF / ECP-gradient paths). The list lives in ONE place,
  # scripts/ci-malloc-perturb-canaries.sh, read by both build-tests (to pack
  # the canary archive) and this job (to run and check it). Local release-build wall times
  # at MALLOC_PERTURB_=1, non-ignored tests only: 13 / 53 / 29 s. These are
  # local measurements, not CI-runner ones (CI builds at a lower opt-level, so
  # expect longer); the full survey record is in the README in
  # crates/ferric-integrals/shim/libint2_overrides.
  # Time: against the FULL archive (~760 binaries, ~15 GB) each
  # `nextest run --archive-file` invocation cost ~3.5-4 min of extraction
  # (MEASURED from CI job logs) and the download itself was slow or truncated
  # (#525); hence the separate canary archive of only these 6 binaries:
  # 200 MB, downloaded in 37 s (MEASURED, run 40058633825; ~100 MB since
  # #544), so its scripted download has a 3-min deadline and its fallback
  # 3 min, rather than the full archive's 20 and 6. The
  # job still runs ONE invocation per MALLOC_PERTURB_ value (3 total).
  malloc-perturb:
    needs: build-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # actions: read -- scripts/ci-download-artifact.sh reads this run's
    # artifacts through the REST API with GITHUB_TOKEN (#525). The repo
    # default already grants it; stated here so a default change cannot
    # silently send this job to the fallback.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same runtime environment as test-shard: the archived binaries link
      # libopenblas/liblapack/libxc from apt and libint2.so by ABSOLUTE SONAME
      # under $LIBINT2_PREFIX, so all of these are required to even start them.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same stale-third-party-source workaround as test-shard.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      # The small canary archive build-tests packs from the same canary list
      # (#525), not the full one. Downloaded, stall-checked and verified by
      # the same script as test-shard's, with a deadline scaled to its
      # ~100 MB (healthy: a few seconds), and the same single
      # download-artifact fallback.
      - name: Download the canary archive
        id: download
        timeout-minutes: 5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 5-min step cap - 2 min: verifying ~100 MB takes seconds.
          CI_DL_DEADLINE_S: "180"
        run: exec scripts/ci-download-artifact.sh canary-archive canary-archive.tar.zst /tmp

      - name: Fall back to download-artifact if the scripted download failed
        if: steps.download.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: canary-archive
          path: /tmp

      - name: Report the download-artifact fallback
        if: steps.download.outcome != 'success'
        run: |
          echo "::warning::scripts/ci-download-artifact.sh FAILED (outcome: ${{ steps.download.outcome }}) and the download-artifact fallback ran -- check the 'Download the canary archive' log; a script that always fails would otherwise hide behind the fallback (#525)."
          echo "- :warning: \`canary-archive\`: scripted download ${{ steps.download.outcome }}, used the actions/download-artifact fallback (#525)" >> "$GITHUB_STEP_SUMMARY"

      # Its own step so the advice script's token never reaches the canary
      # processes (#525), as in test-shard.
      - name: Check the canary archive
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_ARCHIVE_UPLOADED_AT: ${{ needs.build-tests.outputs.archives_uploaded_at }}
          CI_ARCHIVE_DIGESTS: ${{ needs.build-tests.outputs.archive_digests }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/canary-archive.tar.zst ] || ! zstd -tq /tmp/canary-archive.tar.zst; then
            echo "::error::the canary archive is missing or corrupt after the download AND the fallback."
            timeout 60 scripts/ci-archive-advice.sh canary-archive /tmp/canary-archive.tar.zst || true
            exit 1
          fi

      - name: Run the canary set under MALLOC_PERTURB_ 1, 170, 2
        run: |
          set -euo pipefail
          # Canary binaries as nextest binary ids (crate::binary), from the
          # single list build-tests also archived them from.
          mapfile -t CANARY_IDS < <(scripts/ci-malloc-perturb-canaries.sh ids)
          # mapfile from a process substitution does not trip `set -e`: an
          # empty list would make the per-binary PASS check pass vacuously.
          [ "${#CANARY_IDS[@]}" -gt 0 ] || { echo "::error::no malloc-perturb canary ids"; exit 1; }
          FILTER="$(scripts/ci-malloc-perturb-canaries.sh filter)"
          for v in 1 170 2; do
            echo "::group::MALLOC_PERTURB_=$v"
            # ONE extraction and ONE nextest invocation per value.
            # Extracted dir deleted afterwards.
            EXTRACT=$(mktemp -d)
            LOG=$(mktemp)
            # --retries 0: a pass-on-retry would hide an allocator-dependent
            # failure, the exact thing under test. Profile ci (not default) so
            # the ferric-pbc 960 s slow-timeout override applies.
            # --no-tests=fail alone is NOT a per-binary guard under a union
            # filter, so the check below requires a PASS line from EVERY
            # canary binary.
            MALLOC_PERTURB_=$v cargo nextest run \
              --profile ci --retries 0 --no-tests=fail \
              --archive-file /tmp/canary-archive.tar.zst \
              --extract-to "$EXTRACT" --extract-overwrite \
              --workspace-remap . \
              -E "$FILTER" 2>&1 | tee "$LOG"
            # CARGO_TERM_COLOR=always: strip ANSI colour codes before matching.
            sed 's/\x1b\[[0-9;]*m//g' "$LOG" > "$LOG.plain"
            for id in "${CANARY_IDS[@]}"; do
              if ! grep -Eq "PASS .* ${id} " "$LOG.plain"; then
                echo "::error::canary binary ${id} ran no passing test under MALLOC_PERTURB_=$v (renamed, filtered away, or all ignored)"
                exit 1
              fi
            done
            rm -rf "$EXTRACT" "$LOG" "$LOG.plain"
            echo "::endgroup::"
          done

  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Restore cargo cache
        # No target/ (see the push job's restore step); v3 key to match.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      # MUST stay in sync with SLOW_BINARIES in scripts/ci-shard-plan.sh (the
      # list test-shard defers): a binary named there but missing here is
      # verified NOWHERE. The first lines of the step check that, against
      # this step's own --test lines. Grouped by crate so a failure names
      # the area.
      - name: Test (deferred)
        # --locked: see build-and-test's "Check (all targets)" step for why.
        run: |
          set +e
          # Comments are dropped BEFORE the range is taken, and the start is
          # the anchored step line: a comment that quotes the step name, or
          # a commented-out `--test` line, can satisfy neither end.
          STEP_TEXT=$(grep -vE '^[[:space:]]*#' .github/workflows/ci.yml | sed -n '/^      - name: Test (deferred)$/,/^  [a-z]/p')
          NAMES=$(scripts/ci-shard-plan.sh slow-names) && [ -n "$NAMES" ] \
            || { echo "::error::scripts/ci-shard-plan.sh slow-names failed or is empty"; exit 1; }
          for b in $NAMES; do
            grep -qE -- "--test $b( |$)" <<<"$STEP_TEXT" \
              || { echo "::error::SLOW binary $b (scripts/ci-shard-plan.sh) has no --test line in slow-tests, so it runs nowhere"; exit 1; }
          done
          rc=0
          # The original six.
          cargo test --no-fail-fast -p ferric-scf --test dft_wb97xv --test mpi_dfjk_banding --test dft_pbe --locked || rc=1
          cargo test --no-fail-fast -p ferric-cc --test pair_screen_criteria --test attenuation_plus_dlpno --locked || rc=1
          cargo test --no-fail-fast -p ferric-mp2 --test lmp2_amplitude --locked || rc=1
          # Deferred 2026-09-16 (run 35050103626 timed out at 89.3 min of test
          # time). These are the large-alkane screening exactness anchors --
          # they keep their molecule sizes BECAUSE screening is inert on small
          # systems; see the fast tier's comment.
          cargo test --no-fail-fast -p ferric-scf \
            --test screening_exactness --test csam_screening \
            --test link_scf_anchor --test link_screen_reachability --locked || rc=1
          cargo test --no-fail-fast -p ferric-dft --test grid_prune_live_scf --locked || rc=1
          cargo test --no-fail-fast -p ferric-rpa --test hirshfeld_symmetry --locked || rc=1
          # Added 2026-09-18 alongside the five new SLOW entries. This list is
          # EXPLICIT, so a binary deferred above without a line here would stop
          # running entirely -- deferral would become deletion, silently. The
          # comment above this step already warns about that; these are the
          # lines that honour it.
          cargo test --no-fail-fast -p ferric-scf \
            --test cdft_coupling_hene --test cdft_state_selection \
            --test cosx_group_screen_anchors --test cosx_sparse_anchors \
            --test cosx_mixed_error_law --locked || rc=1
          cargo test --no-fail-fast -p ferric-mp2 --test rimp2_qqr3_screening --locked || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "::error::one or more deferred test commands failed -- see the FAILED lines above"
            exit 1
          fi

  # ── VALIDATION TIER: ferric vs committed external references, weekly ─────
  #
  # Tests in `crates/<crate>/tests/validation_<topic>.rs`, every one marked
  # `#[ignore = "validation: <VALIDATION.md row>"]`. The per-commit shards
  # never pass `--run-ignored`, so they skip these; this job runs ONLY them.
  # It reads committed JSON under testdata/reference/validation/ and never
  # runs PySCF/ORCA/NWChem -- reference generation is a manual local step
  # (scripts/validation/gen_*.py).
  #
  # Weekly + manual only. `github.event.schedule` is the cron STRING that
  # fired, so this job keys on the Sunday entry and skips the Mon-Sat one.
  #
  # The binary set is DERIVED from the filesystem (the glob below), never
  # hand-listed, and the nextest filter selects by the same `validation_`
  # prefix. crates/ferric-cli/tests/ci_validation_tier_guard.rs (regular
  # tier) re-derives the file set and checks it against this job's text, so a
  # validation file that the filter would miss, or a validation test missing
  # its `validation:` ignore reason (it would then run per-commit), fails a
  # normal PR.
  #
  # Builds only the validation binaries (-p <crate> --test <stem> per file):
  # `cargo nextest run --workspace` would build all ~300 test binaries for a
  # handful of tests, on a runner whose binding constraint is disk.
  validation:
    name: validation (weekly, external references, shard ${{ matrix.partition }}/8)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0')
    runs-on: ubuntu-22.04
    # 300, not 170: no shard has ever finished inside 170. Shard 2 holds
    # ecp_gradient_ch2i_uhf, ~85 min on CI by itself (.config/nextest.toml
    # gives the measurement); with the tests scheduled before it, shard 2 was
    # modelled at ~150 min of tests at 4 shards (per-test CI durations from
    # the three October 2026 dispatches, dealt out as `count:K/4` deals
    # them). At 8 shards, with the tests moved here from the per-commit tier,
    # the heaviest shard (1) models at ~155 min and shard 2 at ~140 (see
    # below), plus up to 17 min of setup; CI wall time for the same shard has
    # varied 1.6x between runs: ~155 x 1.6 + 17 = ~265 of 300 min at the
    # worst spread seen, under GitHub's 360-min cap. Adding a heavy test to
    # shard 1 or 2 eats that headroom; the fallback is moving
    # ecp_gradient_ch2i_uhf (or ag2_augccpvdzpp) to its own single-test job (or running its stability analysis only on the
    # undisplaced SCF). Hung tests are bounded per test by nextest's
    # terminate-after, so this is a backstop, not the hang guard.
    timeout-minutes: 300
    # SHARDED, because one runner no longer fits the tier (~645 tests, ~16 h
    # of summed per-test time on CI, run at test-threads = 2). nextest's
    # `count:` partition is applied AFTER the filter and deals each binary's
    # selected tests out round-robin in NAME order: test i of a binary goes
    # to shard (i mod 8) + 1, counting i from 0. Two consequences:
    # * it separates NAME-ADJACENT tests of one binary, which is why
    #   ecp_gradient_ch2i_uhf (shard 2) and ecp_gradient_ch2i_uks_pbe
    #   (shard 3) do not share a runner; it does NOT spread heavy tests in
    #   general (that would need per-test weights nextest does not take);
    # * every binary's alphabetically first test lands on shard 1, so shard 1
    #   carries the most tests and, with ag2_augccpvdzpp, the heaviest load.
    #   The Python half therefore runs on the LAST shard, one of the lightest.
    # 8 shards, not 4 (2026-10-29): the per-commit tier moved ~70 tests of
    # >= 120 s CI time (and the thread-invariance family) here, ~10,000 s of
    # per-test time, mostly in binaries of one or two tests, which the rule
    # above deals to shards 1 and 2. Modelled with run 40506601960's
    # per-test durations (the model reproduces that run's 645 test-to-shard
    # placements exactly) at test-threads = 2, the summed test time per shard
    # would have been 213 / 180 / 97 / 101 min at 4 shards, i.e. ~230 min
    # on shard 1 with setup, inside the 1.6x spread of the 300-min timeout
    # below; at 8 it is 155 / 140 / 61 / 61 / 58 / 40 / 36 / 40 min.
    # A test that cannot fit on any shard runs in its own `validation-*` job
    # and is excluded here by `and not (...)` in the filter: today only the
    # Cr(CO)6 SCF ladder (validation-cr-co6), which would have landed on
    # shard 1.
    # The union of the shards is the whole tier (checked with nextest 0.9.145
    # on a three-binary toy crate). Every shard builds the same binaries
    # (~4 min) and runs a disjoint eighth of the tests. fail-fast off: one
    # shard's failure must not cancel the others' results.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    # Builds and runs third-party build scripts and proc-macros, pushes
    # nothing and only RESTORES caches: read-only token, not persisted in the
    # checkout's .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free runner disk space
        # Same rationale as build-and-test's step of the same name.
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above, plus
          # libboost-dev for the shim (the disk-space step deletes
          # /usr/local/share/boost).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      # validation_npz.rs reads the CLI's NPZ with numpy (the FOREIGN reader
      # the row exists to test) and FAILS, rather than skips, without it.
      - name: Install numpy for the NPZ foreign-reader test
        run: python3 -m pip install --user numpy

      - name: Run validation tests
        env:
          FERRIC_VALIDATION_PYTHON: python3
        run: |
          set -euo pipefail
          shopt -s nullglob
          ARGS=()
          for f in crates/*/tests/validation_*.rs; do
            crate="$(basename "$(dirname "$(dirname "$f")")")"
            ARGS+=(-p "$crate" --test "$(basename "$f" .rs)")
          done
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "::error::no crates/*/tests/validation_*.rs files -- the validation tier is empty"
            exit 1
          fi
          echo "validation binaries: ${ARGS[*]}"
          # `and not (...)`: tests that run in their OWN job below
          # (validation-cr-co6), so each runs exactly once. The guard checks
          # this exclusion list against those jobs' filters.
          cargo nextest run --profile validation --locked "${ARGS[@]}" \
            --partition "count:${{ matrix.partition }}/8" \
            --run-ignored only -E 'binary(/^validation_/) and not (binary_id(=ferric-scf::validation_scf_ladder) and test(=cr_co6_default_ladder_reaches_stable_rhf_minimum))'

      # ── Python half of the tier: `@pytest.mark.validation` tests ──────────
      # Excluded everywhere else by pyproject's `addopts = -m "not validation"`
      # (a later `-m` on the command line overrides it). These drive the
      # compiled extension (and, for the NPZ row, the CLI through it), so the
      # job builds ferric-python in release, on shard 8 only (the last shard,
      # one of the lightest; it is not partitioned). `!cancelled()` so a Rust-tier failure still reports the
      # Python half. The pytest path list below is
      # checked by ci_validation_tier_guard.rs against every file that carries
      # the marker, so a validation pytest outside it fails a normal PR.
      - name: Free the validation test binaries before the release build
        # The debug test binaries above and the release extension below are
        # two full builds; the runner's binding constraint is disk.
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: rm -rf target/debug

      - name: Install uv
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: pip install uv

      - name: uv sync (dev + build extras)
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: uv sync --extra dev --extra build --no-install-project

      - name: Build ferric-python extension (release)
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: |
          # --no-sync: a plain `uv run` first does its OWN PEP 517 editable build,
          # so maturin develop then builds a second time with cargo fresh; maturin
          # 1.13.3 then copies target/maturin/libferric.so onto a hardlink of itself
          # and truncates it ("Object is too small", nightly 2026-10-27). The rm is
          # belt-and-braces for any other double build.
          rm -rf target/maturin
          uv run --no-sync maturin develop --release --locked

      # The binding-vs-CLI tests (test_ks_moving_grid_frequencies.py) compare
      # the extension with the CLI binary of the same tree; FERRIC_CLI below
      # points them at it, and they FAIL rather than skip when it is set but
      # missing.
      - name: Build ferric-cli (release)
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: cargo build --release -p ferric-cli --locked

      - name: Run Python validation tests
        if: ${{ !cancelled() && matrix.partition == 8 }}
        run: |
          set -euo pipefail
          # conftest.py turns a failed `import ferric` into a whole-suite SKIP
          # (right for a dev box, wrong here: zero tests run would read as a
          # pass). Import first so a broken build fails this step loudly.
          uv run --no-sync python -c "import ferric"
          FERRIC_CLI="$PWD/target/release/ferric-cli" OPENBLAS_NUM_THREADS=1 \
            uv run --no-sync pytest -m validation crates/ferric-python/tests/ -q

  # One validation test too long for any shard: Cr(CO)6 (199 AOs, exact 4-index
  # J/K) through the default SCF ladder with stability analysis. Every CI run
  # that reached it in a shard killed it at the 30-min nextest limit, and its
  # cost does not fit on top of a shard at the observed 1.6x spread (the
  # measurement and the bound are in .config/nextest.toml). Same triggers as
  # `validation`; the sharded run excludes this exact test with
  # `and not (...)`, so it runs once. ci_validation_tier_guard.rs checks that
  # every `validation-*` job's filter is excluded from the shards and vice
  # versa. Builds ONE test binary.
  validation-cr-co6:
    name: validation (weekly, external references, Cr(CO)6 SCF ladder)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0')
    runs-on: ubuntu-22.04
    # 270: nextest terminates the test at 225 min (.config/nextest.toml, 2x
    # the expected ~111 min CI time), plus ~15-20 min of setup and the build
    # of one test binary, so nextest fires first with ~25 min to spare. At the
    # 1.6x run-to-run spread seen on the shards the test takes ~178 min.
    # Under GitHub's 360-min cap.
    timeout-minutes: 270
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same as the `validation` job.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Run the Cr(CO)6 SCF ladder validation test
        # --no-tests=fail: a filter that matches nothing (a renamed test) must
        # fail, not pass with zero tests run.
        run: |
          set -euo pipefail
          cargo nextest run --profile validation --locked \
            -p ferric-scf --test validation_scf_ladder \
            --run-ignored only --no-tests=fail \
            -E 'binary_id(=ferric-scf::validation_scf_ladder) and test(=cr_co6_default_ladder_reaches_stable_rhf_minimum)'

  # The ONLY job that builds the `mpi` cargo feature at all. Nothing else in
  # this workflow does: every other job builds default features, under which
  # `crates/ferric-mp2/src/mpi_rimp2.rs` is an EMPTY module (its whole body is
  # one `#[cfg(feature = "mpi")] mod inner`, re-exported by a second cfg'd
  # `pub use`), so the entire MPI code path -- the aux-band striping in
  # ferric-scf's DfJ/DfK and the Allreduces that reduce it -- is invisible to
  # CI today. A `cargo build --features mpi` regression would reach `main`
  # unnoticed.
  #
  # DELIBERATELY STANDALONE: no `needs:`; there is no reason an MPI link error
  # should wait behind build-and-test. This job installs its own libint2.
  #
  # WHY A CORRECTNESS RUN AND NOT JUST A COMPILE. `cargo build --features mpi`
  # exiting 0 proves almost nothing about MPI: the failure mode this repo
  # actually hit is a partial feature set that COMPILES CLEANLY and then
  # produces a different wrong energy on each rank (ferric-core/mpi on,
  # ferric-scf/mpi off => ParallelContext reports a multi-rank world so DF-J/K
  # stripe the aux band, while the cross-rank Allreduce that sums the bands
  # back is cfg'd out; measured -np 2 water RHF gave ~+108111 Ha and ~+108176
  # Ha on two ranks). That exact combination is now caught at COMPILE time by
  # a const-assert in crates/ferric-scf/src/lib.rs, and the "Partial-feature
  # guard" step below asserts that guard still fires -- but a guard only
  # covers the one combination someone thought of. The multi-rank run below
  # is the general check: it is what would catch a NEW reduction that gets
  # striped but never summed, which no compile-time assert can anticipate.
  mpi:
    name: mpi (OpenMPI, cross-rank correctness at np 1/2/3)
    runs-on: ubuntu-22.04
    # Well under build-and-test's 170. The cargo build here is a subset of the
    # workspace (ferric-scf/-mp2/-rpa/-gw test targets and their deps, not
    # --all-targets), and the multi-rank test systems are water -- about a
    # minute of compute in total across all 25 mpirun launches (measured
    # locally; the per-test table is in the step comment and the PR). The
    # headroom is almost entirely for a cold cargo build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above (see
          # that step for why matching on CONTENT rather than filename).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          # Beyond build-and-test's list, THREE extra packages, all required:
          #   libopenmpi-dev  -- the MPI implementation itself. HARDCODED to
          #     OpenMPI by deliberate choice (see the ABI note in
          #     .github/workflows/wheels.yml): OpenMPI and MPICH/Intel MPI are
          #     NOT ABI-compatible, so this pins which one ferric's MPI path
          #     is built and tested against.
          #   clang / libclang-dev -- the `mpi` crate (rsmpi 0.7) runs bindgen
          #     over <mpi.h> in its build script, and bindgen dlopen's
          #     libclang at build time. Without these the build fails inside
          #     the `mpi` crate, BEFORE any ferric code compiles, with a
          #     "Unable to find libclang" message that looks nothing like an
          #     MPI problem.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd \
            libopenmpi-dev openmpi-bin clang libclang-dev

      - name: MPI toolchain identification
        # Printed, not asserted. Which OpenMPI minor the runner image ships is
        # not something this repo pins, but when a future MPI failure IS
        # version-dependent, the version has to be in the log to find out.
        run: |
          mpirun --version | head -1
          mpicc -show 2>/dev/null || true
          echo "libclang: $(dpkg -l | awk '/^ii +libclang-[0-9]/ {print $2, $3}' | head -1)"

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      # Both crates that define an `mpi` feature reachable from the SCF/MP2
      # path. ferric-scf first: it owns the DfJ/DfK Allreduces, so if the
      # feature edge is broken this is where it surfaces, with a smaller
      # build to read the error out of.
      - name: Build with the mpi feature
        run: |
          set -euo pipefail
          cargo build -p ferric-scf --features mpi --locked
          cargo build -p ferric-mp2 --features mpi --locked

      # Asserts the const-assert in crates/ferric-scf/src/lib.rs still FAILS
      # the build for the one silently-wrong feature combination. This is a
      # MUTATION TEST of that guard: a guard nobody has watched fail is an
      # assumption, and this one is load-bearing (it is the only thing
      # standing between `--features ferric-core/mpi` and per-rank garbage
      # energies). Inverted logic on purpose -- the build MUST fail, and a
      # SUCCESS here is the failure being reported.
      - name: Partial-feature guard still fires
        run: |
          set -euo pipefail
          if cargo check -p ferric-scf --features ferric-core/mpi --locked 2>/tmp/guard.log; then
            echo "::error::ferric-core/mpi WITHOUT ferric-scf/mpi compiled successfully. The const-assert in crates/ferric-scf/src/lib.rs is no longer firing; that combination silently produces per-rank WRONG energies."
            exit 1
          fi
          if ! grep -q 'ferric-core/mpi is enabled but ferric-scf/mpi is not' /tmp/guard.log; then
            echo "::error::build failed, but NOT with the partial-feature guard's message -- the guard may have been replaced by an unrelated build error, which would hide a real regression"
            sed -n '1,40p' /tmp/guard.log
            exit 1
          fi
          echo "OK: partial-feature combination is rejected at compile time by the documented guard"

      # Every cross-rank correctness test binary in the workspace, built with
      # each crate's own `mpi` feature. Those features CHAIN: ferric-rpa/mpi
      # turns on ferric-scf/mpi + ferric-mp2/mpi + ferric-core/mpi, and
      # ferric-gw/mpi additionally chains ferric-rpa/mpi (see each
      # Cargo.toml), so `-p ferric-gw --features mpi` is what makes the GW
      # file's `#![cfg(feature = "mpi")]` body exist at all. Without the
      # feature those two files compile to ZERO tests, and libtest reports
      # `test result: ok. 0 passed` -- a green line with nothing run, which
      # is exactly the shape of a fake pass the rank-count assertion below
      # cannot see. Hence the per-binary expected-test-count check there.
      #
      # MERELY BUILDING THESE IS ALREADY A GATE THE REPO DID NOT HAVE.
      # `mpi_rpa_freq_banding.rs` and `mpi_gw_qp_banding.rs` are
      # `#![cfg(feature = "mpi")]`, so NO default-feature job in this workflow
      # ever compiles their bodies -- they bit-rot in silence. Measured when
      # this step was added (2026-10-03): `mpi_gw_qp_banding.rs` did not
      # compile on main at all, `error[E0063]: missing field
      # need_eigenvalues_freq in initializer of PdepRpaConfig` -- a field
      # added to ferric-rpa's config after the test was written. Nothing in CI
      # could see it. The `--no-run` builds below are the fix for that whole
      # class of rot, independently of the mpirun runs that follow.
      #
      # BINARY PATHS COME FROM CARGO, NOT FROM `find`. The old step did
      # `find target/debug/deps -name 'mpi_rimp2_banding-*' | head -1`, which
      # picks an arbitrary one of however many stale metadata hashes a warm
      # target/ holds -- a cache restore from a different Cargo.lock can leave
      # a binary built WITHOUT the mpi feature sitting next to the fresh one,
      # and `head -1` has no way to prefer the right one. `--message-format=json`
      # emits one `compiler-artifact` record per built target carrying the
      # `executable` path cargo just produced; that is the only authoritative
      # answer. The mapping is written to /tmp/mpi-bins.txt as
      # `<test-stem> <path>` lines for the run step to read.
      - name: Build the MPI correctness test binaries
        run: |
          set -euo pipefail
          : > /tmp/mpi-artifacts.json
          build() {
            echo "=== cargo test --no-run $*"
            cargo test "$@" --features mpi --locked --no-run \
              --message-format=json >> /tmp/mpi-artifacts.json
          }
          build -p ferric-scf \
            --test mpi_dfjk_banding \
            --test mpi_direct_jk_correctness \
            --test mpi_sad_guess_correctness \
            --test mpi_direct_jk_incremental_carryover \
            --test mpi_guess_collective_ordering
          build -p ferric-rpa --test mpi_rpa_freq_banding
          build -p ferric-gw  --test mpi_gw_qp_banding
          build -p ferric-mp2 --test mpi_rimp2_banding

          # One `<stem> <path>` line per test binary. `jq -r` over the
          # compiler-artifact stream; the stem is the file name with cargo's
          # `-<metadata hash>` suffix stripped, which is the name used by the
          # run step and in the test files' own doc headers.
          jq -r 'select(.reason == "compiler-artifact")
                 | select(.target.kind[] == "test")
                 | select(.executable != null)
                 | "\(.target.name) \(.executable)"' \
            /tmp/mpi-artifacts.json | sort -u > /tmp/mpi-bins.txt
          cat /tmp/mpi-bins.txt
          # Exactly the eight binaries below must be present. A missing line
          # means a --test target was renamed or its build silently produced
          # no executable, and the run step would then skip it in silence.
          for stem in mpi_dfjk_banding mpi_direct_jk_correctness \
                      mpi_sad_guess_correctness \
                      mpi_direct_jk_incremental_carryover \
                      mpi_guess_collective_ordering mpi_rpa_freq_banding \
                      mpi_gw_qp_banding mpi_rimp2_banding; do
            n=$(awk -v s="$stem" '$1 == s {c++} END {print c + 0}' /tmp/mpi-bins.txt)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected exactly 1 built test binary for $stem, cargo reported $n"
              exit 1
            fi
          done
          echo "OK: 8 MPI test binaries located from cargo's own artifact records"

      # THE POINT OF THIS JOB. Runs each cross-rank test binary under 1, 2 and
      # 3 ranks and requires every rank of every run to pass. At -np 2 the aux
      # band is genuinely split (measured locally: rank 0 owns [0,42), rank 1
      # owns [42,84) of an 84-function cc-pVDZ-RI water aux basis), and
      # `assert_all_ranks_agree` MPI-Allreduces (max - min) of the
      # correlation energy across the world and fails above 1e-12 Ha. If a
      # band were ever striped without being summed back, the ranks would
      # hold different numbers and that assert is what catches it.
      #
      # WHY -np 3 AND NOT JUST -np 2. Every band split in this codebase is
      # `n / size` with the remainder handed to the low ranks, so at -np 2 on
      # an EVEN count (water's naux 84/116, the RPA frequency grid, the GW MO
      # list) every rank gets the same width and the remainder branch never
      # executes. 3 ranks is the smallest count that makes the bands UNEVEN,
      # which is the arithmetic -np 2 structurally cannot reach: an off-by-one
      # in a band offset that happens to cancel for equal widths shows up
      # immediately as a cross-rank disagreement at -np 3. -np 1 stays as the
      # exactness anchor (band == full range, distribution does nothing).
      # `mpi_guess_collective_ordering` additionally runs at -np 4, the count
      # its own header specifies (measured 8/10 aborts there pre-fix).
      #
      # Measured locally (OpenMPI 4.1.6, these exact binaries): both ranks
      # reported RI-MP2 corr = -0.204008549668735 Ha, bit-identical
      # (0xbfca1cf3c0773ef0 on both), cross-rank spread 0.000e0; the full
      # matrix of per-test wall times and cross-rank spreads at np 1/2/3 is
      # in the PR for this job's expansion.
      #
      # WHY THE EXIT CODE IS PARSED FROM OUTPUT INSTEAD OF TRUSTED.
      # ferric parks the MPI Universe process-globally and never calls
      # MPI_Finalize (crates/ferric-core/src/parallel.rs: the Universe is
      # held in a OnceLock until process exit, deliberately, so it can never
      # be finalized while a later rayon region still wants a communicator).
      # mpirun treats a process that called MPI_Init and exited without
      # MPI_Finalize as an ABNORMAL TERMINATION and returns non-zero EVEN
      # WHEN EVERY TEST PASSED -- reproduced locally: `test result: ok. 1
      # passed` on both ranks, `mpirun` exit code 1. Trusting `$?` here would
      # make this job permanently red; ignoring `$?` would make it permanently
      # green, which is worse. So: require libtest's own summary line from
      # EVERY rank, and require zero failures. `--test-threads=1` keeps that
      # output parseable, and `--oversubscribe` lets 2 ranks onto a runner
      # that may advertise fewer slots than that.
      - name: Cross-rank correctness at np 1, 2 and 3
        env:
          # BLAS>1 under rayon segfaults/miscomputes in this repo (see the
          # workflow-level env and docs/reliability-audit). Per-rank, this
          # matters MORE under MPI, not less: 2 ranks each spawning a full
          # BLAS thread pool oversubscribes the runner outright.
          OPENBLAS_NUM_THREADS: "1"
          # NO `OMPI_MCA_btl` OVERRIDE, deliberately -- do not "helpfully" add
          # one back. The obvious-looking `OMPI_MCA_btl=self,tcp` (the usual
          # advice for containers lacking shared-memory/CMA permissions) was
          # tried here and MEASURED to HANG this exact test: with the stock
          # BTL selection the 2-rank water run finishes in 0.50 s with both
          # ranks reporting `test result: ok.`, and with `self,tcp` it spun
          # two ranks at ~99% CPU for over 10 minutes producing ZERO test
          # summaries (killed at a 90 s timeout, exit 124). OpenMPI's default
          # BTL selection is correct on the plain ubuntu-22.04 runner, which
          # is not a container and has working shared memory.
          #
          # Likewise no OMPI_ALLOW_RUN_AS_ROOT: the GitHub runner does not run
          # as root, so it would be dead config, and setting it would quietly
          # license running this as root somewhere else.
        run: |
          set -euo pipefail
          # Binary paths were resolved from cargo's own artifact records in
          # the build step (see there for why `find ... | head -1` is wrong).
          bin_for() {
            local stem="$1" path
            path=$(awk -v s="$stem" '$1 == s {print $2}' /tmp/mpi-bins.txt)
            if [ -z "$path" ] || [ ! -x "$path" ]; then
              echo "::error::no executable test binary recorded for $stem" >&2
              exit 1
            fi
            printf '%s\n' "$path"
          }

          # $1 = test-binary stem, $2 = rank count, $3 = test-name filter,
          # $4 = the number of tests that filter MUST select (per rank).
          #
          # The 4th argument exists because `test result: ok.` is printed just
          # the same for `0 passed`. Two of these files are
          # `#![cfg(feature = "mpi")]`, so a feature-chain regression would
          # empty them out and every rank would still print a cheerful `ok.`
          # summary; a filter typo does the same thing. Asserting the passed
          # count per rank is what makes "green" mean "tests ran".
          run_ranks() {
            local stem="$1" np="$2" filter="$3" want="$4"
            local BIN log
            BIN=$(bin_for "$stem")
            log="/tmp/mpi-$stem-np$np-$filter.log"
            echo "=== mpirun -np $np $stem ($filter) ==="
            # `timeout 300`: an MPI misconfiguration does not fail, it HANGS
            # (measured: a bad BTL selection spun both ranks at 99% CPU
            # indefinitely). Without a bound, that burns this job's entire
            # 120-minute budget and gets killed by the JOB timeout, which
            # CANCELS the job and purges the log -- the failure mode
            # build-and-test's own comments document. 300 s is ~600x the 0.50 s
            # this run actually takes, so it can only fire on a genuine hang.
            # A timeout produces no `test result: ok.` lines, so the summary
            # assertions below turn it into a clean, loud failure.
            #
            # `|| true`: see the block comment above -- mpirun's exit code is
            # not a usable signal for a process that never finalizes. The
            # assertions below are the real gate.
            #
            # PER-RANK OUTPUT FILES, and why the old approach was WRONG.
            #
            # This check used to point every rank at ONE shared stdout and
            # count `grep -c '^test result: ok\.'`. Ranks write concurrently
            # to that pipe with no line discipline between processes, so two
            # writes INTERLEAVE MID-LINE. Captured on PR #105
            # (job 105903318653), both ranks passing:
            #
            #     test result: ok
            #     test result: ok. 1 passed; 0 failed; ... in 0.32s
            #     . 1 passed; 0 failed; ... in 0.32s
            #
            # One rank's summary was split in two by the other's write, so the
            # anchored grep matched once and the check reported "found 1 -- a
            # rank failed or never started". BOTH RANKS HAD PASSED: the
            # cross-rank spread on that very run was 0.000e0 and the two
            # energies were bit-identical (0xbfca1cf3c06ada88).
            #
            # The previous diagnosis -- "~6.7% of mpi jobs fail, it is mpirun
            # failing to bring a rank up" -- was therefore wrong, and the
            # remedy built on it (retry the LAUNCH) could not work: the launch
            # was never the problem. A retry only re-rolls the interleaving,
            # which is why it appeared to help.
            #
            # `--output-filename` gives each rank its own file, so no two
            # processes share a stream and the summaries cannot be split. The
            # rank count is then exact rather than probabilistic, and the retry
            # is gone -- a red result now means a red result.
            local oks outdir
            outdir="$log.d"
            rm -rf "$outdir"
            timeout 300 mpirun -np "$np" --oversubscribe \
              --output-filename "$outdir" \
              "$BIN" --nocapture --test-threads=1 "$filter" > "$log.launch" 2>&1 || true
            # OpenMPI writes $outdir/1/rank.N/std{out,err}; older builds write
            # $outdir.N directly. Concatenate whatever appeared, newline-safe,
            # so the greps below see every rank's complete output exactly once.
            #
            # `--output-filename` TEES: each rank's output goes to its per-rank
            # file AND to the shared stdout. So the launch log is a DUPLICATE of
            # the per-rank files, not a complement -- concatenating both counted
            # every summary twice and produced "expected 1 ... found 2" at np=1.
            # Use the per-rank files when they exist; fall back to the launch
            # log only when they do not (an OpenMPI too old for the flag, or a
            # failure before any file was created).
            : > "$log"
            find "$outdir" -type f \( -name 'stdout' -o -name 'stderr' \) 2>/dev/null \
              | sort | while read -r f; do cat "$f"; echo; done >> "$log"
            for f in "$outdir".*; do
              [ -f "$f" ] && { cat "$f"; echo; } >> "$log"
            done
            if [ ! -s "$log" ]; then
              echo "-- no per-rank output files under $outdir; falling back to the shared stream"
              cat "$log.launch" >> "$log"
            fi
            # Not anchored to column 0 any more: with per-rank files there is
            # no interleaving to anchor against, and an anchor would silently
            # re-introduce the same class of failure if a future OpenMPI
            # prefixed its output.
            oks=$(grep -c 'test result: ok\.' "$log" || true)
            # Show the physics/banding lines and the libtest summaries.
            grep -E 'rank [0-9]+/[0-9]+|cross-rank spread|^test result:' "$log" || true

            # Every rank must print its own libtest summary. A rank that
            # died before running (MPI startup failure, missing .so) prints
            # none, and without this check its silence would read as success.
            if [ "$oks" -ne "$np" ]; then
              echo "::error::expected $np passing 'test result: ok.' summaries (one per rank), found $oks -- a rank failed or never started"
              sed -n '1,120p' "$log"
              exit 1
            fi
            # Belt-and-braces: no rank may report a failure or a panic.
            if grep -qE '^test result: FAILED|panicked at|[1-9][0-9]* failed' "$log"; then
              echo "::error::a rank reported a test failure or panic under -np $np"
              sed -n '1,120p' "$log"
              exit 1
            fi
            # A GREEN SUMMARY WITH ZERO TESTS EXECUTED PROVES NOTHING. Each
            # rank's summary must report exactly $want passing tests. This
            # catches (a) a `#![cfg(feature = "mpi")]` file emptied out by a
            # broken feature chain, (b) a filter that matches nothing, and
            # (c) a test newly marked `#[ignore]`, each of which otherwise
            # yields `test result: ok. 0 passed; N ignored` on every rank and
            # sails past the rank-count check above.
            local bad
            bad=$(grep 'test result: ok\.' "$log" \
                  | grep -cv "ok\. $want passed" || true)
            if [ "$bad" -ne 0 ]; then
              echo "::error::$bad of $oks rank summaries did not report exactly $want passing tests under -np $np -- the filter '$filter' selected the wrong number of tests, or they were ignored/cfg'd out"
              grep 'test result:' "$log" || true
              exit 1
            fi
            echo "-- np=$np $stem OK ($oks/$np ranks, $want test(s) each)"
          }

          # -np 1: run_mpi_ri_mp2 against the SERIAL ri_mp2_spin_components
          # path. This is the EXACTNESS ANCHOR -- the trivial limit where the
          # band is the full aux range and the distribution does nothing.
          # Without it, a 2-rank agreement check proves only that the ranks
          # agree with EACH OTHER, which a uniformly-wrong result also
          # satisfies.
          #
          # `mpi_rimp2_np1_matches_serial_water` IS NOW INCLUDED. This job
          # used to filter it out, because the test's `df_rhf_config` forced
          # `energy_conv: 1e-10` and then asserted `rhf.converged` -- a bar
          # DF-JK water plateaus just above, so the SCF burned to max_iter
          # with a perfectly good density and `converged == false` (the
          # excluded run measured energy -76.026735427522, correct to 1e-9).
          # That forcing has since been REMOVED from the test itself
          # (crates/ferric-mp2/tests/mpi_rimp2_banding.rs: `energy_conv` is
          # left at its loose 1e-3 "no longer descending" default and
          # `density_conv: 1e-8` is the real criterion), so the exclusion is
          # obsolete. Verified by running it: it passes at -np 1, 2 and 3.
          # Keeping the exclusion would have hidden a serial-reference
          # assertion this job is supposed to depend on.
          #
          # WATER ONLY, not the whole file. `_water` also deselects
          # ..._benzene, a benzene/cc-pVDZ RI-MP2 which completed in ~9 s at
          # -np 1 but had not finished after 20 minutes of 2 ranks each
          # pinned at 99% CPU at -np 2 (the per-occupied-index Allreduce in
          # run_mpi_ri_mp2 is one collective per `i`, so rank count adds
          # synchronization). Water/cc-pVDZ exercises the identical
          # striping-and-reduction code path -- the aux band really is split
          # [0,42)/[42,84) -- in seconds. Scaling behaviour is not what this
          # job is for; correctness is.
          #
          # WALL-TIME DECISION: `cargo test` profile, water-only FILTERS, no
          # `--release`.
          #
          # NOTE ON "DEBUG": the root Cargo.toml sets `[profile.test]
          # opt-level = 2` and `[profile.dev.package."*"] opt-level = 2`, so
          # these `cargo test` binaries are ALREADY optimized ("Finished
          # `test` profile [optimized + debuginfo]"). `--release` would buy
          # only `lto`/`codegen-units=1` while costing a SECOND full build of
          # the workspace in this job -- a bad trade for test systems whose
          # correctness content is identical, and the band arithmetic this job
          # checks is profile-independent. So: no --release.
          #
          # MEASURED (OpenMPI 4.1.6, 6 physical cores,
          # OPENBLAS_NUM_THREADS=1, this profile), libtest's own in-process
          # seconds at np 1 / 2 / 3 -- the mpirun wall adds ~0.1-3 s of
          # launcher overhead per invocation:
          #   mpi_dfjk_banding      (water + benzene)  7.37 / 7.22 / 4.32
          #   mpi_direct_jk_correctness       (2)      0.05 / 0.25 / 0.05
          #   mpi_sad_guess_correctness       (1)      0.14 / 0.05 / 0.05
          #   mpi_direct_jk_incremental_carryover (6)  0.14 / 0.11 / 0.17
          #   mpi_guess_collective_ordering   (1)      0.30 / 0.30 / 0.37  (+0.48 at np 4)
          #   mpi_rpa_freq_banding   water   (2)       0.37 / 0.38 / 0.73
          #   mpi_gw_qp_banding      water   (2)       0.63 / 0.62 / 1.22
          #   mpi_rimp2_banding      water   (2)       0.29 / 0.34 / 0.67
          # All 25 launches, measured end to end including every mpirun
          # startup: 58 SECONDS. This job's timeout-minutes is 120, nearly all
          # of which is headroom for a cold cargo build; the mpirun phase is
          # not what would ever exhaust it.
          #
          # THE BENZENE CASES ARE FILTERED OUT, NOT DROPPED. `_water` /
          # `..._water` filters select the water test functions in
          # mpi_rimp2_banding and mpi_rpa_freq_banding; their `..._benzene`
          # siblings stay in the files and still compile and run single-rank
          # under build-and-test. The measured reason is in the rimp2 note
          # above: benzene/cc-pVDZ RI-MP2 at -np 2 had not finished in 20
          # minutes, because run_mpi_ri_mp2 does one Allreduce per occupied
          # index. `mpi_dfjk_banding` is the exception -- its single test
          # function does water AND benzene DF-B3LYP and cannot be filtered
          # apart -- and it does NOT need to be: measured 7.4 s at np 1 and
          # 4.3 s at np 3, both systems included.
          #
          # ORDER: every binary at -np 1 FIRST. -np 1 is the exactness anchor
          # (band == full range), and a multi-rank agreement check proves
          # only that the ranks agree with EACH OTHER -- which a uniformly
          # wrong result also satisfies. `set -e` plus this ordering means no
          # multi-rank number is ever reported from a build whose serial
          # reference assertions have not already passed.
          echo "##### -np 1: exactness anchors (band == full range) #####"
          run_ranks mpi_rimp2_banding                      1 _water 2
          run_ranks mpi_dfjk_banding                       1 mpi_df_b3lyp_water_and_benzene_banded 1
          run_ranks mpi_direct_jk_correctness              1 mpi_ 2
          run_ranks mpi_sad_guess_correctness              1 mpi_sad_guess_direct_rhf_water_sto3g 1
          run_ranks mpi_direct_jk_incremental_carryover    1 '' 6
          run_ranks mpi_guess_collective_ordering          1 minao_guess_is_collective_order_safe_across_ranks 1
          run_ranks mpi_rpa_freq_banding                   1 _water 2
          run_ranks mpi_gw_qp_banding                      1 _water_g0w0 2

          # -np 2: the real distributed run. Bands are disjoint and the
          # Allreduce is what must put them back together.
          echo "##### -np 2: disjoint, EQUAL-width bands #####"
          run_ranks mpi_rimp2_banding                      2 _water 2
          run_ranks mpi_dfjk_banding                       2 mpi_df_b3lyp_water_and_benzene_banded 1
          run_ranks mpi_direct_jk_correctness              2 mpi_ 2
          run_ranks mpi_sad_guess_correctness              2 mpi_sad_guess_direct_rhf_water_sto3g 1
          run_ranks mpi_direct_jk_incremental_carryover    2 '' 6
          run_ranks mpi_guess_collective_ordering          2 minao_guess_is_collective_order_safe_across_ranks 1
          run_ranks mpi_rpa_freq_banding                   2 _water 2
          run_ranks mpi_gw_qp_banding                      2 _water_g0w0 2

          # -np 3: UNEVEN bands. This is the case -np 2 cannot reach (see the
          # block comment above the step).
          echo "##### -np 3: UNEVEN bands (the case -np 2 cannot exercise) #####"
          run_ranks mpi_rimp2_banding                      3 _water 2
          run_ranks mpi_dfjk_banding                       3 mpi_df_b3lyp_water_and_benzene_banded 1
          run_ranks mpi_direct_jk_correctness              3 mpi_ 2
          run_ranks mpi_sad_guess_correctness              3 mpi_sad_guess_direct_rhf_water_sto3g 1
          run_ranks mpi_direct_jk_incremental_carryover    3 '' 6
          run_ranks mpi_guess_collective_ordering          3 minao_guess_is_collective_order_safe_across_ranks 1
          run_ranks mpi_rpa_freq_banding                   3 _water 2
          run_ranks mpi_gw_qp_banding                      3 _water_g0w0 2

          # -np 4 for the collective-ORDERING guard only, the count its own
          # file header specifies. That bug was probabilistic in the rank
          # count (measured on main @ c11ff82d: 9/10 aborts at np 2, 8/10 at
          # np 3, 8/10 at np 4), and more ranks means more chances for two
          # elements' collectives to be matched against each other.
          echo "##### -np 4: collective-ordering guard at its documented rank count #####"
          run_ranks mpi_guess_collective_ordering          4 minao_guess_is_collective_order_safe_across_ranks 1

          echo "MPI cross-rank correctness check passed at np 1, 2, 3 (+4 for the ordering guard)"

  # ---------------------------------------------------------------------
  # FAST jobs below. None of these `needs: build-and-test` and none touch
  # libint2 -- the point is a red run in well under a minute instead of
  # riding behind an hour-plus native build to find out `cargo fmt` was
  # never run. All three run on every push/PR (no `if:` restriction), same
  # as build-and-test.
  # ---------------------------------------------------------------------

  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    # No native deps: `cargo fmt` only parses and reprints source text, it
    # never invokes rustc or a build script, so this needs neither libint2
    # nor a warm target/. Split out from build-and-test so a formatting slip
    # is a <1-minute failure instead of one discovered after the hour-plus
    # native build below it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Action-SHA-vs-Rust-version distinction: see build-and-test's
      # toolchain step. `rustfmt` is requested explicitly -- the `stable`
      # channel does not always ship it as of the day it is fetched, and
      # this job (unlike build-and-test) never installs `clippy`, which
      # would otherwise be the only components request pulling a full
      # toolchain manifest down.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-22.04
    # No libint2, no cargo build -- this is the enforcement path
    # .pre-commit-config.yaml's own header describes as MISSING today:
    # bandit (medium+), ruff's critical subset (E9/F63/F7/F82), shellcheck
    # over 46 shell scripts, detect-secrets and check-yaml/check-toml
    # currently run ONLY for a contributor who ran scripts/install-hooks.sh
    # locally. `git commit --no-verify`, or an edit made straight in the
    # GitHub web UI, bypasses every one of them with nothing else in CI to
    # catch it. This job runs the identical hook set the local commit hook
    # runs, so there is no path into `main` that skips them.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  python-quality:
    name: python-quality
    runs-on: ubuntu-22.04
    # No libint2, no cargo build. Deliberately not `uses: astral-sh/setup-uv`
    # or any other third-party action -- `pip install uv` off the already
    # SHA-pinned actions/setup-python is one fewer supply-chain surface to
    # track for a tool this job only needs as a `uvx` launcher.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # VERSION PINNING TRAP, resolved: .pre-commit-config.yaml used to pin
      # ruff at v0.16.6, but the tree was reformatted with ruff 0.15.8, and
      # `ruff format` output is not stable across ruff versions. Verified
      # directly in the container that will run this workflow (2026-09-16):
      # `uvx ruff@0.15.8 format --check .` reports 244/244 files already
      # formatted (0 diffs) against this tree, while `uvx ruff@0.16.6 format
      # --check .` reports 7 files would change (all *.md, from a Markdown
      # fenced-code-block formatting behaviour that changed between those
      # two releases -- README.md, crates/ferric-python/README.md,
      # scripts/gw100/basis_gaps/CONVERSION_NOTES.md, site/src/methods/cc.md,
      # site/src/using/python.md, site/src/using/quickstart.md). 0.15.8 is
      # therefore the version pinned HERE, and .pre-commit-config.yaml's
      # ruff rev was moved down to v0.15.8 to match -- keep the two in sync;
      # if either drifts, `ruff format --check` fails on arrival for a
      # reason that has nothing to do with the PR that trips it.
      - name: ruff format --check
        run: uvx ruff@0.15.8 format --check .

      - name: ruff check (default rule set, report-only)
        # NON-BLOCKING. Default `ruff check .` found 682 findings before the
        # Python-wide reformat (top codes: E702 315, E741 89, E701 84, F401
        # 55, F841 32). Measured again in-container 2026-09-16, with that
        # reformat partially landed: 282. Exit criterion to flip this to
        # BLOCKING: the count above reaches 0 (or every survivor carries an
        # explicit inline `# noqa: <code>` with a reason, the same bar
        # scripts/ci-gate.sh's clippy ALLOWED_LINTS list holds Rust lints to)
        # -- a `continue-on-error` with no exit criterion is how a gate stays
        # permanently decorative.
        continue-on-error: true
        run: |
          echo "## ruff check (default rule set) -- report only, see step comment for exit criterion" >> "$GITHUB_STEP_SUMMARY"
          uvx ruff@0.15.8 check . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: bandit (medium+ severity)
        # BLOCKING -- matches .pre-commit-config.yaml's bandit hook exactly
        # (same rev, same `-ll -q`, same exclude). Run BEFORE `uv sync`
        # below on purpose: `uv sync` populates .venv with third-party
        # packages (numpy, scipy, rdkit, ...), and bandit -r . has no
        # project-awareness -- pointed at a tree that already has a .venv,
        # it scans vendored dependency code too and buries the two real
        # findings under ~500 third-party ones. Running here, before .venv
        # exists, keeps this step's output identical to a bare-checkout run.
        run: uvx bandit@1.9.4 -ll -q -r . -x terf-tables/generate_interpolation_tables.py

      # Populates .venv from the `dev` extra (numpy/scipy/pytest/pytest-cov/
      # ipython...). `--no-install-project`: this project's build backend is
      # maturin (see pyproject.toml `[build-system]`), and building it needs
      # a Rust toolchain, libint2 and the same shim headers build-and-test
      # installs -- none of which this fast, libint2-free job has. Every
      # tool below either needs only the dependency set (pytest) or nothing
      # from the venv at all (ruff/ty run standalone via uvx).
      - name: uv sync (dev extra, dependencies only)
        run: uv sync --extra dev --no-install-project

      - name: ty check (report-only)
        # NON-BLOCKING. 392 diagnostics measured 2026-09-16 in this same
        # container: `--exclude` applied for terf-tables' frozen Python-2
        # file (ty has no `[tool.ty]` config in this repo yet, hence the CLI
        # flag rather than picking up ruff's `extend-exclude`), and run AFTER
        # `uv sync` above so imports resolve against a populated .venv -- an
        # EMPTY venv inflates this to 561 (339 of them bare
        # `unresolved-import`), per the measurement that motivated this
        # policy. Exit criterion to flip to BLOCKING: add a checked-in
        # `[tool.ty]` config (with its own exclude) and drive the diagnostic
        # count to 0 or an explicitly-justified allow-list.
        continue-on-error: true
        run: |
          echo "## ty check -- report only, see step comment for exit criterion" >> "$GITHUB_STEP_SUMMARY"
          uvx ty@0.0.81 check --exclude 'terf-tables/generate_interpolation_tables.py' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

  # ---------------------------------------------------------------------
  # Nightly-only coverage. NON-BLOCKING (both steps below are
  # continue-on-error) and restricted to schedule/workflow_dispatch, same
  # `if:` as slow-tests -- see that job for why push/PR never runs it.
  #
  # Rust coverage is a SEPARATE job from build-and-test, not an extra step
  # in it: `cargo llvm-cov` builds into its OWN instrumented target dir
  # (target/llvm-cov-target) and, unlike a plain `cargo test`, this is by
  # design a SECOND full build on top of whatever `cargo check`/`cargo test`
  # already produced. build-and-test's uninstrumented target/ already runs
  # ~9 GB against the ~14 GB the runner had free when this was written (see
  # the `CARGO_PROFILE_DEV_DEBUG` comment at the top of this file for that
  # history, the two "No space left on device" incidents it cites, and the
  # larger disk measured since) -- stacking a second full build into that
  # SAME job's disk budget would have reproduced that failure on purpose. A
  # separate job starts from a fresh disk, so it only ever carries ONE
  # instrumented build's worth of target/ at a time.
  # ---------------------------------------------------------------------
  coverage:
    name: coverage (nightly, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk space
        # Same rationale as build-and-test's step of the same name.
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above, plus
          # libboost-dev for the same shim/shim.cc reason (see that job's
          # "Free runner disk space" step).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev patchelf zstd

      # libint2: conda-forge 2.13.1 (prebuilt, second-derivative integrals),
      # installed by the same script developers use; see scripts/install-libint.sh
      # for the package, its AM limits and why the SONAME is rewritten.
      - name: Install libint2
        run: scripts/install-libint.sh "$LIBINT2_PREFIX"

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage (lib-only scope)
        # NON-BLOCKING (continue-on-error) and NO fail-under threshold, by
        # design: a percentage measured against the FAST tier alone is
        # computed on a partial suite -- 6 integration binaries are deferred
        # to slow-tests and 239 tests are `#[ignore]`d workspace-wide -- so a
        # blocking threshold would flap for reasons having nothing to do
        # with code quality.
        #
        # SCOPE: `--lib` only, i.e. each crate's own `#[cfg(test)]` unit
        # tests, NOT the ~190 `tests/*.rs` integration binaries build-and-
        # test's fast tier runs. That exclusion is the disk-budget decision:
        # those integration binaries are the 200-335 MB-each, disk-heavy part
        # (see the `CARGO_PROFILE_DEV_DEBUG` comment at the top of this
        # file), and `cargo llvm-cov`'s instrumented binaries run LARGER
        # still than the line-tables-only debug binaries that comment
        # measures. Building all of them a second time, instrumented, into a
        # from-scratch disk budget (~14 GB when this was written) risked the
        # exact "No space left on device" failure that comment cites twice
        # for the UNINSTRUMENTED build. Unit tests exercise most of the workspace's
        # numerical core directly (the integration binaries mostly drive
        # that same code through a higher-level API), so `--lib` trades
        # completeness for a coverage run that reliably finishes.
        continue-on-error: true
        run: |
          cargo llvm-cov --workspace --lib --locked --no-fail-fast \
            --lcov --output-path lcov.info
          echo "## Rust coverage (--lib scope, informational)" >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --locked | tail -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Rust coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage-lcov
          path: lcov.info
          retention-days: 14

      # Free the instrumented target dir before the release build below
      # starts: `cargo llvm-cov` and a plain `cargo build --release` use
      # DIFFERENT target subdirectories (target/llvm-cov-target vs.
      # target/release), so without this they would coexist and stack their
      # disk usage inside this job's single disk budget -- the same
      # two-full-builds problem this job exists to keep OUT of build-and-
      # test, recreated inside itself. The lcov.info this step's output feeds
      # is already extracted and uploaded above, so nothing here is lost.
      - name: Free instrumented coverage target dir
        if: ${{ !cancelled() }}
        run: rm -rf target/llvm-cov-target

      # Everything below builds and exercises the compiled pyo3 extension,
      # which needs the SAME libint2 this job installed above --
      # the reason this lives in the nightly coverage job rather than the
      # fast python-quality job.
      - name: Install uv
        # The ubuntu-22.04 image does NOT ship uv, and this job -- unlike
        # python-quality, which installs it at its own "Install uv" step --
        # went straight to `uv sync`. That failed with `uv: command not found`
        # (exit 127) in 0.0s on every scheduled run from 2026-09-17 onward,
        # which meant the two steps below it (maturin develop, then the pytest
        # that exercises the compiled extension) had NEVER executed. The
        # pytest step's own comment saying "nobody has observed a green run
        # yet" was describing this, not a flaky test.
        #
        # `pip install uv` rather than astral-sh/setup-uv for the same reason
        # python-quality gives: no third-party action off the already-present
        # Python.
        run: pip install uv

      - name: uv sync (dev + build extras)
        run: uv sync --extra dev --extra build --no-install-project

      - name: Build ferric-python extension (release)
        # `maturin develop` invokes cargo underneath; --locked carries the
        # same rationale as every other cargo invocation in this file (see
        # build-and-test's "Check (all targets)" step).
        run: |
          # --no-sync: a plain `uv run` first does its OWN PEP 517 editable build,
          # so maturin develop then builds a second time with cargo fresh; maturin
          # 1.13.3 then copies target/maturin/libferric.so onto a hardlink of itself
          # and truncates it ("Object is too small", nightly 2026-10-27). The rm is
          # belt-and-braces for any other double build.
          rm -rf target/maturin
          uv run --no-sync maturin develop --release --locked

      - name: pytest -- Python bindings, with coverage
        # PROVISIONAL, continue-on-error: this suite has never been run in
        # CI before -- nobody has observed a green run yet, so this must not be
        # asserted to pass.
        # Flip to BLOCKING once a run has actually gone green here.
        continue-on-error: true
        run: |
          uv run --no-sync pytest crates/ferric-python/tests/ \
            --cov=ferric --cov-report=lcov:python-ext-coverage.lcov -q

      - name: Upload Python extension coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-ext-coverage-lcov
          path: python-ext-coverage.lcov
          retention-days: 14
