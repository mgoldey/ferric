          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      # MUST stay in sync with SLOW in the fast tier above: a binary named
      # there but missing here is verified NOWHERE. Grouped by crate so a
      # failure names the area.
      - name: Test (deferred)
        # --locked: see build-and-test's "Check (all targets)" step for why.
        run: |
          set +e
          rc=0
          # The original six.
          cargo test --no-fail-fast -p ferric-scf --test dft_wb97xv --test mpi_dfjk_banding --test dft_pbe --locked || rc=1
          cargo test --no-fail-fast -p ferric-cc --test pair_screen_criteria --test attenuation_plus_dlpno --locked || rc=1
          cargo test --no-fail-fast -p ferric-mp2 --test lmp2_amplitude --locked || rc=1
          # Deferred 2026-09-16 (run 35050103626 timed out at 89.3 min of test
          # time). These are the large-alkane screening exactness anchors --
          # they keep their molecule sizes BECAUSE screening is inert on small
          # systems; see the fast tier's comment.
          cargo test --no-fail-fast -p ferric-scf \
            --test screening_exactness --test csam_screening \
            --test link_scf_anchor --test link_screen_reachability --locked || rc=1
          cargo test --no-fail-fast -p ferric-dft --test grid_prune_live_scf --locked || rc=1
          cargo test --no-fail-fast -p ferric-rpa --test hirshfeld_symmetry --locked || rc=1
          # Added 2026-09-18 alongside the five new SLOW entries. This list is
          # EXPLICIT, so a binary deferred above without a line here would stop
          # running entirely -- deferral would become deletion, silently. The
          # comment above this step already warns about that; these are the
          # lines that honour it.
          cargo test --no-fail-fast -p ferric-scf \
            --test cdft_coupling_hene --test cdft_state_selection \
            --test cosx_group_screen_anchors --test cosx_sparse_anchors --locked || rc=1
          cargo test --no-fail-fast -p ferric-mp2 --test rimp2_qqr3_screening --locked || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "::error::one or more deferred test commands failed -- see the FAILED lines above"
            exit 1
          fi

  # The ONLY job that builds the `mpi` cargo feature at all. Nothing else in
  # this workflow does: every other job builds default features, under which
  # `crates/ferric-mp2/src/mpi_rimp2.rs` is an EMPTY module (its whole body is
  # one `#[cfg(feature = "mpi")] mod inner`, re-exported by a second cfg'd
  # `pub use`), so the entire MPI code path -- the aux-band striping in
  # ferric-scf's DfJ/DfK and the Allreduces that reduce it -- is invisible to
  # CI today. A `cargo build --features mpi` regression would reach `main`
  # unnoticed.
  #
  # DELIBERATELY STANDALONE: no `needs:`. build-and-test runs up to 170 min on
  # a cold libint2 build, and there is no reason an MPI link error should wait
  # behind it. This job builds its own libint2 (sharing build-and-test's cache
  # KEY, so on the common path it restores in seconds rather than rebuilding).
  #
  # WHY A CORRECTNESS RUN AND NOT JUST A COMPILE. `cargo build --features mpi`
  # exiting 0 proves almost nothing about MPI: the failure mode this repo
  # actually hit is a partial feature set that COMPILES CLEANLY and then
  # produces a different wrong energy on each rank (ferric-core/mpi on,
  # ferric-scf/mpi off => ParallelContext reports a multi-rank world so DF-J/K
  # stripe the aux band, while the cross-rank Allreduce that sums the bands
  # back is cfg'd out; measured -np 2 water RHF gave ~+108111 Ha and ~+108176
  # Ha on two ranks). That exact combination is now caught at COMPILE time by
  # a const-assert in crates/ferric-scf/src/lib.rs, and the "Partial-feature
  # guard" step below asserts that guard still fires -- but a guard only
  # covers the one combination someone thought of. The multi-rank run below
  # is the general check: it is what would catch a NEW reduction that gets
  # striped but never summed, which no compile-time assert can anticipate.
  mpi:
    name: mpi (OpenMPI, 2-rank correctness)
    runs-on: ubuntu-22.04
    # Well under build-and-test's 170. The cargo build here is a subset of the
    # workspace (ferric-scf + ferric-mp2 and their deps, not --all-targets),
    # and the test systems are water/cc-pVDZ -- seconds of compute. The
    # headroom is almost entirely for a cold libint2 build on a cache miss.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above (see
          # that step for why matching on CONTENT rather than filename).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          # Beyond build-and-test's list, THREE extra packages, all required:
          #   libopenmpi-dev  -- the MPI implementation itself. HARDCODED to
          #     OpenMPI by deliberate choice (see the ABI note in
          #     .github/workflows/wheels.yml): OpenMPI and MPICH/Intel MPI are
          #     NOT ABI-compatible, so this pins which one ferric's MPI path
          #     is built and tested against.
          #   clang / libclang-dev -- the `mpi` crate (rsmpi 0.7) runs bindgen
          #     over <mpi.h> in its build script, and bindgen dlopen's
          #     libclang at build time. Without these the build fails inside
          #     the `mpi` crate, BEFORE any ferric code compiles, with a
          #     "Unable to find libclang" message that looks nothing like an
          #     MPI problem.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev \
            libopenmpi-dev openmpi-bin clang libclang-dev

      - name: MPI toolchain identification
        # Printed, not asserted. Which OpenMPI minor the runner image ships is
        # not something this repo pins, but when a future MPI failure IS
        # version-dependent, the version has to be in the log to find out.
        run: |
          mpirun --version | head -1
          mpicc -show 2>/dev/null || true
          echo "libclang: $(dpkg -l | awk '/^ii +libclang-[0-9]/ {print $2, $3}' | head -1)"

      # Same key as build-and-test's, ON PURPOSE. libint2 is built from the
      # identical tarball at the identical version on the identical runner
      # image, so the artifact is byte-for-byte interchangeable and there is
      # no reason to spend a second entry out of the repo's already-tight
      # ~10 GB cache budget (see build-native-deps in wheels.yml for how
      # close that budget runs). RESTORE-ONLY here: build-and-test owns the
      # save. If this job misses, it rebuilds locally and simply does not
      # cache -- costing this job time but never evicting build-and-test's
      # entry, which is the expensive one to lose.
      - name: Restore libint2 cache
        id: cache-libint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LIBINT2_PREFIX }}
          key: libint-${{ env.LIBINT_VERSION }}-ubuntu2204-v1

      - name: Build libint2
        if: steps.cache-libint.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q https://github.com/evaleev/libint/releases/download/v${LIBINT_VERSION}/libint-${LIBINT_VERSION}-mpqc4.tgz
          tar xzf libint-${LIBINT_VERSION}-mpqc4.tgz
          cd libint-${LIBINT_VERSION}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$LIBINT2_PREFIX \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      # Both crates that define an `mpi` feature reachable from the SCF/MP2
      # path. ferric-scf first: it owns the DfJ/DfK Allreduces, so if the
      # feature edge is broken this is where it surfaces, with a smaller
      # build to read the error out of.
      - name: Build with the mpi feature
        run: |
          set -euo pipefail
          cargo build -p ferric-scf --features mpi --locked
          cargo build -p ferric-mp2 --features mpi --locked

      # Asserts the const-assert in crates/ferric-scf/src/lib.rs still FAILS
      # the build for the one silently-wrong feature combination. This is a
      # MUTATION TEST of that guard: a guard nobody has watched fail is an
      # assumption, and this one is load-bearing (it is the only thing
      # standing between `--features ferric-core/mpi` and per-rank garbage
      # energies). Inverted logic on purpose -- the build MUST fail, and a
      # SUCCESS here is the failure being reported.
      - name: Partial-feature guard still fires
        run: |
          set -euo pipefail
          if cargo check -p ferric-scf --features ferric-core/mpi --locked 2>/tmp/guard.log; then
            echo "::error::ferric-core/mpi WITHOUT ferric-scf/mpi compiled successfully. The const-assert in crates/ferric-scf/src/lib.rs is no longer firing; that combination silently produces per-rank WRONG energies."
            exit 1
          fi
          if ! grep -q 'ferric-core/mpi is enabled but ferric-scf/mpi is not' /tmp/guard.log; then
            echo "::error::build failed, but NOT with the partial-feature guard's message -- the guard may have been replaced by an unrelated build error, which would hide a real regression"
            sed -n '1,40p' /tmp/guard.log
            exit 1
          fi
          echo "OK: partial-feature combination is rejected at compile time by the documented guard"

      - name: Build the MPI correctness test binary
        run: cargo test -p ferric-mp2 --features mpi --locked --test mpi_rimp2_banding --no-run

      # THE POINT OF THIS JOB. Runs the SAME test binary under 1 and 2 ranks
      # and requires both to pass. At -np 2 the aux band is genuinely split
      # (measured locally: rank 0 owns [0,42), rank 1 owns [42,84) of an
      # 84-function cc-pVDZ-RI water aux basis), and
      # `assert_all_ranks_agree` MPI-Allreduces (max - min) of the
      # correlation energy across the world and fails above 1e-12 Ha. If a
      # band were ever striped without being summed back, the ranks would
      # hold different numbers and that assert is what catches it.
      #
      # Measured locally (OpenMPI 4.1.6, this exact binary): both ranks
      # reported RI-MP2 corr = -0.204008549668735 Ha, bit-identical
      # (0xbfca1cf3c0773ef0 on both), cross-rank spread 0.000e0.
      #
      # WHY THE EXIT CODE IS PARSED FROM OUTPUT INSTEAD OF TRUSTED.
      # ferric parks the MPI Universe process-globally and never calls
      # MPI_Finalize (crates/ferric-core/src/parallel.rs: the Universe is
      # held in a OnceLock until process exit, deliberately, so it can never
      # be finalized while a later rayon region still wants a communicator).
      # mpirun treats a process that called MPI_Init and exited without
      # MPI_Finalize as an ABNORMAL TERMINATION and returns non-zero EVEN
      # WHEN EVERY TEST PASSED -- reproduced locally: `test result: ok. 1
      # passed` on both ranks, `mpirun` exit code 1. Trusting `$?` here would
      # make this job permanently red; ignoring `$?` would make it permanently
      # green, which is worse. So: require libtest's own summary line from
      # EVERY rank, and require zero failures. `--test-threads=1` keeps that
      # output parseable, and `--oversubscribe` lets 2 ranks onto a runner
      # that may advertise fewer slots than that.
      - name: 2-rank correctness check
        env:
          # BLAS>1 under rayon segfaults/miscomputes in this repo (see the
          # workflow-level env and docs/reliability-audit). Per-rank, this
          # matters MORE under MPI, not less: 2 ranks each spawning a full
          # BLAS thread pool oversubscribes the runner outright.
          OPENBLAS_NUM_THREADS: "1"
          # NO `OMPI_MCA_btl` OVERRIDE, deliberately -- do not "helpfully" add
          # one back. The obvious-looking `OMPI_MCA_btl=self,tcp` (the usual
          # advice for containers lacking shared-memory/CMA permissions) was
          # tried here and MEASURED to HANG this exact test: with the stock
          # BTL selection the 2-rank water run finishes in 0.50 s with both
          # ranks reporting `test result: ok.`, and with `self,tcp` it spun
          # two ranks at ~99% CPU for over 10 minutes producing ZERO test
          # summaries (killed at a 90 s timeout, exit 124). OpenMPI's default
          # BTL selection is correct on the plain ubuntu-22.04 runner, which
          # is not a container and has working shared memory.
          #
          # Likewise no OMPI_ALLOW_RUN_AS_ROOT: the GitHub runner does not run
          # as root, so it would be dead config, and setting it would quietly
          # license running this as root somewhere else.
        run: |
          set -euo pipefail
          BIN=$(find target/debug/deps -name 'mpi_rimp2_banding-*' -type f -executable | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::could not locate the mpi_rimp2_banding test binary"
            exit 1
          fi
          echo "test binary: $BIN"

          # $1 = rank count, $2 = test-name filter.
          run_ranks() {
            local np="$1" filter="$2" log="/tmp/mpi-np$1-$2.log"
            echo "=== mpirun -np $np ($filter) ==="
            # `timeout 300`: an MPI misconfiguration does not fail, it HANGS
            # (measured: a bad BTL selection spun both ranks at 99% CPU
            # indefinitely). Without a bound, that burns this job's entire
            # 120-minute budget and gets killed by the JOB timeout, which
            # CANCELS the job and purges the log -- the failure mode
            # build-and-test's own comments document. 300 s is ~600x the 0.50 s
            # this run actually takes, so it can only fire on a genuine hang.
            # A timeout produces no `test result: ok.` lines, so the summary
            # assertions below turn it into a clean, loud failure.
            #
            # `|| true`: see the block comment above -- mpirun's exit code is
            # not a usable signal for a process that never finalizes. The
            # assertions below are the real gate.
            #
            # PER-RANK OUTPUT FILES, and why the old approach was WRONG.
            #
            # This check used to point every rank at ONE shared stdout and
            # count `grep -c '^test result: ok\.'`. Ranks write concurrently
            # to that pipe with no line discipline between processes, so two
            # writes INTERLEAVE MID-LINE. Captured on PR #105
            # (job 105903318653), both ranks passing:
            #
            #     test result: ok
            #     test result: ok. 1 passed; 0 failed; ... in 0.32s
            #     . 1 passed; 0 failed; ... in 0.32s
            #
            # One rank's summary was split in two by the other's write, so the
            # anchored grep matched once and the check reported "found 1 -- a
            # rank failed or never started". BOTH RANKS HAD PASSED: the
            # cross-rank spread on that very run was 0.000e0 and the two
            # energies were bit-identical (0xbfca1cf3c06ada88).
            #
            # The previous diagnosis -- "~6.7% of mpi jobs fail, it is mpirun
            # failing to bring a rank up" -- was therefore wrong, and the
            # remedy built on it (retry the LAUNCH) could not work: the launch
            # was never the problem. A retry only re-rolls the interleaving,
            # which is why it appeared to help.
            #
            # `--output-filename` gives each rank its own file, so no two
            # processes share a stream and the summaries cannot be split. The
            # rank count is then exact rather than probabilistic, and the retry
            # is gone -- a red result now means a red result.
            local oks outdir
            outdir="$log.d"
            rm -rf "$outdir"
            timeout 300 mpirun -np "$np" --oversubscribe \
              --output-filename "$outdir" \
              "$BIN" --nocapture --test-threads=1 "$filter" > "$log.launch" 2>&1 || true
            # OpenMPI writes $outdir/1/rank.N/std{out,err}; older builds write
            # $outdir.N directly. Concatenate whatever appeared, newline-safe,
            # so the greps below see every rank's complete output exactly once.
            : > "$log"
            find "$outdir" -type f \( -name 'stdout' -o -name 'stderr' \) 2>/dev/null \
              | sort | while read -r f; do cat "$f"; echo; done >> "$log"
            for f in "$outdir".*; do
              [ -f "$f" ] && { cat "$f"; echo; } >> "$log"
            done
            cat "$log.launch" >> "$log"
            # Not anchored to column 0 any more: with per-rank files there is
            # no interleaving to anchor against, and an anchor would silently
            # re-introduce the same class of failure if a future OpenMPI
            # prefixed its output.
            oks=$(grep -c 'test result: ok\.' "$log" || true)
            # Show the physics/banding lines and the libtest summaries.
            grep -E 'rank [0-9]+/[0-9]+|cross-rank spread|^test result:' "$log" || true

            # Every rank must print its own libtest summary. A rank that
            # died before running (MPI startup failure, missing .so) prints
            # none, and without this check its silence would read as success.
            if [ "$oks" -ne "$np" ]; then
              echo "::error::expected $np passing 'test result: ok.' summaries (one per rank), found $oks -- a rank failed or never started"
              sed -n '1,120p' "$log"
              exit 1
            fi
            # Belt-and-braces: no rank may report a failure or a panic.
            if grep -qE '^test result: FAILED|panicked at|[1-9][0-9]* failed' "$log"; then
              echo "::error::a rank reported a test failure or panic under -np $np"
              sed -n '1,120p' "$log"
              exit 1
            fi
            echo "-- np=$np OK ($oks/$np ranks passed)"
          }

          # -np 1: run_mpi_ri_mp2 against the SERIAL ri_mp2_spin_components
          # path. This is the EXACTNESS ANCHOR -- the trivial limit where the
          # band is the full aux range and the distribution does nothing.
          # Without it, a 2-rank agreement check proves only that the ranks
          # agree with EACH OTHER, which a uniformly-wrong result also
          # satisfies.
          #
          # NOTE: this filter selects the two cross-rank tests, NOT
          # mpi_rimp2_np1_matches_serial_water, which asserts
          # `rhf.converged` at energy_conv 1e-10 -- a bar DF-JK water
          # plateaus just above (measured locally: energy -76.026735427522,
          # correct to 1e-9, converged=false). That is a pre-existing
          # test-strictness issue unrelated to MPI (ferric-scf's own
          # mpi_dfjk_banding deliberately does NOT assert converged, for
          # exactly this reason), and this job must not be red on account of
          # it. The anchor is preserved because
          # mpi_rimp2_cross_rank_agreement_water ALSO cross-checks the
          # correlation energy against a pinned serial reference value.
          #
          # WATER ONLY, not the whole `mpi_rimp2_cross_rank_agreement` prefix.
          # That prefix also selects ..._benzene, which is a DEBUG-profile
          # benzene/cc-pVDZ RI-MP2: measured locally it completes in ~9 s at
          # -np 1 but had not finished after 20 minutes of 2 ranks each
          # pinned at 99% CPU at -np 2 (the per-occupied-index Allreduce in
          # run_mpi_ri_mp2 is one collective per `i`, so rank count adds
          # synchronization to a build with no optimization). Water/cc-pVDZ
          # exercises the identical striping-and-reduction code path -- the
          # aux band really is split [0,42)/[42,84) -- in seconds. Scaling
          # behaviour is not what this job is for; correctness is.
          run_ranks 1 mpi_rimp2_cross_rank_agreement_water
          # -np 2: the real distributed run. Bands are disjoint and the
          # Allreduce is what must put them back together.
          run_ranks 2 mpi_rimp2_cross_rank_agreement_water

          echo "MPI 2-rank correctness check passed"

  # ---------------------------------------------------------------------
  # FAST jobs below. None of these `needs: build-and-test` and none touch
  # libint2 -- the point is a red run in well under a minute instead of
  # riding behind an hour-plus native build to find out `cargo fmt` was
  # never run. All three run on every push/PR (no `if:` restriction), same
  # as build-and-test.
  # ---------------------------------------------------------------------

  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    # No native deps: `cargo fmt` only parses and reprints source text, it
    # never invokes rustc or a build script, so this needs neither libint2
    # nor a warm target/. Split out from build-and-test so a formatting slip
    # is a <1-minute failure instead of one discovered after the hour-plus
    # native build below it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Action-SHA-vs-Rust-version distinction: see build-and-test's
      # toolchain step. `rustfmt` is requested explicitly -- the `stable`
      # channel does not always ship it as of the day it is fetched, and
      # this job (unlike build-and-test) never installs `clippy`, which
      # would otherwise be the only components request pulling a full
      # toolchain manifest down.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-22.04
    # No libint2, no cargo build -- this is the enforcement path
    # .pre-commit-config.yaml's own header describes as MISSING today:
    # bandit (medium+), ruff's critical subset (E9/F63/F7/F82), shellcheck
    # over 46 shell scripts, detect-secrets and check-yaml/check-toml
    # currently run ONLY for a contributor who ran scripts/install-hooks.sh
    # locally. `git commit --no-verify`, or an edit made straight in the
    # GitHub web UI, bypasses every one of them with nothing else in CI to
    # catch it. This job runs the identical hook set the local commit hook
    # runs, so there is no path into `main` that skips them.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  python-quality:
    name: python-quality
    runs-on: ubuntu-22.04
    # No libint2, no cargo build. Deliberately not `uses: astral-sh/setup-uv`
    # or any other third-party action -- `pip install uv` off the already
    # SHA-pinned actions/setup-python is one fewer supply-chain surface to
    # track for a tool this job only needs as a `uvx` launcher.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # VERSION PINNING TRAP, resolved: .pre-commit-config.yaml used to pin
      # ruff at v0.16.6, but the tree was reformatted with ruff 0.15.8, and
      # `ruff format` output is not stable across ruff versions. Verified
      # directly in the container that will run this workflow (2026-09-16):
      # `uvx ruff@0.15.8 format --check .` reports 244/244 files already
      # formatted (0 diffs) against this tree, while `uvx ruff@0.16.6 format
      # --check .` reports 7 files would change (all *.md, from a Markdown
      # fenced-code-block formatting behaviour that changed between those
      # two releases -- README.md, crates/ferric-python/README.md,
      # experiments/danuglipron/plans/2026-08-30-isomer-pipeline.md,
      # scripts/gw100/basis_gaps/CONVERSION_NOTES.md, site/src/methods/cc.md,
      # site/src/using/python.md, site/src/using/quickstart.md). 0.15.8 is
      # therefore the version pinned HERE, and .pre-commit-config.yaml's
      # ruff rev was moved down to v0.15.8 to match -- keep the two in sync;
      # if either drifts, `ruff format --check` fails on arrival for a
      # reason that has nothing to do with the PR that trips it.
      - name: ruff format --check
        run: uvx ruff@0.15.8 format --check .

      - name: ruff check (default rule set, report-only)
        # NON-BLOCKING. Default `ruff check .` found 682 findings before the
        # Python-wide reformat (top codes: E702 315, E741 89, E701 84, F401
        # 55, F841 32). Measured again in-container 2026-09-16, with that
        # reformat partially landed: 282. Exit criterion to flip this to
        # BLOCKING: the count above reaches 0 (or every survivor carries an
        # explicit inline `# noqa: <code>` with a reason, the same bar
        # scripts/ci-gate.sh's clippy ALLOWED_LINTS list holds Rust lints to)
        # -- a `continue-on-error` with no exit criterion is how a gate stays
        # permanently decorative.
        continue-on-error: true
        run: |
          echo "## ruff check (default rule set) -- report only, see step comment for exit criterion" >> "$GITHUB_STEP_SUMMARY"
          uvx ruff@0.15.8 check . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: bandit (medium+ severity)
        # BLOCKING -- matches .pre-commit-config.yaml's bandit hook exactly
        # (same rev, same `-ll -q`, same exclude). Run BEFORE `uv sync`
        # below on purpose: `uv sync` populates .venv with third-party
        # packages (numpy, scipy, rdkit, ...), and bandit -r . has no
        # project-awareness -- pointed at a tree that already has a .venv,
        # it scans vendored dependency code too and buries the two real
        # findings under ~500 third-party ones. Running here, before .venv
        # exists, keeps this step's output identical to a bare-checkout run.
        run: uvx bandit@1.9.4 -ll -q -r . -x terf-tables/generate_interpolation_tables.py

      # Populates .venv from the `dev` extra (numpy/scipy/pytest/pytest-cov/
      # ipython...). `--no-install-project`: this project's build backend is
      # maturin (see pyproject.toml `[build-system]`), and building it needs
      # a Rust toolchain, libint2 and the same shim headers build-and-test
      # installs -- none of which this fast, libint2-free job has. Every
      # tool below either needs only the dependency set (pytest) or nothing
      # from the venv at all (ruff/ty run standalone via uvx).
      - name: uv sync (dev extra, dependencies only)
        run: uv sync --extra dev --no-install-project

      - name: ty check (report-only)
        # NON-BLOCKING. 392 diagnostics measured 2026-09-16 in this same
        # container: `--exclude` applied for terf-tables' frozen Python-2
        # file (ty has no `[tool.ty]` config in this repo yet, hence the CLI
        # flag rather than picking up ruff's `extend-exclude`), and run AFTER
        # `uv sync` above so imports resolve against a populated .venv -- an
        # EMPTY venv inflates this to 561 (339 of them bare
        # `unresolved-import`), per the measurement that motivated this
        # policy. Exit criterion to flip to BLOCKING: add a checked-in
        # `[tool.ty]` config (with its own exclude) and drive the diagnostic
        # count to 0 or an explicitly-justified allow-list.
        continue-on-error: true
        run: |
          echo "## ty check -- report only, see step comment for exit criterion" >> "$GITHUB_STEP_SUMMARY"
          uvx ty@0.0.81 check --exclude 'terf-tables/generate_interpolation_tables.py' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: pytest -- tools/ and experiments/ (no compiled extension needed), with coverage
        # PROVISIONAL, continue-on-error. These suites run in NO workflow at
        # all today (CI is Rust-only), so simply executing them here is
        # worth more than the coverage number. But nobody has watched a full
        # run go green in CI yet: this job installs only the `dev` extra, and
        # several tools/ modules import rdkit at MODULE scope rather than
        # lazily, so -- verified 2026-09-16 -- tools/active_site/tests/*,
        # tools/pipeline/tests/test_funnel.py and
        # experiments/danuglipron/tests/test_design.py fail at COLLECTION
        # with `ModuleNotFoundError: No module named 'rdkit'` rather than
        # skipping cleanly (224 of 232 collected tests were unaffected).
        # Exit criterion to flip to BLOCKING: either install the `docking`
        # extra here too, or fix those modules to import their optional
        # dependency lazily (matching the suites that already do, per
        # scripts/ci-gate.sh's "skip themselves" comment) -- AND a run has
        # actually been observed green in CI.
        continue-on-error: true
        run: uv run pytest tools/ experiments/ --cov=tools --cov=experiments --cov-report=term-missing -q

  # ---------------------------------------------------------------------
  # Nightly-only coverage. NON-BLOCKING (both steps below are
  # continue-on-error) and restricted to schedule/workflow_dispatch, same
  # `if:` as slow-tests -- see that job for why push/PR never runs it.
  #
  # Rust coverage is a SEPARATE job from build-and-test, not an extra step
  # in it: `cargo llvm-cov` builds into its OWN instrumented target dir
  # (target/llvm-cov-target) and, unlike a plain `cargo test`, this is by
  # design a SECOND full build on top of whatever `cargo check`/`cargo test`
  # already produced. build-and-test's uninstrumented target/ already runs
  # ~9 GB against the runner's ~14 GB free (see the `CARGO_PROFILE_DEV_DEBUG`
  # comment at the top of this file, and the two "No space left on device"
  # incidents it cites) -- stacking a second full build into that SAME job's
  # disk budget would reproduce that failure on purpose. A separate job
  # starts from a fresh ~14 GB, so it only ever carries ONE instrumented
  # build's worth of target/ at a time.
  # ---------------------------------------------------------------------
  coverage:
    name: coverage (nightly, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk space
        # Same rationale as build-and-test's step of the same name.
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - name: Install system dependencies
        run: |
          # Same third-party-apt-source guard as build-and-test above, plus
          # libboost-dev for the same shim/shim.cc reason (see that job's
          # "Free runner disk space" step).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -fv
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gfortran \
            libeigen3-dev libopenblas-dev liblapack-dev pkg-config \
            libxc-dev libboost-dev

      - name: Restore libint2 cache
        id: cache-libint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LIBINT2_PREFIX }}
          key: libint-${{ env.LIBINT_VERSION }}-ubuntu2204-v1

      # RESTORE-only, same as build-and-test/slow-tests: this job never
      # builds libint2 from a cache miss on its own account. In steady state
      # build-and-test's own nightly run (the workflow's `schedule` trigger
      # runs EVERY job with no `if:` excluding build-and-test) populates or
      # refreshes this cache, which is what "libint2 is already cached" for
      # this job relies on. A genuine cold cache still costs the same ~80
      # min build described on build-and-test's "Build libint2" step.
      - name: Build libint2
        if: steps.cache-libint.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q https://github.com/evaleev/libint/releases/download/v${LIBINT_VERSION}/libint-${LIBINT_VERSION}-mpqc4.tgz
          tar xzf libint-${LIBINT_VERSION}-mpqc4.tgz
          cd libint-${LIBINT_VERSION}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$LIBINT2_PREFIX \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      - name: Save libint2 cache
        if: success() && steps.cache-libint.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LIBINT2_PREFIX }}
          key: libint-${{ env.LIBINT_VERSION }}-ubuntu2204-v1

      # Action-SHA-vs-Rust-version distinction: see build-and-test's
      # toolchain step. `llvm-tools` (not `clippy`) is the component this
      # job needs: `cargo llvm-cov` instruments via `llvm-tools`'s
      # `llvm-profdata`/`llvm-cov` binaries, installed fastest through the
      # pinned taiki-e/install-action below rather than a source build.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-16
        with:
          components: llvm-tools

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v3-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage (lib-only scope)
        # NON-BLOCKING (continue-on-error) and NO fail-under threshold, by
        # design: a percentage measured against the FAST tier alone is
        # computed on a partial suite -- 6 integration binaries are deferred
        # to slow-tests and 239 tests are `#[ignore]`d workspace-wide -- so a
        # blocking threshold would flap for reasons having nothing to do
        # with code quality.
        #
        # SCOPE: `--lib` only, i.e. each crate's own `#[cfg(test)]` unit
        # tests, NOT the ~190 `tests/*.rs` integration binaries build-and-
        # test's fast tier runs. That exclusion is the disk-budget decision:
        # those integration binaries are the 200-335 MB-each, disk-heavy part
        # (see the `CARGO_PROFILE_DEV_DEBUG` comment at the top of this
        # file), and `cargo llvm-cov`'s instrumented binaries run LARGER
        # still than the line-tables-only debug binaries that comment
        # measures. Building all of them a second time, instrumented, into a
        # from-scratch ~14 GB budget risks the exact "No space left on
        # device" failure that comment already cites twice for the
        # UNINSTRUMENTED build. Unit tests exercise most of the workspace's
        # numerical core directly (the integration binaries mostly drive
        # that same code through a higher-level API), so `--lib` trades
        # completeness for a coverage run that reliably finishes.
        continue-on-error: true
        run: |
          cargo llvm-cov --workspace --lib --locked --no-fail-fast \
            --lcov --output-path lcov.info
          echo "## Rust coverage (--lib scope, informational)" >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --locked | tail -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Rust coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage-lcov
          path: lcov.info
          retention-days: 14

      # Free the instrumented target dir before the release build below
      # starts: `cargo llvm-cov` and a plain `cargo build --release` use
      # DIFFERENT target subdirectories (target/llvm-cov-target vs.
      # target/release), so without this they would coexist and stack their
      # disk usage inside this job's single ~14 GB budget -- the same
      # two-full-builds problem this job exists to keep OUT of build-and-
      # test, recreated inside itself. The lcov.info this step's output feeds
      # is already extracted and uploaded above, so nothing here is lost.
      - name: Free instrumented coverage target dir
        if: ${{ !cancelled() }}
        run: rm -rf target/llvm-cov-target

      # Everything below builds and exercises the compiled pyo3 extension,
      # which needs the SAME libint2 this job already has cached above --
      # the reason this lives in the nightly coverage job rather than the
      # fast python-quality job.
      - name: Install uv
        # The ubuntu-22.04 image does NOT ship uv, and this job -- unlike
        # python-quality, which installs it at its own "Install uv" step --
        # went straight to `uv sync`. That failed with `uv: command not found`
        # (exit 127) in 0.0s on every scheduled run from 2026-09-17 onward,
        # which meant the two steps below it (maturin develop, then the pytest
        # that exercises the compiled extension) had NEVER executed. The
        # pytest step's own comment saying "nobody has observed a green run
        # yet" was describing this, not a flaky test.
        #
        # `pip install uv` rather than astral-sh/setup-uv for the same reason
        # python-quality gives: no third-party action off the already-present
        # Python.
        run: pip install uv

      - name: uv sync (dev + build extras)
        run: uv sync --extra dev --extra build --no-install-project

      - name: Build ferric-python extension (release)
        # `maturin develop` invokes cargo underneath; --locked carries the
        # same rationale as every other cargo invocation in this file (see
        # build-and-test's "Check (all targets)" step).
        run: uv run maturin develop --release --locked

      - name: pytest -- Python bindings, with coverage
        # PROVISIONAL, continue-on-error: this suite has never been run in
        # CI before (see python-quality's tools/+experiments pytest step for
        # the same caveat, which applies here identically) -- nobody has
        # observed a green run yet, so this must not be asserted to pass.
        # Flip to BLOCKING once a run has actually gone green here.
        continue-on-error: true
        run: |
          uv run pytest crates/ferric-python/tests/ \
            --cov=ferric --cov-report=lcov:python-ext-coverage.lcov -q

      - name: Upload Python extension coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-ext-coverage-lcov
          path: python-ext-coverage.lcov
          retention-days: 14
