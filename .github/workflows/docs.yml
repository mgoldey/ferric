name: docs

# Builds the mdBook site and publishes it to GitHub Pages, together with the
# rustdoc API docs that the CI workflow produces.
#
# This job deliberately builds NO Rust. `cargo doc` looks like it should be
# cheap here — it does not link — but it DOES run build scripts, and
# ferric-integrals' build.rs compiles shim/shim.cc against libint2.hpp. With no
# libint2 on the runner that fails outright (run 33583179631: "libint2.hpp: No
# such file or directory"). Rather than make this job pay for a ~30-minute
# native build on every docs edit, ci.yml — which already builds and caches
# libint2 — emits target/doc as the `api-docs` artifact, and this job downloads
# it.
#
# Hence `workflow_run`: it fires AFTER CI finishes on main, so the artifact
# exists. A plain `push` trigger would race CI and find nothing.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual runs publish the book with whatever api-docs artifact the most
  # recent successful CI run left behind (or without API docs, if none).
  workflow_dispatch:

# Least privilege: read the tree, write Pages, and mint the OIDC token the
# deploy action exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do NOT cancel one in flight — a
# half-finished Pages deployment is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Rust toolchain and no cargo cache: this job builds the book only.
      # Both were here for a rustdoc step that had to be removed (see the
      # comment above "Assemble the site"), and an unused toolchain install is
      # just a slower job that looks like it does more than it does.

      - name: Install mdBook
        run: |
          # Pinned: an mdBook minor bump has changed rendered output before, and
          # a docs site that silently reflows on an unrelated push is a nuisance
          # to bisect.
          tar_url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$tar_url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build site

      # The API docs come from ci.yml's `api-docs` artifact (see the header).
      # `continue-on-error` is deliberate: if CI did not produce the artifact —
      # a red run, a docs-only push that ci.yml's paths-ignore skipped, or a
      # manual dispatch with no recent CI — the book must still publish. A site
      # missing its /api subtree is a degraded site; a site that failed to
      # deploy is no site.
      - name: Download API docs from CI
        id: api
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: site/book/api
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Assemble the site
        run: |
          test -f site/book/index.html
          # site/src/reference/api.md links to ../api/ferric/index.html, so the
          # artifact must land at site/book/api/ferric/. Report which way this
          # run went instead of leaving it to be inferred from a 404.
          if [ -f site/book/api/ferric/index.html ]; then
            echo "API docs present — /api will resolve."
          else
            echo "::warning::api-docs artifact missing or empty; publishing the book WITHOUT /api. The API link on the reference page will 404."
            rm -rf site/book/api
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
