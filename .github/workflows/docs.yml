name: docs

# Builds the mdBook site plus rustdoc API docs and publishes both to GitHub
# Pages.
#
# Deliberately does NOT build libint2. `mdbook` needs no Rust at all, and
# `cargo doc` type-checks without linking, so the ~30 min native build the CI
# workflow caches is not on this path. Keep it that way: if this workflow ever
# starts needing libint2, it stops being a docs job and becomes a second CI job.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/**/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege: read the tree, write Pages, and mint the OIDC token the
# deploy action exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do NOT cancel one in flight — a
# half-finished Pages deployment is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and doc target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/doc
          key: docs-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: docs-${{ runner.os }}-

      - name: Install mdBook
        run: |
          # Pinned: an mdBook minor bump has changed rendered output before, and
          # a docs site that silently reflows on an unrelated push is a nuisance
          # to bisect.
          tar_url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$tar_url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build site

      - name: Build rustdoc
        # --no-deps keeps this to ferric's own crates; documenting the full
        # dependency graph triples the build for no reader benefit.
        #
        # NOT `-D warnings`. Turning broken intra-doc links into errors is the
        # right long-term policy, but there are currently 33 pre-existing ones
        # (private-item links, renamed functions, moved modules) and gating
        # publication of the whole site on unrelated doc debt would mean no site
        # at all. Warnings are still printed, so the count is visible in the log
        # and can be driven down; flip this to `-D warnings` once it reaches 0.
        env:
          RUSTDOCFLAGS: '-W warnings'
        # `--exclude ferric-python` is REQUIRED, not tidiness: that crate's lib
        # is deliberately named `ferric` (so Python's `import ferric` works),
        # which collides with the `ferric` facade crate's lib. rustdoc emits
        # both to target/doc/ferric/ and hard-errors:
        #   "Only one may be documented at once since they output to the same path"
        # Excluding the pyo3 crate is the right side to drop — it is a `cdylib`
        # whose rustdoc output is of no use to a Rust reader, and its API is
        # documented for Python callers in site/src/using/python.md instead.
        #
        # This does NOT reproduce on a warm local target/ where one crate
        # already won the path, which is how it reached main: run 33582452053
        # failed in 12s on a clean runner.
        run: cargo doc --workspace --no-deps --exclude ferric-python

      - name: Assemble the site
        run: |
          # rustdoc lands under book/api/, which is where site/src/reference/api.md
          # points. If that path changes, fix the link in the same commit.
          cp -r target/doc site/book/api
          # rustdoc's index is a redirect stub only when there is one root crate;
          # in a workspace there is none, so point /api at the facade crate.
          cat > site/book/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ferric API documentation</title>
          <meta http-equiv="refresh" content="0; url=ferric/index.html">
          <a href="ferric/index.html">ferric API documentation</a>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
