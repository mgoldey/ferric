name: docs

# Builds the mdBook site plus rustdoc API docs and publishes both to GitHub
# Pages.
#
# Deliberately does NOT build libint2. `mdbook` needs no Rust at all, and
# `cargo doc` type-checks without linking, so the ~30 min native build the CI
# workflow caches is not on this path. Keep it that way: if this workflow ever
# starts needing libint2, it stops being a docs job and becomes a second CI job.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
      # `crates/**/src/**` was here to rebuild the API docs when source
      # changed. With rustdoc out of this job, a Rust change cannot alter the
      # published output, so triggering on it would only burn runner minutes.
  workflow_dispatch:

# Least privilege: read the tree, write Pages, and mint the OIDC token the
# deploy action exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do NOT cancel one in flight — a
# half-finished Pages deployment is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Rust toolchain and no cargo cache: this job builds the book only.
      # Both were here for a rustdoc step that had to be removed (see the
      # comment above "Assemble the site"), and an unused toolchain install is
      # just a slower job that looks like it does more than it does.

      - name: Install mdBook
        run: |
          # Pinned: an mdBook minor bump has changed rendered output before, and
          # a docs site that silently reflows on an unrelated push is a nuisance
          # to bisect.
          tar_url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$tar_url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build site

      # rustdoc is NOT built here, and the reason is worth recording because the
      # opposite was assumed when this workflow was written.
      #
      # `cargo doc` does not LINK, but it does run build scripts — and
      # ferric-integrals' build.rs compiles shim/shim.cc, which needs
      # libint2.hpp. On a runner without libint2 that fails outright
      # (run 33583179631: "libint2.hpp: No such file or directory"). So
      # documenting this workspace requires the same ~30-minute native build
      # ci.yml caches, which is far too much to pay on every docs edit.
      #
      # The book is the valuable half and needs no Rust at all, so it publishes
      # on its own. To add the API docs later, the options are (a) reuse
      # ci.yml's libint2 cache here, or (b) have ci.yml upload target/doc as an
      # artifact that this job downloads. Until then site/src/reference/api.md
      # tells readers to run `cargo doc` locally, and the /api link is left
      # out of the deployed tree rather than published broken.

      - name: Assemble the site
        run: |
          # Deployed as-is. If a rustdoc step is added back, it must write into
          # site/book/api/ — that is the path site/src/reference/api.md links to.
          test -f site/book/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
