name: docs

# Builds the mdBook site plus rustdoc API docs and publishes both to GitHub
# Pages.
#
# Deliberately does NOT build libint2. `mdbook` needs no Rust at all, and
# `cargo doc` type-checks without linking, so the ~30 min native build the CI
# workflow caches is not on this path. Keep it that way: if this workflow ever
# starts needing libint2, it stops being a docs job and becomes a second CI job.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/**/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege: read the tree, write Pages, and mint the OIDC token the
# deploy action exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do NOT cancel one in flight — a
# half-finished Pages deployment is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and doc target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/doc
          key: docs-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: docs-${{ runner.os }}-

      - name: Install mdBook
        run: |
          # Pinned: an mdBook minor bump has changed rendered output before, and
          # a docs site that silently reflows on an unrelated push is a nuisance
          # to bisect.
          tar_url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$tar_url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build site

      - name: Build rustdoc
        # --no-deps keeps this to ferric's own crates; documenting the full
        # dependency graph triples the build for no reader benefit.
        # RUSTDOCFLAGS -D warnings catches broken intra-doc links, which are
        # the usual way API docs rot after a rename.
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --no-deps

      - name: Assemble the site
        run: |
          # rustdoc lands under book/api/, which is where site/src/reference/api.md
          # points. If that path changes, fix the link in the same commit.
          cp -r target/doc site/book/api
          # rustdoc's index is a redirect stub only when there is one root crate;
          # in a workspace there is none, so point /api at the facade crate.
          cat > site/book/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ferric API documentation</title>
          <meta http-equiv="refresh" content="0; url=ferric/index.html">
          <a href="ferric/index.html">ferric API documentation</a>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
