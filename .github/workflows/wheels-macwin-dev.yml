name: Wheels macOS/Windows (DEV, branch only)

# DEVELOPMENT ONLY -- delete before this branch is marked ready. Runs the
# macOS/Windows wheel pipeline on pushes to feat/wheels-mac-win, because
# workflow_dispatch only dispatches workflow files on the default branch and
# wheels.yml must not run twice on one ref.

on:
  push:
    branches: [feat/wheels-mac-win]

concurrency:
  group: wheels-macwin-dev-${{ github.ref }}
  # Queue, never cancel: a cancelled cold libint2 build wastes ~90 min.
  cancel-in-progress: false

jobs:
  native-deps:
    uses: ./.github/workflows/native-deps-macwin.yml
