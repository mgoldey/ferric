name: Wheels spike (macOS / Windows)

# SPIKE ONLY (branch spike/wheels-mac-win). Answers "what does it take to ship
# ferric wheels for macOS and Windows": native deps from conda-forge (OpenBLAS,
# Eigen, and either conda-forge's libint2 2.13.1 + libxc 6.2.2 [libint=conda]
# or ferric's small libint2 2.7.2 export + libxc 6.2.2 built from source here
# [libint=small], as the Linux wheels do), maturin build, delocate/delvewheel
# repair, then `import ferric; run_rhf(water, sto-3g)` from the repaired wheel
# in a fresh venv with the conda prefix HIDDEN (so a missing bundled library
# fails instead of being found in the build environment).
#
# workflow_dispatch / workflow_call ONLY: no push/pull_request/schedule/tag
# triggers; uploads nothing anywhere except this run's artifacts.

on:
  workflow_dispatch:
    inputs:
      legs:
        description: "JSON list of matrix legs to run (macos-arm64, macos-x86_64, windows-x86_64)"
        required: false
        default: '["macos-arm64","macos-x86_64","windows-x86_64"]'
      libint:
        description: "conda (conda-forge libint2 2.13.1 + libxc) or small (ferric's export + libxc from source)"
        required: false
        default: conda
  # GitHub only dispatches workflow files that exist on the default branch, so
  # on this branch wheels.yml is a dispatch-only shim that calls this file.
  workflow_call:
    inputs:
      legs:
        type: string
        required: false
        default: '["macos-arm64","macos-x86_64","windows-x86_64"]'
      libint:
        type: string
        required: false
        default: conda

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  PYTHON_VERSION: "3.12"
  # Linux value of the same script (mainline build, 2026-11-09).
  # Linux, same script: dft-pbe/sto-3g -75.2261674834, rimp2/cc-pvdz -76.2308014541.
  E_WATER_LINUX: "-74.963146800039"
  # Same pins as .github/workflows/wheels.yml on main.
  LIBINT_VERSION: "2.7.2"
  LIBINT_URL: https://github.com/mgoldey/ferric/releases/download/libint-2.7.2-ferric-small-1/libint-2.7.2-ferric-small-1.tgz
  LIBINT_SHA256: 123b744cd744b19c4ca8401b3a58ed7fca3680bc638519edd806501b5919a48b  # pragma: allowlist secret
  LIBXC_VERSION: "6.2.2"

jobs:
  # ferric's small libint2 export + libxc, from source, per platform. Measures
  # how long the libint2 build takes on each hosted runner and whether the
  # export compiles with Apple clang / clang-cl at all.
  native-small:
    if: inputs.libint == 'small'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    name: native-small ${{ matrix.leg }}
    runs-on: ${{ matrix.leg == 'macos-arm64' && 'macos-15' || (matrix.leg == 'macos-x86_64' && 'macos-15-intel' || 'windows-latest') }}
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nd
          init-shell: bash
          create-args: >-
            -c conda-forge
            eigen=3.4.0
            cmake
            ninja
            llvm-tools

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build libint2 (small export) + libxc from source
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native"
          if [ "$RUNNER_OS" = Windows ]; then
            CP="$(cygpath -m "$CONDA_PREFIX/Library")"
            OUT="$(cygpath -m "$OUT")"
            MSVC_BIN="$(dirname "$(which cl)")"
            export PATH="$MSVC_BIN:/c/Program Files/LLVM/bin:$PATH"
            export CC=clang-cl CXX=clang-cl
            XC_SHARED=OFF
          else
            CP="$CONDA_PREFIX"
            export MACOSX_DEPLOYMENT_TARGET=$([ "$(uname -m)" = arm64 ] && echo 11.0 || echo 10.13)
            XC_SHARED=ON
          fi
          mkdir -p "$OUT/include" src
          cp -r "$CP/include/eigen3" "$OUT/include/"
          NPROC=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")
          echo "cores: $NPROC"; "${CXX:-c++}" --version | head -1
          cd src
          curl -sSL -o libint-small.tgz "$LIBINT_URL"
          if command -v sha256sum >/dev/null; then SHA="sha256sum"; else SHA="shasum -a 256"; fi
          echo "$LIBINT_SHA256  libint-small.tgz" | $SHA -c -
          tar xzf libint-small.tgz
          curl -sSL -o libxc.tgz "https://gitlab.com/libxc/libxc/-/archive/${LIBXC_VERSION}/libxc-${LIBXC_VERSION}.tar.gz"
          # The libxc tarball carries two doc symlinks (ChangeLog, README) that
          # Git-for-Windows tar cannot create (exit 2); neither is needed.
          tar --exclude="libxc-${LIBXC_VERSION}/ChangeLog" --exclude="libxc-${LIBXC_VERSION}/README" -xzf libxc.tgz

          t0=$(date +%s)
          cmake -S "libxc-${LIBXC_VERSION}" -B build-xc -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$OUT" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDISABLE_KXC=OFF \
            -DBUILD_SHARED_LIBS=$XC_SHARED
          cmake --build build-xc
          cmake --install build-xc
          t1=$(date +%s)
          echo "LIBXC_BUILD_SECONDS=$((t1 - t0))" | tee -a "$GITHUB_STEP_SUMMARY"

          cmake -S "libint-${LIBINT_VERSION}" -B build-int -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$OUT" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$CP" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          # Full log kept (uploaded below). If the build fails, show why; on
          # macOS retry ONLY the archive step with llvm-ar (objects are reused):
          # run 42710765800 compiled all 16838 objects and then failed at
          # `libint2.a`, with the archiver's message hidden by a log filter.
          if ! cmake --build build-int > "$GITHUB_WORKSPACE/build-int.log" 2>&1; then
            tc=$(date +%s)
            echo "LIBINT_COMPILE_SECONDS_TO_FAILURE=$((tc - t1))" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::libint2 build failed; tail of the log follows"
            tail -40 "$GITHUB_WORKSPACE/build-int.log"
            grep -c "Building CXX" "$GITHUB_WORKSPACE/build-int.log" || true
            if [ "$RUNNER_OS" != macOS ]; then exit 1; fi
            ls "$CONDA_PREFIX/bin" | grep -i -E "llvm-(ar|ranlib)" || true
            cmake -S "libint-${LIBINT_VERSION}" -B build-int \
              -DCMAKE_AR="$CONDA_PREFIX/bin/llvm-ar" -DCMAKE_RANLIB="$CONDA_PREFIX/bin/llvm-ranlib"
            cmake --build build-int > "$GITHUB_WORKSPACE/build-int-retry.log" 2>&1 || { tail -40 "$GITHUB_WORKSPACE/build-int-retry.log"; exit 1; }
            echo "LIBINT_ARCHIVE_RETRY=llvm-ar OK" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cmake --install build-int
          t2=$(date +%s)
          echo "LIBINT_BUILD_SECONDS=$((t2 - t1))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la "$OUT/lib" "$OUT/bin" 2>/dev/null || true
          du -sh "$OUT/lib"/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-small-log-${{ matrix.leg }}
          path: build-int*.log
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-small-${{ matrix.leg }}
          path: |
            native/
            !native/share/**
          retention-days: 3

  wheel:
    needs: native-small
    if: ${{ !cancelled() && (needs.native-small.result == 'success' || needs.native-small.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    name: wheel ${{ matrix.leg }} (${{ inputs.libint }})
    # (A matrix `include` keyed on leg would ADD unlisted legs, so map here.)
    runs-on: ${{ matrix.leg == 'macos-arm64' && 'macos-15' || (matrix.leg == 'macos-x86_64' && 'macos-15-intel' || 'windows-latest') }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Native deps from conda-forge. No python in this env on purpose: the
      # wheel is built for, and tested with, setup-python's interpreter.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nd
          init-shell: bash
          create-args: >-
            -c conda-forge
            ${{ inputs.libint == 'conda' && 'libint=2.13.1 libxc-c=6.2.2 libboost-headers' || '' }}
            openblas
            eigen=3.4.0
            cmake
            ninja
            pkg-config

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.libint == 'small'
        with:
          name: native-small-${{ matrix.leg }}
          path: native

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Toolchain + prefix layout
        run: |
          set -x
          rustc --version; cargo --version
          if [ "$RUNNER_OS" = Windows ]; then
            P="$(cygpath -m "$CONDA_PREFIX/Library")"
            S="$(cygpath -m "$GITHUB_WORKSPACE/native")"
          else
            P="$CONDA_PREFIX"
            S="$GITHUB_WORKSPACE/native"
            clang --version | head -1
          fi
          if [ '${{ inputs.libint }}' = small ]; then L="$S"; else L="$P"; S="$P"; fi
          echo "NATIVE_PREFIX=$P" >> "$GITHUB_ENV"   # conda: OpenBLAS (+ Eigen)
          echo "LIBS_PREFIX=$S" >> "$GITHUB_ENV"     # libint2 + libxc
          echo "LIBINT2_PREFIX=$L" >> "$GITHUB_ENV"
          ls "$P/lib" | head -60
          ls "$S/lib" | head -40
          grep -E "LIBINT_MAX_AM|MAX_DERIV" "$L/include/libint2/config.h" | head

      - name: Build wheel (maturin --release)
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$NATIVE_PREFIX/lib/pkgconfig"
          export RUSTFLAGS="-L native=$LIBS_PREFIX/lib -L native=$NATIVE_PREFIX/lib"
          if [ "$RUNNER_OS" = macOS ]; then
            # conda-forge's osx-arm64 libraries target macOS 11.0; osx-64 10.13.
            export MACOSX_DEPLOYMENT_TARGET=$([ "$(uname -m)" = arm64 ] && echo 11.0 || echo 10.13)
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # Git-for-Windows' /usr/bin/link (coreutils) shadows MSVC link.exe
            # in a login bash; pin the MSVC one for rustc and CMake/Ninja.
            # libecpint (and shim.cc) use variable-length arrays, which cl.exe
            # rejects (C2131). clang-cl is MSVC-ABI and accepts them; it is
            # also what conda-forge builds libint2 with on win-64. CC/CXX are
            # read by both cc-rs (shim) and CMake (libecpint).
            MSVC_BIN="$(dirname "$(which cl)")"
            export PATH="$MSVC_BIN:/c/Program Files/LLVM/bin:$PATH"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$MSVC_BIN/link.exe"
            export CC=clang-cl CXX=clang-cl
            which link clang-cl && clang-cl --version | head -1
          fi
          PY='${{ steps.py.outputs.python-path }}'
          "$PY" -m pip install -q "maturin>=1.7,<2"
          start=$(date +%s)
          "$PY" -m maturin build --release -i "$PY" --out dist 2>&1 | tee build.log
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la dist

      - name: Repair (delocate / delvewheel)
        run: |
          set -euo pipefail
          PY='${{ steps.py.outputs.python-path }}'
          if [ "$RUNNER_OS" = macOS ]; then
            "$PY" -m pip install -q delocate
            delocate-listdeps --all dist/*.whl || true
            DYLD_LIBRARY_PATH="$LIBS_PREFIX/lib:$NATIVE_PREFIX/lib" delocate-wheel -v -w wheelhouse dist/*.whl
            delocate-listdeps --all wheelhouse/*.whl
          else
            "$PY" -m pip install -q delvewheel
            "$PY" -m delvewheel show --add-path "$LIBS_PREFIX/bin;$NATIVE_PREFIX/bin" dist/*.whl
            "$PY" -m delvewheel repair --add-path "$LIBS_PREFIX/bin;$NATIVE_PREFIX/bin" -w wheelhouse dist/*.whl
          fi
          ls -la wheelhouse
          "$PY" -c "import sys,zipfile;z=zipfile.ZipFile(sys.argv[1]);[print(f'{i.file_size:>12} {i.compress_size:>12} {i.filename}') for i in z.infolist() if not i.filename.endswith('.py')]" wheelhouse/*.whl
          du -h wheelhouse/*.whl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-wheel-${{ matrix.leg }}-${{ inputs.libint }}
          path: wheelhouse/*.whl
          retention-days: 7

      # Plain (non-login) bash: no micromamba activation, and the conda root
      # and the from-source prefix are renamed away so nothing outside the
      # wheel can satisfy a library load.
      - name: Smoke test from the repaired wheel (build prefixes hidden)
        shell: bash {0}
        run: |
          set -euo pipefail
          mv "$MAMBA_ROOT_PREFIX" "$MAMBA_ROOT_PREFIX.hidden"
          if [ -d native ]; then mv native native.hidden; fi
          PY='${{ steps.py.outputs.python-path }}'
          "$PY" -m venv "$RUNNER_TEMP/v"
          if [ "$RUNNER_OS" = Windows ]; then VPY="$RUNNER_TEMP/v/Scripts/python.exe"; else VPY="$RUNNER_TEMP/v/bin/python"; fi
          "$VPY" -m pip install -q wheelhouse/*.whl
          cp scripts/wheel_spike_smoke.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          export PYTHONUNBUFFERED=1
          "$VPY" wheel_spike_smoke.py "$E_WATER_LINUX" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_OS" = Windows ]; then FERRIC="$RUNNER_TEMP/v/Scripts/ferric.exe"; else FERRIC="$RUNNER_TEMP/v/bin/ferric"; fi
          "$FERRIC" --help | head -5
          # Each broad case in its own process: a native abort (e.g. a libint2
          # assert) must not hide the other cases. Failures are reported, and
          # fail the step at the end.
          bad=0
          for c in $("$VPY" wheel_spike_smoke.py --list | tr -d '\r'); do
            set +e
            "$VPY" wheel_spike_smoke.py --case "$c" > case.out 2>&1
            rc=$?
            set -e
            grep -E "^BROAD|Assertion|Error|error" case.out | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != 0 ]; then echo "BROAD $c EXIT $rc" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1; fi
          done
          exit $bad
