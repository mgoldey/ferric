name: Wheels

# SPIKE BRANCH ONLY (spike/wheels-mac-win) -- NOT the release workflow.
# main's real wheels.yml is untouched. GitHub only lets `gh workflow run`
# dispatch a workflow file that exists on the default branch; dispatching
# main's wheels.yml with `--ref spike/wheels-mac-win` runs THIS file, which
# just calls the spike workflow. workflow_dispatch only: no push,
# pull_request, schedule or tag triggers.

on:
  workflow_dispatch:
    inputs:
      legs:
        description: "JSON list: macos-arm64, macos-x86_64, windows-x86_64"
        required: false
        default: '["macos-arm64","macos-x86_64","windows-x86_64"]'
      libint:
        description: "conda | small"
        required: false
        default: conda
      native_from_run:
        description: "reuse native-small artifacts from this run id"
        required: false
        default: ""

# Per run (superseded runs are cancelled by hand), so a single-leg retry does
# not cancel other legs still in flight.
concurrency:
  group: wheels-spike-${{ github.run_id }}

jobs:
  spike:
    uses: ./.github/workflows/wheels-spike.yml
    with:
      legs: ${{ inputs.legs }}
      libint: ${{ inputs.libint }}
      native_from_run: ${{ inputs.native_from_run }}
