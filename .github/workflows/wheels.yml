name: Wheels

# Builds self-contained manylinux x86_64 Python wheels so `pip install ferric`
# works WITHOUT the user building libint2 (a ~30 min C++ build) or installing
# OpenBLAS/LAPACK/Eigen/libxc themselves. See ci.yml for the from-source
# libint2 build this workflow reuses the same mpqc4 tarball + version for; this
# file does NOT reuse ci.yml's *cache entries*, because the manylinux_2_28
# container (AlmaLinux 8 glibc/libstdc++, used for auditwheel-repair
# compliance) is a different ABI than the ubuntu-22.04 runner ci.yml builds
# on -- a `.so`/`.a` built on one is not guaranteed loadable/linkable on the
# other, so this workflow builds its own native deps inside the container.
#
# Linux x86_64 ONLY. No macOS, no Windows -- ferric's build.rs hardcodes
# `/usr/include/eigen3` and links `libint2`/`libecpint` as Unix static
# archives (`cargo:rustc-link-lib=static=...`) with a C++ shim compiled by
# `cc`; none of that is portable to a MSVC or Apple-clang toolchain without
# work nobody has scoped, let alone tested. Scope this to what is proven.
#
# THIS WORKFLOW IS UNTESTED. It has never been run end-to-end (see the PR
# description) -- it was written by reading ci.yml and the crate build
# scripts, not by a green CI run. Treat the first real run as a debugging
# session, not a confirmation.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Same reasoning as ci.yml: rayon owns ferric's parallelism, OpenBLAS must
  # not also spawn a thread pool underneath it.
  OPENBLAS_NUM_THREADS: "1"
  # Same reasoning as ci.yml's OPENBLAS_CORETYPE=Haswell (see the long
  # comment there): OpenBLAS's DYNAMIC_ARCH runtime dispatch produced GARBAGE
  # numerics on a Zen 4 GitHub runner (run 33213558759, 2026-08-28) that never
  # reproduced locally. A wheel is worse exposure than ci.yml's own binary:
  # ci.yml runs on GitHub-chosen hardware we can inspect after the fact, but
  # a wheel built here runs on WHATEVER CPU the eventual `pip install` user
  # has, unknown to us and never inspectable. Forcing the mature Haswell/AVX2
  # kernel set at import time (ferric's pymodule init reads this env var --
  # see crates/ferric-python/src/lib.rs) trades peak throughput on newer
  # chips for not shipping a numerics bug to a stranger's machine. If this
  # ever needs lifting, it should be re-derived from a NEWER measurement, not
  # assumed fixed by "later OpenBLAS", since the failure never reproduced
  # locally and so was never root-caused to a specific dispatch table.
  OPENBLAS_CORETYPE: Haswell
  LIBINT_VERSION: "2.7.2"
  # Deliberately pinned well past 0.3.20 (the version ci.yml documents as
  # producing garbage on Zen 4/Sapphire Rapids) rather than "latest" at build
  # time. Building from source (below) rather than trusting whatever the
  # manylinux image or a distro repo happens to carry is the whole point:
  # nobody has re-run the ci.yml incident's reproduction against this
  # version, so this is a documented BEST GUESS, not a cleared hazard -- see
  # the "OpenBLAS build" step and the PR description.
  OPENBLAS_VERSION: "0.3.27"
  LIBXC_VERSION: "6.2.2"
  EIGEN_VERSION: "3.4.0"

jobs:
  # Builds OpenBLAS + libxc + libint2 + Eigen ONCE, inside the SAME
  # manylinux_2_28 container build-wheels uses, and hands the result to all
  # four matrix legs as a build artifact instead of each of them building
  # its own copy.
  #
  # This replaced a 4-way actions/cache RACE that made the cache close to
  # useless: all four build-wheels legs shared one cache key (native deps
  # don't depend on the target Python version), all four started at the
  # same time, all four missed the cache simultaneously on a cold cache, and
  # only ONE of the four `actions/cache/save` calls could win -- the other
  # three logged "Cache save failed" (a soft warning, not a failed step) and
  # their ~75-125 min of native-build work was thrown away. Measured on run
  # 33697177255: legs took 76/101/110/125 min despite starting together and
  # building byte-identical output, and only build-wheels(3.10)'s save
  # actually landed; the annotations for 3.11/3.12/3.13 read "Cache save
  # failed." A WARM cache (the lucky leg that wins the race, or a later run
  # reusing what it saved) is fast; this job makes EVERY run warm for all
  # four legs, not one in four.
  #
  # actions/upload-artifact + download-artifact instead of actions/cache:
  # a race is structurally impossible when exactly one job writes and N jobs
  # only ever read -- there is no "who gets there first", no restore-vs-save
  # ordering to reason about, and no silent partial-success like the cache
  # save's soft-fail above.
  build-native-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Same reasoning as build-wheels' own "Free runner disk space" step
      # (unchanged below) -- this job pulls the same multi-GB manylinux_2_28
      # image and does the same from-source native builds, just once instead
      # of four times, so it hits the same disk-pressure risk on its own.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      # The FULL native-deps build -- compiler toolchain + Eigen + OpenBLAS +
      # libxc + libint2 -- lives ONLY here now. build-wheels below has its
      # own much smaller "Prepare container for maturin build" step that
      # copies just the Eigen headers (the one piece a fresh per-leg
      # container still needs on its own filesystem); it is not a second
      # copy of this script.
      - name: Write native-deps build script
        run: |
          mkdir -p native-deps-cache
          cat > native-deps-cache/build-native-deps.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PREFIX="$1"
          EIGEN_VERSION="$2"
          OPENBLAS_VERSION="$3"
          LIBXC_VERSION="$4"
          LIBINT_VERSION="$5"
          mkdir -p "$PREFIX"

          # AlmaLinux 8 base image: gcc-toolset-12 gets us a C++17 compiler new
          # enough for libint2's engine.impl.h (same requirement ci.yml notes
          # for Ubuntu's g++). gfortran is OpenBLAS's reference-LAPACK path.
          # perl-IPC-Cmd is OpenSSL's (transitive, via wget/cmake) build dep on
          # this image; harmless to include even if not strictly needed here.
          # The Fortran compiler package is `gcc-toolset-12-gcc-gfortran`, NOT
          # `gcc-toolset-12-gfortran`. RHEL8/AlmaLinux names the toolset's
          # compilers `gcc-toolset-N-gcc-<lang>` (the bare `gcc-toolset-12`
          # metapackage pulls C/C++ only). The wrong name failed all four
          # matrix legs identically in run 33584794617 with
          # "Unable to find a match: gcc-toolset-12-gfortran" — dnf resolved
          # every other package in this list, so this was the sole blocker.
          dnf install -y gcc-toolset-12 gcc-toolset-12-gcc-gfortran cmake \
            wget tar gzip patch perl-IPC-Cmd python3 which
          source /opt/rh/gcc-toolset-12/enable
          # Fail here, not 20 minutes later. Without gfortran, OpenBLAS builds
          # a crippled LAPACK and the breakage surfaces as missing symbols at
          # ferric's link step — far from the cause. `dnf install` succeeding
          # is not proof the compiler is on PATH, since the toolset needs the
          # `enable` script sourced first.
          command -v gfortran >/dev/null 2>&1 || {
            echo "::error::gcc-toolset-12 has no gfortran on PATH after sourcing enable; OpenBLAS's LAPACK needs it"
            exit 1
          }
          gfortran --version | head -1

          # --- Eigen (header-only; libint2/libecpint's shim needs
          # /usr/include/eigen3, hardcoded in ferric-integrals/build.rs) ---
          cd /tmp
          wget -q https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
          tar xzf eigen-${EIGEN_VERSION}.tar.gz
          # TWO consumers with DIFFERENT requirements, hence two installs:
          #
          # 1. ferric's own build.rs hardcodes `/usr/include/eigen3` as an
          #    include path (crates/ferric-integrals/build.rs) — a plain header
          #    copy is all that needs. build-wheels' own "Prepare container
          #    for maturin build" step repeats JUST this copy (not the
          #    CMake install below) on every matrix leg's fresh container --
          #    this job's copy exists so build-native-deps' OWN container can
          #    build libint2 against it below, not for anything downstream.
          # 2. libint2's CMake calls find_package(Eigen3), which needs Eigen's
          #    generated CMake CONFIG files (Eigen3Config.cmake et al.), not
          #    headers. Copying headers alone left it failing with
          #    "C++ API cannot be built without Eigen3" (run 33636559804) even
          #    though every header was present — find_package does not look for
          #    headers, it looks for the config package.
          #
          # So: copy the headers for (1), and run Eigen's own trivial
          # (header-only) CMake install into $PREFIX for (2), then point
          # libint2 at it via CMAKE_PREFIX_PATH below.
          mkdir -p /usr/include/eigen3
          cp -r eigen-${EIGEN_VERSION}/Eigen /usr/include/eigen3/
          cp -r eigen-${EIGEN_VERSION}/unsupported /usr/include/eigen3/

          mkdir -p eigen-${EIGEN_VERSION}/build && cd eigen-${EIGEN_VERSION}/build
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTING=OFF
          make install
          cd /tmp

          NPROC=$(nproc)

          # --- OpenBLAS (dynamic; auditwheel/maturin vendors the .so) ---
          # DYNAMIC_ARCH=1 is OpenBLAS's OWN runtime-dispatch feature -- the
          # exact mechanism ci.yml's incident blames for the Zen 4 garbage
          # result. Turning it OFF and building a single fixed TARGET instead
          # trades "picks the best kernel per-CPU at runtime" for "always
          # runs the kernel we tested", which is the safer default for a
          # binary artifact going to unknown hardware. TARGET=HASWELL matches
          # the OPENBLAS_CORETYPE=Haswell runtime workaround above -- if that
          # env var is ever lifted, this TARGET must be reconsidered too, they
          # are the same tradeoff made twice.
          cd /tmp
          wget -q https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz
          tar xzf OpenBLAS-${OPENBLAS_VERSION}.tar.gz
          cd OpenBLAS-${OPENBLAS_VERSION}
          make -j"$NPROC" DYNAMIC_ARCH=0 TARGET=HASWELL USE_THREAD=1 USE_OPENMP=0 NO_STATIC=0 NO_SHARED=0
          make PREFIX="$PREFIX" install

          # --- libxc (dynamic; ferric-dft/build.rs: `cargo:rustc-link-lib=xc`) ---
          cd /tmp
          wget -q https://gitlab.com/libxc/libxc/-/archive/${LIBXC_VERSION}/libxc-${LIBXC_VERSION}.tar.gz
          tar xzf libxc-${LIBXC_VERSION}.tar.gz
          cd libxc-${LIBXC_VERSION}
          mkdir build && cd build
          # -DCMAKE_POLICY_VERSION_MINIMUM=3.5: libxc 6.2.2's CMakeLists.txt
          # declares a cmake_minimum_required below 3.5, and CMake 4.x REMOVED
          # compatibility with those — it hard-errors rather than warning
          # ("Compatibility with CMake < 3.5 has been removed from CMake",
          # run 33635089264). The manylinux_2_28 image ships a CMake new
          # enough to refuse. The flag is CMake's own documented escape hatch
          # for exactly this, and it only relaxes the policy floor; it does
          # not change any build setting of libxc itself. Pinning an older
          # CMake would work too, but that trades a one-line flag for a whole
          # extra toolchain to keep current.
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDISABLE_KXC=OFF
          make -j"$NPROC"
          make install

          # -DCMAKE_INSTALL_LIBDIR=lib on both libxc and libint2 (below): AlmaLinux
          # 8 is RPM/RHEL-family, where CMake's GNUInstallDirs module defaults
          # CMAKE_INSTALL_LIBDIR to "lib64" on a 64-bit target -- unlike
          # ci.yml's ubuntu-22.04 runner, where it defaults to "lib" and the
          # libint2 build there has therefore never exercised this. ferric's
          # build.rs (crates/ferric-integrals/build.rs) hardcodes
          # `{LIBINT2_PREFIX}/lib` as its native-link search path with no
          # lib64 fallback, so leaving CMake's RHEL default in place here
          # would silently build a libint2.a this workflow's own cargo build
          # can never find. Forcing "lib" makes this container match the
          # path ci.yml's build has always produced.
          #
          # --- libint2 (static; same mpqc4 tarball + version + PIC flag as
          # ci.yml -- see that file for why INCLUDE_ERI/INCLUDE_ONEBODY both
          # matter and why the mpqc4 build, not Ubuntu's libint2-dev, is used) ---
          cd /tmp
          wget -q https://github.com/evaleev/libint/releases/download/v${LIBINT_VERSION}/libint-${LIBINT_VERSION}-mpqc4.tgz
          tar xzf libint-${LIBINT_VERSION}-mpqc4.tgz
          cd libint-${LIBINT_VERSION}
          mkdir build && cd build
          # -DCMAKE_POLICY_VERSION_MINIMUM=3.5 for the same reason as libxc
          # above: the mpqc4 export is a 2021-era tarball whose
          # cmake_minimum_required predates 3.5, which CMake 4.x refuses
          # outright. Set pre-emptively rather than waiting for a third failed
          # run to prove it — libint2 is the OLDER of the two sources, so if
          # libxc tripped this, libint2 was going to as well.
          # CMAKE_PREFIX_PATH="$PREFIX" so libint2's find_package(Eigen3)
          # locates the Eigen CMake config package installed above. Without it
          # libint2 refuses to build its C++ API — "C++ API cannot be built
          # without Eigen3" — even with every Eigen header present under
          # /usr/include/eigen3, because find_package looks for the config
          # package, not for headers.
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j"$NPROC"
          make install

          touch "$PREFIX/.done"
          SCRIPT_EOF
          chmod +x native-deps-cache/build-native-deps.sh

      # Plain `docker run` against the SAME image maturin-action itself pulls
      # for `manylinux: 2_28` (quay.io/pypa/manylinux_2_28_x86_64:latest,
      # confirmed from a real run's log -- maturin-action does not publish
      # this mapping anywhere easier to point at, so this is read off actual
      # `docker pull` output, not guessed at from its README). Using the
      # identical image is the whole point: the ABI compatibility this
      # workflow's header comment explains (AlmaLinux 8 glibc/libstdc++,
      # required for auditwheel-repair) only holds if what builds OpenBLAS/
      # libxc/libint2 here is bit-for-bit the same environment build-wheels
      # later links them from -- a different image, even a nearby one, would
      # silently reopen exactly the ABI mismatch this file was written to
      # avoid, and no test in this workflow would catch it before a user's
      # `pip install` did. Bind-mounting the workspace at the SAME path the
      # runner sees it at (rather than some container-local path) matches
      # maturin-action's own mounting (confirmed in the same log), which
      # matters because build-native-deps.sh assumes $PREFIX ends up at a
      # path meaningful on the host afterward (it does not care about the
      # path's value, only that it is consistent -- but matching keeps this
      # job's invocation legible next to maturin-action's own docker run).
      - name: Build native deps (manylinux_2_28 container)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash native-deps-cache/build-native-deps.sh \
              "${{ github.workspace }}/native-deps-cache" \
              "${{ env.EIGEN_VERSION }}" "${{ env.OPENBLAS_VERSION }}" \
              "${{ env.LIBXC_VERSION }}" "${{ env.LIBINT_VERSION }}"

      - name: Keep native-deps-cache out of the wheel / git
        run: echo "native-deps-cache/" >> .git/info/exclude

      # Artifact, not actions/cache: this is the one and only writer, so
      # there is nothing to race. Every build-wheels leg downloads this by
      # name below.
      #
      # !native-deps-cache/share/**: libint2's `make install` writes its own
      # bundled basis-set library under $PREFIX/share (Gaussian94-format
      # files, e.g. 6-311g**.g94) that nothing downstream reads -- ferric
      # bundles its OWN basis sets separately (crates/ferric-core/src/basis/
      # bundled/*.json via include_str!, confirmed against build.rs: neither
      # ferric-integrals' nor ferric-dft's build.rs references $PREFIX/share
      # anywhere) -- but actions/upload-artifact rejects the upload outright
      # if ANY file it would carry has a name actions considers unsafe for
      # NTFS portability, and several of libint2's basis-set filenames
      # contain a literal "*" (double-polarization notation, e.g. "**" for
      # 6-311g**) -- confirmed live: run failed with "The path for one of
      # the files in artifact is not valid: .../basis/6-311g**.g94 ...
      # Invalid characters include: ... Asterisk *". Only lib/, lib64/,
      # include/ and .done are ever read (see the exported LIBINT2_PREFIX/
      # PKG_CONFIG_PATH/LD_LIBRARY_PATH/LIBRARY_PATH/CPATH below, which name
      # exactly those four and nothing under share/), so excluding share/
      # entirely costs nothing downstream and removes the only source of
      # asterisk-bearing filenames in this tree.
      - uses: actions/upload-artifact@v4
        with:
          name: native-deps
          path: |
            native-deps-cache/
            !native-deps-cache/share/**
          if-no-files-found: error
          # Native deps are only useful for the SAME run's build-wheels
          # legs (they key off pinned versions from this run's env: block,
          # not off anything persisted across runs) -- short retention keeps
          # this from lingering as dead storage after the run completes.
          retention-days: 1

  build-wheels:
    needs: build-native-deps
    runs-on: ubuntu-22.04
    # One from-scratch native build is now build-native-deps' job, not this
    # one's -- each leg here only pays its own maturin build (compiling
    # ferric's Rust workspace + linking against the downloaded native deps),
    # which is the ~15-25 min ci.yml's own cargo build measures, not the
    # ~75-125 min the pre-fix version of this job spent per leg rebuilding
    # OpenBLAS/libxc/libint2/Eigen redundantly. Lower than the old 180 for
    # that reason; see build-native-deps' own timeout for where the native
    # build's headroom now lives.
    timeout-minutes: 60
    strategy:
      # false: a numerics or link failure on one CPython version is likely
      # present on all of them (same native deps, same shim), so let every
      # leg finish and report instead of burning runner time four times over
      # discovering the same root cause serially.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # The tag IS the version -- pyproject.toml's checked-in "0.1.0" is a
      # dev placeholder, never the version actually published. maturin has no
      # dynamic-version support for the pyo3 backend (no `dynamic = ["version"]`
      # equivalent; confirmed against `maturin build --help`, which offers no
      # env/flag to override it), so the only way to make the tag the source
      # of truth is to rewrite both files that hardcode the version BEFORE
      # `maturin build` runs -- pyproject.toml (what maturin actually reads
      # for the wheel filename/METADATA when `[project].version` is present)
      # and crates/ferric-python/Cargo.toml (kept in lockstep so the two
      # never drift, even though maturin itself doesn't consult the Cargo.toml
      # version when pyproject.toml has one).
      #
      # Only runs on a tag push -- a workflow_dispatch run (no tag) leaves
      # both files at their checked-in placeholder, since that path never
      # reaches `publish` anyway (see its `if:` guard).
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          # Require the tag to ALREADY be canonical PEP 440 -- no hyphens.
          # PEP 440 normalization is not a simple strip/replace: "-rc1" drops
          # the hyphen but "-post1"/"-dev1" gain a "." separator, and a bare
          # "-1" means ".post1" (verified against `packaging.version.Version`
          # by hand; not reimplementing that table in bash). Rather than risk
          # this step and the publish job's wheel-filename check disagreeing
          # on a normalized form neither reproduces exactly, tags MUST arrive
          # pre-normalized: v1.2.3, v1.2.3rc1, v1.2.3.post1, v1.2.3.dev1,
          # v1.2.3+local -- never v1.2.3-rc1. Every string this accepts is
          # its own PEP 440 normalization (round-trips byte-identical through
          # `Version()`), so the raw tag can be compared textually downstream
          # with no normalization step anywhere.
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?(\+[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::tag 'v${tag_version}' is not canonical PEP 440 (no hyphens -- use v1.2.3rc1, not v1.2.3-rc1) -- refusing to stamp"
            exit 1
          fi
          echo "stamping version ${tag_version} from tag ${GITHUB_REF}"
          sed -i "0,/^version = /s/^version = .*/version = \"${tag_version}\"/" pyproject.toml
          sed -i "0,/^version = /s/^version = .*/version = \"${tag_version}\"/" crates/ferric-python/Cargo.toml
          grep -m1 "^version" pyproject.toml
          grep -m1 "^version" crates/ferric-python/Cargo.toml

      # Same rationale as ci.yml's "Free runner disk space" step: the
      # manylinux_2_28 image maturin-action pulls is itself several GB, on
      # top of which this job produces a maturin/auditwheel output tree.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      # The built OpenBLAS/libxc/libint2/Eigen tree from build-native-deps --
      # built ONCE for all four legs, see that job for why (was a 4-way
      # actions/cache race before this). download-artifact, not cache: this
      # is the ONLY place that reads it, so there is no restore-vs-save
      # ordering to reason about, and a missing artifact is a hard failure
      # here rather than a silent "start the ~75 min build over" cache miss.
      - name: Download native deps
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: native-deps-cache

      - name: Keep native-deps-cache out of the wheel / git
        run: echo "native-deps-cache/" >> .git/info/exclude

      # Runs INSIDE the manylinux_2_28 (AlmaLinux 8) container, before
      # `maturin build`. This is now everything a FRESH container needs that
      # build-native-deps' one-time build could not already bake into the
      # downloaded artifact -- every matrix leg here starts its own new
      # container, and the artifact download above only puts files under
      # native-deps-cache/; it does not touch this container's own
      # filesystem.
      #
      # Eigen headers specifically: crates/ferric-integrals/build.rs hardcodes
      # `/usr/include/eigen3` as a `cc` include path (a real filesystem path
      # the crate's own build script looks for, independent of wherever the
      # downloaded artifact happens to land), so it has to be copied into
      # THIS container on every leg -- copying a few header files is cheap
      # enough that doing it four times costs nothing next to what moved
      # into build-native-deps.
      #
      # No gcc-toolset-12/gfortran install here anymore: that was ONLY for
      # building OpenBLAS's reference LAPACK from source, which now happens
      # once in build-native-deps. ferric's own build (the C++ shim compiled
      # via the `cc` crate) needs a C++ compiler, which the manylinux_2_28
      # image's base toolchain already provides -- it was never gfortran's
      # job to satisfy that.
      - name: Prepare container for maturin build
        run: |
          mkdir -p native-deps-cache
          cat > native-deps-cache/prepare-container.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          EIGEN_VERSION="$1"
          cd /tmp
          # curl, NOT wget: confirmed live -- a real run failed here with
          # "wget: command not found". build-native-deps.sh's OWN wget calls
          # work because that job's dnf install line explicitly includes
          # wget; this script has no such install (see the comment above --
          # gcc-toolset-12/gfortran/cmake/wget/etc. were all dropped from
          # THIS container on purpose, since the native builds that needed
          # them now happen once upstream). Checked what quay.io/pypa/
          # manylinux_2_28_x86_64:latest actually ships rather than guessing
          # a second time: curl.x86_64 is present by default (@baseos),
          # wget is not. Using curl here means every leg's container needs
          # zero extra packages for this step, not a dnf install added back
          # just to get wget.
          curl -sSLo eigen-${EIGEN_VERSION}.tar.gz https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
          tar xzf eigen-${EIGEN_VERSION}.tar.gz
          mkdir -p /usr/include/eigen3
          cp -r eigen-${EIGEN_VERSION}/Eigen /usr/include/eigen3/
          cp -r eigen-${EIGEN_VERSION}/unsupported /usr/include/eigen3/
          SCRIPT_EOF
          chmod +x native-deps-cache/prepare-container.sh

      - name: Build wheel (manylinux_2_28 container)
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          target: x86_64
          manylinux: 2_28
          # `--release` for a real optimized wheel; `--out dist` collects
          # every matrix leg's wheel into the same relative path for the
          # upload step below. `-i` pins the exact interpreter this leg
          # targets -- manylinux_2_28's image ships several CPythons under
          # /opt/python, and without `-i` maturin builds abi3/whatever it
          # finds first rather than the version this matrix leg is for.
          args: --release --out dist -i python${{ matrix.python-version }}
          # Runs BEFORE the build, INSIDE THE SAME SHELL SCRIPT that then
          # invokes `maturin build` (maturin-action concatenates
          # before-script-linux and the build command into one generated
          # bash script run in a single `docker run`, per its source --
          # there is no separate `docker exec`), so plain `export` here is
          # visible to the build step. Deliberately NOT using
          # `>> "$GITHUB_ENV"`: that file lives on the HOST runner and is
          # not proven to be mounted into this container, and maturin-action
          # only forwards host env vars whose names match a fixed allowlist
          # of prefixes (CARGO_/CC/CMAKE_/LD_/RUST.../etc -- see its
          # ALLOWED_ENV_PREFIXES) into `docker run -e`, which does not cover
          # PKG_CONFIG_PATH, CPATH, or LIBINT2_PREFIX. Exporting inline is
          # the only path proven to reach the build.
          #
          # This is where the FRESH container gets Eigen headers (see
          # "Prepare container for maturin build" above for why that's still
          # done per-container) and the env vars pointing at the DOWNLOADED
          # native-deps artifact -- no build happens here anymore, only
          # placement + linking of what build-native-deps already produced.
          before-script-linux: |
            set -euo pipefail
            NATIVE_PREFIX="$(pwd)/native-deps-cache"
            bash "$NATIVE_PREFIX/prepare-container.sh" "${{ env.EIGEN_VERSION }}"
            export LIBINT2_PREFIX="$NATIVE_PREFIX"
            export PKG_CONFIG_PATH="$NATIVE_PREFIX/lib/pkgconfig:$NATIVE_PREFIX/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64${LIBRARY_PATH:+:$LIBRARY_PATH}"
            export CPATH="$NATIVE_PREFIX/include${CPATH:+:$CPATH}"

      - name: Wheel size / contents sanity check
        run: |
          set -euo pipefail
          ls -lh dist/
          for whl in dist/*.whl; do
            echo "--- $whl ---"
            python3 -m zipfile -l "$whl" | grep -iE '\.so$|openblas|libxc' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cp${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Installs each BUILT WHEEL (never the source tree -- a wheel that builds
  # but does not import/run is worse than no wheel, since it fails silently
  # at `pip install` time for a real user rather than loudly here) into a
  # throwaway venv and runs a real RHF calculation against it. This is the
  # only step in this workflow that proves the auditwheel/patchelf-repaired
  # .so actually loads and produces a correct number outside the build
  # container -- everything above only proves it COMPILED.
  smoke-test:
    needs: build-wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-cp${{ matrix.python-version }}
          path: dist

      - name: Install wheel into a fresh venv
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          # Install ONLY the wheel and let pip resolve its declared runtime
          # dependencies (numpy and gemmi per pyproject.toml) -- deliberately
          # not the repo's source tree or any of its extras (pyscf, vina,
          # meeko, ...), since the point is to prove the WHEEL is
          # self-contained, not to reproduce the dev environment.
          #
          # --only-binary=:all: is what keeps that claim honest. A dependency
          # with no wheel for this interpreter would otherwise fall back to an
          # sdist and start compiling, which is how the cp313 smoke test
          # failed before `vina` was moved to the `docking` extra: PyPI's vina
          # ships cp38-cp312 wheels only, so 3.13 tried to build it from
          # source and died on missing Boost headers -- a failure that had
          # nothing to do with the wheel under test. Fail fast and loudly
          # instead of silently invoking a compiler in a test job.
          pip install --only-binary=:all: dist/*.whl
          pip show ferric

      - name: Smoke test -- import + RHF energy on the built wheel
        run: |
          set -euo pipefail
          source /tmp/smoke-venv/bin/activate
          cd /tmp  # deliberately NOT the repo checkout -- there isn't one in
                   # this job, which is the point: nothing here can fall back
                   # to a source-tree `ferric` on sys.path.
          python3 - << 'PYEOF'
          import ferric

          # H2 at the standard 0.74 Angstrom bond length, STO-3G. This is not
          # a ferric-specific reference value pulled from one of the repo's
          # PySCF-comparison test fixtures (none was pulled in here, since
          # this job has no source checkout) -- it is the textbook RHF/STO-3G
          # H2 result, well outside any plausible last-few-digit convention
          # difference. The bound below is intentionally loose (asserts the
          # right BASIN, not the last decimal) so it catches the failure
          # modes this smoke test exists for -- wrong/missing OpenBLAS
          # producing garbage eigenvalues (the exact Zen 4 incident ci.yml
          # documents), a mis-linked libint2 giving wrong integrals, wrong
          # electron count, or an import that silently no-ops -- without
          # requiring bit-identical agreement with ferric's own internal
          # convergence convention, which this job has no reference for.
          mol = ferric.Molecule.from_xyz_string(
              "2\nH2\nH 0 0 0\nH 0 0 0.74\n", charge=0, multiplicity=1
          )
          basis = ferric.BasisSet.bundled("sto-3g")
          result = ferric.run_rhf(mol, basis)

          print(f"RHF/STO-3G H2 energy: {result.energy:.10f} Ha "
                f"(converged={result.converged}, iters={result.iterations})")

          assert result.converged, "SCF did not converge -- wheel's numerics are suspect"
          # Textbook value is about -1.1167 Ha; -1.30 .. -1.05 is a wide berth
          # around it that a working RHF/STO-3G H2 calculation cannot miss,
          # while a nuclear-repulsion-only, garbage-BLAS, or wrong-integral
          # failure mode would.
          assert -1.30 < result.energy < -1.05, (
              f"RHF energy {result.energy} is outside the expected basin for "
              "H2/STO-3G at r=0.74 A -- suspect broken BLAS/libint2 linkage "
              "in this wheel, not a legitimate different answer"
          )

          # Also exercise the numpy-array return path (PyArray2/PyArray1 via
          # rust-numpy) -- a separate FFI surface from the scalar `.energy`
          # float above, and the one most likely to break from an ABI/version
          # mismatch between the wheel's compiled numpy C-API expectations
          # and the numpy actually installed in this venv.
          import numpy as np
          density = result.density()
          orbital_energies = result.orbital_energies()
          assert density.shape == (2, 2), f"unexpected AO density shape {density.shape}"
          assert orbital_energies.shape == (2,), f"unexpected orbital energy count {orbital_energies.shape}"
          assert np.isfinite(density).all() and np.isfinite(orbital_energies).all()

          print("Smoke test PASSED.")
          PYEOF

  # Publishes to PyPI via trusted publishing (OIDC) -- no long-lived token in
  # this repo. All three prerequisites this job used to wait on are now met:
  #   1. Wheels from a real run (33697177255, built from c87e7456) were
  #      downloaded and exercised by hand beyond this workflow's own smoke
  #      test -- installed into fresh venvs for all four Python versions and
  #      used to run a real RI-MP2/aug-cc-pVDZ water calculation, cross-
  #      checked against an independent PySCF reference to 6e-9 Ha.
  #   2. Trusted publishing is configured on PyPI for this project (a
  #      "pending publisher" registered with owner=mgoldey, repo=ferric,
  #      workflow=wheels.yml, environment=pypi -- see pypi.org/manage/account
  #      /publishing/). Nothing to store as a GitHub secret; the `id-token:
  #      write` permission below is what lets this job mint the short-lived
  #      OIDC token PyPI's Trusted Publishers API exchanges for upload
  #      credentials, scoped to this one job run only.
  #   3. Wheel size confirmed well under PyPI's 100 MB default per-file cap:
  #      all four (cp310-cp313) measured ~65.5 MiB, not the 100-200 MB this
  #      job's placeholder comment once guessed.
  #
  # The `pypi` GitHub Environment referenced below does not need protection
  # rules to make this job WORK, but adding a required reviewer there is the
  # cheapest available brake on an accidental tag push publishing a bad
  # wheel -- consider turning that on before the first real release.
  publish:
    needs: [build-wheels, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing -- no PYPI_API_TOKEN secret
    steps:
      # pattern + merge-multiple: pulls all four wheels-cp3.NN artifacts
      # (built separately per Python version above) into one flat dist/ --
      # gh-action-pypi-publish uploads everything it finds there in one go.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Sanity-check what is about to be uploaded
        run: |
          set -euo pipefail
          echo "-- publishing from ref: ${GITHUB_REF} --"
          ls -lh dist/
          # Every wheel filename must carry the same version as the tag
          # (v0.1.0 -> ferric-0.1.0-*), and there must be exactly one wheel
          # per supported CPython tag. The "Stamp the version from the tag"
          # step in build-wheels is what makes this true in the normal case
          # -- pyproject.toml's version IS the tag by the time maturin builds
          # -- so a mismatch here means that step's rewrite didn't reach this
          # leg's build (a cache serving a pre-stamp checkout, a matrix leg
          # that failed before stamping and got re-run against stale state,
          # etc), not a hand-edited version drifting from the tag. Either
          # way: fail before PyPI ever sees it, since a bad upload to a
          # version that already exists cannot be overwritten or deleted,
          # only yanked.
          tag_version="${GITHUB_REF#refs/tags/v}"
          count=$(ls dist/*.whl | wc -l)
          echo "wheel count: $count (expect 4: cp310, cp311, cp312, cp313)"
          if [[ "$count" -ne 4 ]]; then
            echo "::error::expected 4 wheels, found $count -- refusing to publish a partial release"
            exit 1
          fi
          for whl in dist/*.whl; do
            case "$whl" in
              *"ferric-${tag_version}-"*) ;;
              *)
                echo "::error::$whl does not match tag version $tag_version"
                exit 1
                ;;
            esac
          done

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
