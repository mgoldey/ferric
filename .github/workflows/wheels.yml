name: Wheels

# SPIKE BRANCH ONLY (spike/wheels-mac-win) -- NOT the release workflow.
# main's real wheels.yml is untouched. GitHub only lets `gh workflow run`
# dispatch a workflow file that exists on the default branch; dispatching
# main's wheels.yml with `--ref spike/wheels-mac-win` runs THIS file, which
# just calls the spike workflow. workflow_dispatch only: no push,
# pull_request, schedule or tag triggers.

on:
  workflow_dispatch: {}

concurrency:
  group: wheels-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    uses: ./.github/workflows/wheels-spike.yml
