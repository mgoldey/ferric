name: Wheels

# Builds self-contained manylinux x86_64 Python wheels so `pip install ferric`
# works WITHOUT the user building libint2 (a ~30 min C++ build) or installing
# OpenBLAS/LAPACK/Eigen/libxc themselves. See ci.yml for the from-source
# libint2 build this workflow reuses the same mpqc4 tarball + version for; this
# file does NOT reuse ci.yml's *cache entries*, because the manylinux_2_28
# container (AlmaLinux 8 glibc/libstdc++, used for auditwheel-repair
# compliance) is a different ABI than the ubuntu-22.04 runner ci.yml builds
# on -- a `.so`/`.a` built on one is not guaranteed loadable/linkable on the
# other, so this workflow builds its own native deps inside the container.
#
# Linux x86_64 ONLY. No macOS, no Windows -- ferric's build.rs hardcodes
# `/usr/include/eigen3` and links `libint2`/`libecpint` as Unix static
# archives (`cargo:rustc-link-lib=static=...`) with a C++ shim compiled by
# `cc`; none of that is portable to a MSVC or Apple-clang toolchain without
# work nobody has scoped, let alone tested. Scope this to what is proven.
#
# THIS WORKFLOW IS UNTESTED. It has never been run end-to-end (see the PR
# description) -- it was written by reading ci.yml and the crate build
# scripts, not by a green CI run. Treat the first real run as a debugging
# session, not a confirmation.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  schedule:
    # 10:53 UTC daily -- this workflow's header admits it has NEVER been
    # validated by a green run; it was written by reading ci.yml, not by
    # exercising it. Without a schedule, the wheel-build/native-deps/
    # smoke-test pipeline gets its FIRST real execution at the moment of an
    # actual release tag push -- the worst possible time to discover a
    # manylinux_2_28-container issue, a maturin-action regression, or a
    # native-deps cache problem. A nightly run makes tag day the Nth
    # confirmed-green run, not the first.
    #
    # 10:53, not 04:17: ci.yml already owns 04:17 UTC for its own nightly
    # (see that file's `schedule:` block), which runs the deferred slow test
    # tier plus a libint2 cache rebuild on a miss. Picking a DIFFERENT hour,
    # not just a different minute, leaves a multi-hour gap so the two
    # nightlies are never fighting for the same 2 free ubuntu-22.04 runners
    # or racing to write into the shared, already-tight 10 GB repo cache
    # budget (see the "Restore/Save native deps cache" steps below for why
    # that budget matters here too). Minute :53 (off-the-hour) matches this
    # repo's existing convention of not scheduling on a round hour, where
    # every other repo's cron also tends to land and GitHub's scheduler is
    # documented to be busiest.
    - cron: '53 10 * * *'

# Prevents two wheel-build runs for the SAME ref from executing concurrently
# (e.g. a workflow_dispatch fired by hand while last night's scheduled run is
# still going, or two scheduled runs overlapping if one runs long) -- there is
# no reason to burn two sets of runners rebuilding the identical thing twice.
#
# cancel-in-progress is conditional, NOT a flat `true`, and that condition is
# the whole point of this block: `github.ref` for a tag push is the TAG
# itself (refs/tags/vX.Y.Z, unique per release), so a tag build already gets
# its own dedicated group that no nightly (`refs/heads/main`) or manual
# dispatch run can ever share or collide with -- but if this workflow were
# ever re-triggered for that same tag (a force-pushed/re-pushed tag, rare but
# not impossible), a flat `cancel-in-progress: true` would cancel the FIRST
# in-flight tag build the moment the second one starts queuing, mid-publish
# if unlucky. That is a categorically worse outcome than the redundant
# runner-minutes a flat `true` would save: a cancelled release build can
# leave a partial/inconsistent PyPI upload, while a cancelled *nightly* run
# has nothing depending on it finishing. So: cancel freely for every non-tag
# ref (schedule, workflow_dispatch), never for a tag ref.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Same reasoning as ci.yml: rayon owns ferric's parallelism, OpenBLAS must
  # not also spawn a thread pool underneath it.
  OPENBLAS_NUM_THREADS: "1"
  # Same reasoning as ci.yml's OPENBLAS_CORETYPE=Haswell (see the long
  # comment there): OpenBLAS's DYNAMIC_ARCH runtime dispatch produced GARBAGE
  # numerics on a Zen 4 GitHub runner (run 33213558759, 2026-08-28) that never
  # reproduced locally. A wheel is worse exposure than ci.yml's own binary:
  # ci.yml runs on GitHub-chosen hardware we can inspect after the fact, but
  # a wheel built here runs on WHATEVER CPU the eventual `pip install` user
  # has, unknown to us and never inspectable. Forcing the mature Haswell/AVX2
  # kernel set at import time (ferric's pymodule init reads this env var --
  # see crates/ferric-python/src/lib.rs) trades peak throughput on newer
  # chips for not shipping a numerics bug to a stranger's machine. If this
  # ever needs lifting, it should be re-derived from a NEWER measurement, not
  # assumed fixed by "later OpenBLAS", since the failure never reproduced
  # locally and so was never root-caused to a specific dispatch table.
  OPENBLAS_CORETYPE: Haswell
  LIBINT_VERSION: "2.7.2"
  # Deliberately pinned well past 0.3.20 (the version ci.yml documents as
  # producing garbage on Zen 4/Sapphire Rapids) rather than "latest" at build
  # time. Building from source (below) rather than trusting whatever the
  # manylinux image or a distro repo happens to carry is the whole point:
  # nobody has re-run the ci.yml incident's reproduction against this
  # version, so this is a documented BEST GUESS, not a cleared hazard -- see
  # the "OpenBLAS build" step and the PR description.
  OPENBLAS_VERSION: "0.3.27"
  LIBXC_VERSION: "6.2.2"
  EIGEN_VERSION: "3.4.0"
  # SHA-pinned manylinux image for the mpi-wheel job's own `docker run`
  # auditwheel-repair step (maturin-action pulls its own copy by tag for the
  # build itself; this pin governs only the repair container). Pinned by
  # digest rather than `:latest` for the same reason every `uses:` in this
  # repo is pinned to a commit SHA: the repair step's --exclude sonames are
  # tied to the AlmaLinux 8 OpenMPI packaged in THIS image, so a silently
  # moving tag could change libevent's soname out from under the exclusion
  # list. Resolved 2026-09-16 from quay.io/pypa/manylinux_2_28_x86_64:latest.
  # The trailing pragma is for detect-secrets, which flags this as a "Hex High
  # Entropy String" purely on shape. It is a PUBLIC container image digest,
  # not a credential -- being published is the entire point of it.
  MANYLINUX_DIGEST: "531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4"  # pragma: allowlist secret

jobs:
  # Builds OpenBLAS + libxc + libint2 + Eigen ONCE, inside the SAME
  # manylinux_2_28 container build-wheels uses, and hands the result to all
  # four matrix legs as a build artifact instead of each of them building
  # its own copy.
  #
  # This replaced a 4-way actions/cache RACE that made the cache close to
  # useless: all four build-wheels legs shared one cache key (native deps
  # don't depend on the target Python version), all four started at the
  # same time, all four missed the cache simultaneously on a cold cache, and
  # only ONE of the four `actions/cache/save` calls could win -- the other
  # three logged "Cache save failed" (a soft warning, not a failed step) and
  # their ~75-125 min of native-build work was thrown away. Measured on run
  # 33697177255: legs took 76/101/110/125 min despite starting together and
  # building byte-identical output, and only build-wheels(3.10)'s save
  # actually landed; the annotations for 3.11/3.12/3.13 read "Cache save
  # failed." A WARM cache (the lucky leg that wins the race, or a later run
  # reusing what it saved) is fast; this job makes EVERY run warm for all
  # four legs, not one in four.
  #
  # actions/upload-artifact + download-artifact SHARES this run's build with
  # the four build-wheels legs below: a race is structurally impossible when
  # exactly one job writes and N jobs only ever read -- there is no "who
  # gets there first", no restore-vs-save ordering to reason about, and no
  # silent partial-success like the cache save's soft-fail above.
  #
  # That alone didn't fix wall-clock time: eliminating four REDUNDANT builds
  # still leaves exactly one ~85 min build on the critical path of every
  # tag push, since build-wheels needs() this job and cannot start without
  # it. actions/cache is back (below, "Restore/Save native deps cache") for
  # exactly the piece the artifact mechanism cannot provide -- persistence
  # ACROSS separate workflow runs, not just within one -- and it is safe
  # here for the same reason the artifact split is: this job is still the
  # ONLY writer, so the old 4-way race this section describes cannot recur.
  build-native-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      # Bump to invalidate every cache entry at once (e.g. after a CMake-flag
      # or dnf-package-list change in build-native-deps.sh that doesn't touch
      # one of the pinned versions above) without hunting down individual
      # keys. Job-scoped rather than in the workflow-level env: block above:
      # it isn't a source input like OPENBLAS_VERSION/LIBXC_VERSION/etc, and
      # it's only ever read by this job's own cache key (both occurrences,
      # restore and save, below).
      NATIVE_DEPS_CACHE_VERSION: v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Persist the BUILT native deps across separate runs (different tag
      # pushes, or a workflow_dispatch rerun days later).
      #
      # This is a REAL cache, unlike the actions/cache this workflow used to
      # have here (removed in #16): that one was raced 4-way (every
      # build-wheels leg shared the key, all four missed simultaneously, only
      # one of four saves could win -- see the block comment above this job
      # for the measured numbers). This job is now the ONLY writer, so there
      # is no "who gets there first" to reason about: restore here, save
      # there, exactly once per run, matching the ordinary actions/cache
      # pattern this repo's own ci.yml already uses successfully for
      # libint2. What #16 did NOT fix -- and this closes -- is that even a
      # cache-hit run still paid the full ~85 min native build, because the
      # in-script `.done`-file early exit that used to skip it was removed
      # as part of the split (there was no cache-hit branch left to check).
      # The skip now lives at the WORKFLOW level instead: `cache-hit` from
      # this restore step gates the docker-build step below via `if:`.
      #
      # native-deps-v2, not v1: deliberately a DIFFERENT namespace than the
      # pre-#16 cache key (which was native-deps-${{ NATIVE_DEPS_CACHE_VERSION
      # == v1 }}-...), so a stale entry from before this job existed can never
      # get restored here by coincidence.
      #
      # This key's NAME never collides with ci.yml's (`libint-*`, `cargo-v3-*`
      # -- disjoint prefixes), but GitHub Actions caches are budgeted PER
      # REPOSITORY, not per workflow: ci.yml's own comments document this repo
      # already running close to the 10 GB cap, to the point that evicting its
      # libint2 cache costs ~80 min/run. Adding a nightly schedule here means
      # this job's own cache entry (OpenBLAS+libxc+libint2+Eigen, a
      # multi-hundred-MB-plus artifact) now competes for that SAME shared 10 GB
      # pool every night, on top of ci.yml's 04:17 UTC nightly writing/
      # refreshing its own entries a few hours earlier. Once the pinned
      # versions above are stable this key stays constant across nights (a
      # cache hit restores instead of re-saving), so this is a one-time budget
      # addition rather than nightly churn against a fixed key -- but if the
      # pinned versions ever bump, or GitHub's 7-day unused-cache eviction
      # kicks this entry out between runs, that save DOES recur and DOES add
      # fresh pressure to the same pool ci.yml depends on. Nobody has measured
      # the actual combined size against the 10 GB cap post-schedule; if CI
      # starts seeing libint2 cache misses that correlate with this workflow's
      # nightly runs, this is the first place to look.
      - name: Restore native deps cache
        id: cache-native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/native-deps-cache
          key: native-deps-${{ env.NATIVE_DEPS_CACHE_VERSION }}-manylinux_2_28-openblas${{ env.OPENBLAS_VERSION }}-libxc${{ env.LIBXC_VERSION }}-libint${{ env.LIBINT_VERSION }}-eigen${{ env.EIGEN_VERSION }}

      # Same reasoning as build-wheels' own "Free runner disk space" step
      # (unchanged below) -- this job pulls the same multi-GB manylinux_2_28
      # image and does the same from-source native builds, just once instead
      # of four times, so it hits the same disk-pressure risk on its own.
      # Runs even on a cache hit: the manylinux_2_28 image pull itself is the
      # dominant disk cost of this job regardless of whether the native
      # build runs, and skipping this on a hit would leave that risk
      # unguarded on exactly the runs it's cheapest to check on.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      # The FULL native-deps build -- compiler toolchain + Eigen + OpenBLAS +
      # libxc + libint2 -- lives ONLY here now. build-wheels below has its
      # own much smaller "Prepare container for maturin build" step that
      # copies just the Eigen headers (the one piece a fresh per-leg
      # container still needs on its own filesystem); it is not a second
      # copy of this script.
      #
      # Skipped on a cache hit -- writing the script is pointless if the
      # docker-run step that would consume it (below, same `if:`) isn't
      # going to execute.
      - name: Write native-deps build script
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          mkdir -p native-deps-cache
          cat > native-deps-cache/build-native-deps.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PREFIX="$1"
          EIGEN_VERSION="$2"
          OPENBLAS_VERSION="$3"
          LIBXC_VERSION="$4"
          LIBINT_VERSION="$5"
          mkdir -p "$PREFIX"

          # AlmaLinux 8 base image: gcc-toolset-12 gets us a C++17 compiler new
          # enough for libint2's engine.impl.h (same requirement ci.yml notes
          # for Ubuntu's g++). gfortran is OpenBLAS's reference-LAPACK path.
          # perl-IPC-Cmd is OpenSSL's (transitive, via wget/cmake) build dep on
          # this image; harmless to include even if not strictly needed here.
          # The Fortran compiler package is `gcc-toolset-12-gcc-gfortran`, NOT
          # `gcc-toolset-12-gfortran`. RHEL8/AlmaLinux names the toolset's
          # compilers `gcc-toolset-N-gcc-<lang>` (the bare `gcc-toolset-12`
          # metapackage pulls C/C++ only). The wrong name failed all four
          # matrix legs identically in run 33584794617 with
          # "Unable to find a match: gcc-toolset-12-gfortran" — dnf resolved
          # every other package in this list, so this was the sole blocker.
          dnf install -y gcc-toolset-12 gcc-toolset-12-gcc-gfortran cmake \
            wget tar gzip patch perl-IPC-Cmd python3 which
          source /opt/rh/gcc-toolset-12/enable
          # Fail here, not 20 minutes later. Without gfortran, OpenBLAS builds
          # a crippled LAPACK and the breakage surfaces as missing symbols at
          # ferric's link step — far from the cause. `dnf install` succeeding
          # is not proof the compiler is on PATH, since the toolset needs the
          # `enable` script sourced first.
          command -v gfortran >/dev/null 2>&1 || {
            echo "::error::gcc-toolset-12 has no gfortran on PATH after sourcing enable; OpenBLAS's LAPACK needs it"
            exit 1
          }
          gfortran --version | head -1

          # --- Eigen (header-only; libint2/libecpint's shim needs
          # /usr/include/eigen3, hardcoded in ferric-integrals/build.rs) ---
          cd /tmp
          wget -q https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
          tar xzf eigen-${EIGEN_VERSION}.tar.gz
          # TWO consumers with DIFFERENT requirements, hence two installs:
          #
          # 1. ferric's own build.rs hardcodes `/usr/include/eigen3` as an
          #    include path (crates/ferric-integrals/build.rs) — a plain header
          #    copy is all that needs. build-wheels' own "Prepare container
          #    for maturin build" step repeats JUST this copy (not the
          #    CMake install below) on every matrix leg's fresh container --
          #    this job's copy exists so build-native-deps' OWN container can
          #    build libint2 against it below, not for anything downstream.
          # 2. libint2's CMake calls find_package(Eigen3), which needs Eigen's
          #    generated CMake CONFIG files (Eigen3Config.cmake et al.), not
          #    headers. Copying headers alone left it failing with
          #    "C++ API cannot be built without Eigen3" (run 33636559804) even
          #    though every header was present — find_package does not look for
          #    headers, it looks for the config package.
          #
          # So: copy the headers for (1), and run Eigen's own trivial
          # (header-only) CMake install into $PREFIX for (2), then point
          # libint2 at it via CMAKE_PREFIX_PATH below.
          mkdir -p /usr/include/eigen3
          cp -r eigen-${EIGEN_VERSION}/Eigen /usr/include/eigen3/
          cp -r eigen-${EIGEN_VERSION}/unsupported /usr/include/eigen3/

          mkdir -p eigen-${EIGEN_VERSION}/build && cd eigen-${EIGEN_VERSION}/build
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTING=OFF
          make install
          cd /tmp

          NPROC=$(nproc)

          # --- OpenBLAS (dynamic; auditwheel/maturin vendors the .so) ---
          # DYNAMIC_ARCH=1 is OpenBLAS's OWN runtime-dispatch feature -- the
          # exact mechanism ci.yml's incident blames for the Zen 4 garbage
          # result. Turning it OFF and building a single fixed TARGET instead
          # trades "picks the best kernel per-CPU at runtime" for "always
          # runs the kernel we tested", which is the safer default for a
          # binary artifact going to unknown hardware. TARGET=HASWELL matches
          # the OPENBLAS_CORETYPE=Haswell runtime workaround above -- if that
          # env var is ever lifted, this TARGET must be reconsidered too, they
          # are the same tradeoff made twice.
          cd /tmp
          wget -q https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz
          tar xzf OpenBLAS-${OPENBLAS_VERSION}.tar.gz
          cd OpenBLAS-${OPENBLAS_VERSION}
          make -j"$NPROC" DYNAMIC_ARCH=0 TARGET=HASWELL USE_THREAD=1 USE_OPENMP=0 NO_STATIC=0 NO_SHARED=0
          make PREFIX="$PREFIX" install

          # --- libxc (dynamic; ferric-dft/build.rs: `cargo:rustc-link-lib=xc`) ---
          cd /tmp
          wget -q https://gitlab.com/libxc/libxc/-/archive/${LIBXC_VERSION}/libxc-${LIBXC_VERSION}.tar.gz
          tar xzf libxc-${LIBXC_VERSION}.tar.gz
          cd libxc-${LIBXC_VERSION}
          mkdir build && cd build
          # -DCMAKE_POLICY_VERSION_MINIMUM=3.5: libxc 6.2.2's CMakeLists.txt
          # declares a cmake_minimum_required below 3.5, and CMake 4.x REMOVED
          # compatibility with those — it hard-errors rather than warning
          # ("Compatibility with CMake < 3.5 has been removed from CMake",
          # run 33635089264). The manylinux_2_28 image ships a CMake new
          # enough to refuse. The flag is CMake's own documented escape hatch
          # for exactly this, and it only relaxes the policy floor; it does
          # not change any build setting of libxc itself. Pinning an older
          # CMake would work too, but that trades a one-line flag for a whole
          # extra toolchain to keep current.
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDISABLE_KXC=OFF
          make -j"$NPROC"
          make install

          # -DCMAKE_INSTALL_LIBDIR=lib on both libxc and libint2 (below): AlmaLinux
          # 8 is RPM/RHEL-family, where CMake's GNUInstallDirs module defaults
          # CMAKE_INSTALL_LIBDIR to "lib64" on a 64-bit target -- unlike
          # ci.yml's ubuntu-22.04 runner, where it defaults to "lib" and the
          # libint2 build there has therefore never exercised this. ferric's
          # build.rs (crates/ferric-integrals/build.rs) hardcodes
          # `{LIBINT2_PREFIX}/lib` as its native-link search path with no
          # lib64 fallback, so leaving CMake's RHEL default in place here
          # would silently build a libint2.a this workflow's own cargo build
          # can never find. Forcing "lib" makes this container match the
          # path ci.yml's build has always produced.
          #
          # --- libint2 (static; same mpqc4 tarball + version + PIC flag as
          # ci.yml -- see that file for why INCLUDE_ERI/INCLUDE_ONEBODY both
          # matter and why the mpqc4 build, not Ubuntu's libint2-dev, is used) ---
          cd /tmp
          wget -q https://github.com/evaleev/libint/releases/download/v${LIBINT_VERSION}/libint-${LIBINT_VERSION}-mpqc4.tgz
          tar xzf libint-${LIBINT_VERSION}-mpqc4.tgz
          cd libint-${LIBINT_VERSION}
          mkdir build && cd build
          # -DCMAKE_POLICY_VERSION_MINIMUM=3.5 for the same reason as libxc
          # above: the mpqc4 export is a 2021-era tarball whose
          # cmake_minimum_required predates 3.5, which CMake 4.x refuses
          # outright. Set pre-emptively rather than waiting for a third failed
          # run to prove it — libint2 is the OLDER of the two sources, so if
          # libxc tripped this, libint2 was going to as well.
          # CMAKE_PREFIX_PATH="$PREFIX" so libint2's find_package(Eigen3)
          # locates the Eigen CMake config package installed above. Without it
          # libint2 refuses to build its C++ API — "C++ API cannot be built
          # without Eigen3" — even with every Eigen header present under
          # /usr/include/eigen3, because find_package looks for the config
          # package, not for headers.
          cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j"$NPROC"
          make install

          touch "$PREFIX/.done"
          SCRIPT_EOF
          chmod +x native-deps-cache/build-native-deps.sh

      # Plain `docker run` against the SAME image maturin-action itself pulls
      # for `manylinux: 2_28` (quay.io/pypa/manylinux_2_28_x86_64:latest,
      # confirmed from a real run's log -- maturin-action does not publish
      # this mapping anywhere easier to point at, so this is read off actual
      # `docker pull` output, not guessed at from its README). Using the
      # identical image is the whole point: the ABI compatibility this
      # workflow's header comment explains (AlmaLinux 8 glibc/libstdc++,
      # required for auditwheel-repair) only holds if what builds OpenBLAS/
      # libxc/libint2 here is bit-for-bit the same environment build-wheels
      # later links them from -- a different image, even a nearby one, would
      # silently reopen exactly the ABI mismatch this file was written to
      # avoid, and no test in this workflow would catch it before a user's
      # `pip install` did. Bind-mounting the workspace at the SAME path the
      # runner sees it at (rather than some container-local path) matches
      # maturin-action's own mounting (confirmed in the same log), which
      # matters because build-native-deps.sh assumes $PREFIX ends up at a
      # path meaningful on the host afterward (it does not care about the
      # path's value, only that it is consistent -- but matching keeps this
      # job's invocation legible next to maturin-action's own docker run).
      - name: Build native deps (manylinux_2_28 container)
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash native-deps-cache/build-native-deps.sh \
              "${{ github.workspace }}/native-deps-cache" \
              "${{ env.EIGEN_VERSION }}" "${{ env.OPENBLAS_VERSION }}" \
              "${{ env.LIBXC_VERSION }}" "${{ env.LIBINT_VERSION }}"

      # Mirrors ci.yml's libint2 cache: save is a SEPARATE step that runs
      # ONLY on success() (not always()), and only when this run actually did
      # the build (cache-hit != 'true' -- saving on a hit would be a no-op at
      # best, since actions/cache refuses to overwrite an existing key, but
      # skipping the attempt entirely is cheaper and avoids a confusing "cache
      # already exists" warning on every warm run). A cancelled or failed
      # docker-run step must never save a truncated $PREFIX -- that would
      # poison every later restore with a tree missing .done or a library.
      - name: Save native deps cache
        if: success() && steps.cache-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/native-deps-cache
          key: native-deps-${{ env.NATIVE_DEPS_CACHE_VERSION }}-manylinux_2_28-openblas${{ env.OPENBLAS_VERSION }}-libxc${{ env.LIBXC_VERSION }}-libint${{ env.LIBINT_VERSION }}-eigen${{ env.EIGEN_VERSION }}

      - name: Keep native-deps-cache out of the wheel / git
        run: echo "native-deps-cache/" >> .git/info/exclude

      # Two DIFFERENT sharing mechanisms for two DIFFERENT audiences, both
      # safe here because build-native-deps is the ONLY writer to either --
      # there is nothing to race, unlike the pre-#16 4-way actions/cache mess
      # this job replaced:
      #   - actions/cache (above): persists the BUILD across separate
      #     workflow RUNS (a later tag push, a workflow_dispatch rerun days
      #     later), so a warm cache skips the ~85 min native build entirely.
      #   - actions/upload-artifact (here): shares this SAME run's result
      #     with the four build-wheels legs below, which cannot see a
      #     sibling job's actions/cache restore (that's job-local) and have
      #     no other way to reach files this job produced.
      # Runs unconditionally (no cache-hit gate) because build-wheels needs
      # the artifact whether this run built fresh or restored from cache --
      # the restore step above already guarantees native-deps-cache/ is
      # populated either way.
      #
      # !native-deps-cache/share/**: libint2's `make install` writes its own
      # bundled basis-set library under $PREFIX/share (Gaussian94-format
      # files, e.g. 6-311g**.g94) that nothing downstream reads -- ferric
      # bundles its OWN basis sets separately (crates/ferric-core/src/basis/
      # bundled/*.json via include_str!, confirmed against build.rs: neither
      # ferric-integrals' nor ferric-dft's build.rs references $PREFIX/share
      # anywhere) -- but actions/upload-artifact rejects the upload outright
      # if ANY file it would carry has a name actions considers unsafe for
      # NTFS portability, and several of libint2's basis-set filenames
      # contain a literal "*" (double-polarization notation, e.g. "**" for
      # 6-311g**) -- confirmed live: run failed with "The path for one of
      # the files in artifact is not valid: .../basis/6-311g**.g94 ...
      # Invalid characters include: ... Asterisk *". Only lib/, lib64/,
      # include/ and .done are ever read (see the exported LIBINT2_PREFIX/
      # PKG_CONFIG_PATH/LD_LIBRARY_PATH/LIBRARY_PATH/CPATH below, which name
      # exactly those four and nothing under share/), so excluding share/
      # entirely costs nothing downstream and removes the only source of
      # asterisk-bearing filenames in this tree.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-deps
          path: |
            native-deps-cache/
            !native-deps-cache/share/**
          if-no-files-found: error
          # Native deps are only useful for the SAME run's build-wheels
          # legs (they key off pinned versions from this run's env: block,
          # not off anything persisted across runs) -- short retention keeps
          # this from lingering as dead storage after the run completes.
          retention-days: 1

  build-wheels:
    needs: build-native-deps
    runs-on: ubuntu-22.04
    # One from-scratch native build is now build-native-deps' job, not this
    # one's -- each leg here only pays its own maturin build (compiling
    # ferric's Rust workspace + linking against the downloaded native deps),
    # which is the ~15-25 min ci.yml's own cargo build measures, not the
    # ~75-125 min the pre-fix version of this job spent per leg rebuilding
    # OpenBLAS/libxc/libint2/Eigen redundantly. Lower than the old 180 for
    # that reason; see build-native-deps' own timeout for where the native
    # build's headroom now lives.
    timeout-minutes: 60
    strategy:
      # false: a numerics or link failure on one CPython version is likely
      # present on all of them (same native deps, same shim), so let every
      # leg finish and report instead of burning runner time four times over
      # discovering the same root cause serially.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tag IS the version -- pyproject.toml's checked-in "0.1.0" is a
      # dev placeholder, never the version actually published. maturin has no
      # dynamic-version support for the pyo3 backend (no `dynamic = ["version"]`
      # equivalent; confirmed against `maturin build --help`, which offers no
      # env/flag to override it), so the only way to make the tag the source
      # of truth is to rewrite both files that hardcode the version BEFORE
      # `maturin build` runs -- pyproject.toml (what maturin actually reads
      # for the wheel filename/METADATA when `[project].version` is present)
      # and crates/ferric-python/Cargo.toml (kept in lockstep so the two
      # never drift, even though maturin itself doesn't consult the Cargo.toml
      # version when pyproject.toml has one).
      #
      # Only runs on a tag push -- a workflow_dispatch run or a scheduled
      # (nightly) run (neither has a tag) leaves both files at their
      # checked-in placeholder, since neither path ever reaches `publish`
      # anyway (see that job's `if:` guard, which cannot pass for either
      # event type).
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          # Require the tag to ALREADY be canonical PEP 440 -- no hyphens.
          # PEP 440 normalization is not a simple strip/replace: "-rc1" drops
          # the hyphen but "-post1"/"-dev1" gain a "." separator, and a bare
          # "-1" means ".post1" (verified against `packaging.version.Version`
          # by hand; not reimplementing that table in bash). Rather than risk
          # this step and the publish job's wheel-filename check disagreeing
          # on a normalized form neither reproduces exactly, tags MUST arrive
          # pre-normalized: v1.2.3, v1.2.3rc1, v1.2.3.post1, v1.2.3.dev1,
          # v1.2.3+local -- never v1.2.3-rc1. Every string this accepts is
          # its own PEP 440 normalization (round-trips byte-identical through
          # `Version()`), so the raw tag can be compared textually downstream
          # with no normalization step anywhere.
          if ! [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?(\+[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::tag 'v${tag_version}' is not canonical PEP 440 (no hyphens -- use v1.2.3rc1, not v1.2.3-rc1) -- refusing to stamp"
            exit 1
          fi
          echo "stamping version ${tag_version} from tag ${GITHUB_REF}"
          sed -i "0,/^version = /s/^version = .*/version = \"${tag_version}\"/" pyproject.toml

          # Cargo.toml needs SemVer, not PEP 440 -- they are DIFFERENT grammars
          # for the pre-release segment, and the same literal string is not
          # valid in both. PEP 440 writes "0.1.0rc2" / "0.1.0.post1" with no
          # separator or a bare ".". SemVer 2.0.0 requires a "-" before any
          # pre-release identifier ("0.1.0-rc2" / "0.1.0-post1") -- with no
          # hyphen, rustc/cargo's toml parser hard-errors:
          #   error: unexpected character 'r' after patch version number
          #    --> crates/ferric-python/Cargo.toml:3:11
          #      | version = "0.1.0rc2"
          # (confirmed live, run 33836001142 -- the v0.1.0rc2 tag's
          # build-wheels legs all died here). Verified this conversion is
          # both a real SemVer string (checked against the same regex shape
          # used to validate PEP 440 acceptance above) AND accepted by a real
          # `cargo check` for every shape this step's own PEP-440 regex
          # allows: 0.1.0, 0.1.0-rc2, 0.1.0-a1, 0.1.0-b2, 0.1.0-post1,
          # 0.1.0-dev1, 0.1.0+local, 0.1.0-rc1.post2.
          #
          # BASH_REMATCH from the SAME match above (not a second regex) gives
          # the exact pieces: [1]=X.Y.Z, [2]=(a|b|rc)N pre-release, [4]=.postN,
          # [5]=.devN, [6]=+local. Join whichever of pre/post/dev are present
          # with "." after ONE leading "-"; append +local (SemVer's build
          # metadata separator, unchanged from PEP 440's) last, outside the
          # hyphen segment.
          base="${BASH_REMATCH[1]}"
          pre="${BASH_REMATCH[2]}"
          post="${BASH_REMATCH[4]#.}"
          dev="${BASH_REMATCH[5]#.}"
          plus="${BASH_REMATCH[6]}"
          semver_extra=""
          for part in "$pre" "$post" "$dev"; do
            [[ -n "$part" ]] && semver_extra="${semver_extra:+$semver_extra.}$part"
          done
          semver_version="$base"
          [[ -n "$semver_extra" ]] && semver_version="$semver_version-$semver_extra"
          semver_version="$semver_version$plus"

          sed -i "0,/^version = /s/^version = .*/version = \"${semver_version}\"/" crates/ferric-python/Cargo.toml
          grep -m1 "^version" pyproject.toml
          grep -m1 "^version" crates/ferric-python/Cargo.toml

      # Same rationale as ci.yml's "Free runner disk space" step: the
      # manylinux_2_28 image maturin-action pulls is itself several GB, on
      # top of which this job produces a maturin/auditwheel output tree.
      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      # The built OpenBLAS/libxc/libint2/Eigen tree from build-native-deps --
      # built ONCE for all four legs, see that job for why (was a 4-way
      # actions/cache race before this). download-artifact, not cache: this
      # is the ONLY place that reads it, so there is no restore-vs-save
      # ordering to reason about, and a missing artifact is a hard failure
      # here rather than a silent "start the ~75 min build over" cache miss.
      - name: Download native deps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-deps
          path: native-deps-cache

      - name: Keep native-deps-cache out of the wheel / git
        run: echo "native-deps-cache/" >> .git/info/exclude

      # Runs INSIDE the manylinux_2_28 (AlmaLinux 8) container, before
      # `maturin build`. This is now everything a FRESH container needs that
      # build-native-deps' one-time build could not already bake into the
      # downloaded artifact -- every matrix leg here starts its own new
      # container, and the artifact download above only puts files under
      # native-deps-cache/; it does not touch this container's own
      # filesystem.
      #
      # Eigen headers specifically: crates/ferric-integrals/build.rs hardcodes
      # `/usr/include/eigen3` as a `cc` include path (a real filesystem path
      # the crate's own build script looks for, independent of wherever the
      # downloaded artifact happens to land), so it has to be copied into
      # THIS container on every leg -- copying a few header files is cheap
      # enough that doing it four times costs nothing next to what moved
      # into build-native-deps.
      #
      # No gcc-toolset-12/gfortran install here anymore: that was ONLY for
      # building OpenBLAS's reference LAPACK from source, which now happens
      # once in build-native-deps. ferric's own build (the C++ shim compiled
      # via the `cc` crate) needs a C++ compiler, which the manylinux_2_28
      # image's base toolchain already provides -- it was never gfortran's
      # job to satisfy that.
      - name: Prepare container for maturin build
        run: |
          mkdir -p native-deps-cache
          cat > native-deps-cache/prepare-container.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          EIGEN_VERSION="$1"
          cd /tmp
          # curl, NOT wget: confirmed live -- a real run failed here with
          # "wget: command not found". build-native-deps.sh's OWN wget calls
          # work because that job's dnf install line explicitly includes
          # wget; this script has no such install (see the comment above --
          # gcc-toolset-12/gfortran/cmake/wget/etc. were all dropped from
          # THIS container on purpose, since the native builds that needed
          # them now happen once upstream). Checked what quay.io/pypa/
          # manylinux_2_28_x86_64:latest actually ships rather than guessing
          # a second time: curl.x86_64 is present by default (@baseos),
          # wget is not. Using curl here means every leg's container needs
          # zero extra packages for this step, not a dnf install added back
          # just to get wget.
          curl -sSLo eigen-${EIGEN_VERSION}.tar.gz https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
          tar xzf eigen-${EIGEN_VERSION}.tar.gz
          mkdir -p /usr/include/eigen3
          cp -r eigen-${EIGEN_VERSION}/Eigen /usr/include/eigen3/
          cp -r eigen-${EIGEN_VERSION}/unsupported /usr/include/eigen3/
          SCRIPT_EOF
          chmod +x native-deps-cache/prepare-container.sh

      - name: Build wheel (manylinux_2_28 container)
        # Pinned off v1 -- a moving major-version tag upstream repoints at
        # every release -- to the commit v1.51.0 peels to (v1.51.0 itself is
        # an ANNOTATED tag, so the SHA that matters is refs/tags/v1.51.0^{},
        # not the tag-object SHA `git ls-remote` returns for it). This is a
        # real behaviour freeze, not just a supply-chain pin: the release
        # path no longer picks up maturin-action updates automatically, and
        # someone must bump this SHA on purpose. That is the intended
        # trade-off for a job that publishes to PyPI.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: x86_64
          manylinux: 2_28
          # `--release` for a real optimized wheel; `--out dist` collects
          # every matrix leg's wheel into the same relative path for the
          # upload step below. `-i` pins the exact interpreter this leg
          # targets -- manylinux_2_28's image ships several CPythons under
          # /opt/python, and without `-i` maturin builds abi3/whatever it
          # finds first rather than the version this matrix leg is for.
          args: --release --out dist -i python${{ matrix.python-version }}
          # Runs BEFORE the build, INSIDE THE SAME SHELL SCRIPT that then
          # invokes `maturin build` (maturin-action concatenates
          # before-script-linux and the build command into one generated
          # bash script run in a single `docker run`, per its source --
          # there is no separate `docker exec`), so plain `export` here is
          # visible to the build step. Deliberately NOT using
          # `>> "$GITHUB_ENV"`: that file lives on the HOST runner and is
          # not proven to be mounted into this container, and maturin-action
          # only forwards host env vars whose names match a fixed allowlist
          # of prefixes (CARGO_/CC/CMAKE_/LD_/RUST.../etc -- see its
          # ALLOWED_ENV_PREFIXES) into `docker run -e`, which does not cover
          # PKG_CONFIG_PATH, CPATH, or LIBINT2_PREFIX. Exporting inline is
          # the only path proven to reach the build.
          #
          # This is where the FRESH container gets Eigen headers (see
          # "Prepare container for maturin build" above for why that's still
          # done per-container) and the env vars pointing at the DOWNLOADED
          # native-deps artifact -- no build happens here anymore, only
          # placement + linking of what build-native-deps already produced.
          before-script-linux: |
            set -euo pipefail
            NATIVE_PREFIX="$(pwd)/native-deps-cache"
            bash "$NATIVE_PREFIX/prepare-container.sh" "${{ env.EIGEN_VERSION }}"
            export LIBINT2_PREFIX="$NATIVE_PREFIX"
            export PKG_CONFIG_PATH="$NATIVE_PREFIX/lib/pkgconfig:$NATIVE_PREFIX/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64${LIBRARY_PATH:+:$LIBRARY_PATH}"
            export CPATH="$NATIVE_PREFIX/include${CPATH:+:$CPATH}"

      - name: Wheel size / contents sanity check
        run: |
          set -euo pipefail
          ls -lh dist/
          for whl in dist/*.whl; do
            echo "--- $whl ---"
            python3 -m zipfile -l "$whl" | grep -iE '\.so$|openblas|libxc' || true
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-cp${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Installs each BUILT WHEEL (never the source tree -- a wheel that builds
  # but does not import/run is worse than no wheel, since it fails silently
  # at `pip install` time for a real user rather than loudly here) into a
  # throwaway venv and runs a real RHF calculation against it. This is the
  # only step in this workflow that proves the auditwheel/patchelf-repaired
  # .so actually loads and produces a correct number outside the build
  # container -- everything above only proves it COMPILED.
  smoke-test:
    needs: build-wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels-cp${{ matrix.python-version }}
          path: dist

      - name: Install wheel into a fresh venv
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          # Install ONLY the wheel and let pip resolve its declared runtime
          # dependencies (numpy and gemmi per pyproject.toml) -- deliberately
          # not the repo's source tree or any of its extras (pyscf, vina,
          # meeko, ...), since the point is to prove the WHEEL is
          # self-contained, not to reproduce the dev environment.
          #
          # --only-binary=:all: is what keeps that claim honest. A dependency
          # with no wheel for this interpreter would otherwise fall back to an
          # sdist and start compiling, which is how the cp313 smoke test
          # failed before `vina` was moved to the `docking` extra: PyPI's vina
          # ships cp38-cp312 wheels only, so 3.13 tried to build it from
          # source and died on missing Boost headers -- a failure that had
          # nothing to do with the wheel under test. Fail fast and loudly
          # instead of silently invoking a compiler in a test job.
          pip install --only-binary=:all: dist/*.whl
          pip show ferric

      - name: Smoke test -- import + RHF energy on the built wheel
        run: |
          set -euo pipefail
          source /tmp/smoke-venv/bin/activate
          cd /tmp  # deliberately NOT the repo checkout -- there isn't one in
                   # this job, which is the point: nothing here can fall back
                   # to a source-tree `ferric` on sys.path.
          python3 - << 'PYEOF'
          import ferric

          # H2 at the standard 0.74 Angstrom bond length, STO-3G. This is not
          # a ferric-specific reference value pulled from one of the repo's
          # PySCF-comparison test fixtures (none was pulled in here, since
          # this job has no source checkout) -- it is the textbook RHF/STO-3G
          # H2 result, well outside any plausible last-few-digit convention
          # difference. The bound below is intentionally loose (asserts the
          # right BASIN, not the last decimal) so it catches the failure
          # modes this smoke test exists for -- wrong/missing OpenBLAS
          # producing garbage eigenvalues (the exact Zen 4 incident ci.yml
          # documents), a mis-linked libint2 giving wrong integrals, wrong
          # electron count, or an import that silently no-ops -- without
          # requiring bit-identical agreement with ferric's own internal
          # convergence convention, which this job has no reference for.
          mol = ferric.Molecule.from_xyz_string(
              "2\nH2\nH 0 0 0\nH 0 0 0.74\n", charge=0, multiplicity=1
          )
          basis = ferric.BasisSet.bundled("sto-3g")
          result = ferric.run_rhf(mol, basis)

          print(f"RHF/STO-3G H2 energy: {result.energy:.10f} Ha "
                f"(converged={result.converged}, iters={result.iterations})")

          assert result.converged, "SCF did not converge -- wheel's numerics are suspect"
          # Textbook value is about -1.1167 Ha; -1.30 .. -1.05 is a wide berth
          # around it that a working RHF/STO-3G H2 calculation cannot miss,
          # while a nuclear-repulsion-only, garbage-BLAS, or wrong-integral
          # failure mode would.
          assert -1.30 < result.energy < -1.05, (
              f"RHF energy {result.energy} is outside the expected basin for "
              "H2/STO-3G at r=0.74 A -- suspect broken BLAS/libint2 linkage "
              "in this wheel, not a legitimate different answer"
          )

          # Also exercise the numpy-array return path (PyArray2/PyArray1 via
          # rust-numpy) -- a separate FFI surface from the scalar `.energy`
          # float above, and the one most likely to break from an ABI/version
          # mismatch between the wheel's compiled numpy C-API expectations
          # and the numpy actually installed in this venv.
          import numpy as np
          density = result.density()
          orbital_energies = result.orbital_energies()
          assert density.shape == (2, 2), f"unexpected AO density shape {density.shape}"
          assert orbital_energies.shape == (2,), f"unexpected orbital energy count {orbital_energies.shape}"
          assert np.isfinite(density).all() and np.isfinite(orbital_energies).all()

          print("Smoke test PASSED.")
          PYEOF

      # Exercises the `ferric` CONSOLE SCRIPT (pyproject.toml
      # [project.scripts]) -- the pip-installed `ferric` command, not the
      # `import ferric; ferric.run_rhf(...)` Python API the step above
      # already covers. These are genuinely different code paths: the
      # console script runs `ferric_cli::run(sys.argv)` from inside a
      # pip-generated wrapper script, and a real bug there (argv shape
      # mismatch between a native binary's `std::env::args()` and what a
      # Python-embedded extension actually sees -- caught and fixed while
      # wiring this up, not hypothetical) would NOT be caught by the Python
      # API smoke test above, since that never touches sys.argv or the
      # wrapper script at all.
      #
      # Checks the two things a silent regression here would break
      # separately: `ferric --help` must exit 0 (not fall through to the
      # `args.len() < 2` no-args path, which prints the same text but exits
      # 2 -- the exact bug this test would have caught), and a real
      # calculation from a TOML file must actually run and converge, not
      # just parse its arguments correctly.
      - name: Smoke test -- ferric console script (pip-installed CLI)
        run: |
          set -euo pipefail
          source /tmp/smoke-venv/bin/activate
          command -v ferric
          ferric --help
          test $? -eq 0 || { echo "::error::ferric --help exited nonzero"; exit 1; }

          cd /tmp
          cat > smoke-cli.toml << 'TOMLEOF'
          [molecule]
          xyz = "smoke-cli.xyz"

          [basis]
          name = "sto-3g"

          [method]
          kind = "rhf"
          TOMLEOF
          printf '2\nH2\nH 0 0 0\nH 0 0 0.74\n' > smoke-cli.xyz

          OPENBLAS_NUM_THREADS=1 ferric smoke-cli.toml | tee smoke-cli.out
          grep -q "converged  = true" smoke-cli.out || {
            echo "::error::ferric console script ran but did not report converged=true"
            exit 1
          }
          echo "Console-script smoke test PASSED."

  # Publishes to PyPI via trusted publishing (OIDC) -- no long-lived token in
  # this repo. All three prerequisites this job used to wait on are now met:
  #   1. Wheels from a real run (33697177255, built from c87e7456) were
  #      downloaded and exercised by hand beyond this workflow's own smoke
  #      test -- installed into fresh venvs for all four Python versions and
  #      used to run a real RI-MP2/aug-cc-pVDZ water calculation, cross-
  #      checked against an independent PySCF reference to 6e-9 Ha.
  #   2. Trusted publishing is configured on PyPI for this project (a
  #      "pending publisher" registered with owner=mgoldey, repo=ferric,
  #      workflow=wheels.yml, environment=pypi -- see pypi.org/manage/account
  #      /publishing/). Nothing to store as a GitHub secret; the `id-token:
  #      write` permission below is what lets this job mint the short-lived
  #      OIDC token PyPI's Trusted Publishers API exchanges for upload
  #      credentials, scoped to this one job run only.
  #   3. Wheel size confirmed well under PyPI's 100 MB default per-file cap:
  #      all four (cp310-cp313) measured ~65.5 MiB, not the 100-200 MB this
  #      job's placeholder comment once guessed.
  #
  # =====================================================================
  # OpenMPI-linked wheel variant. SEPARATE PACKAGE, NEVER PUBLISHED HERE.
  # =====================================================================
  #
  # READ THIS BEFORE USING OR EXTENDING THIS JOB.
  #
  # 1. WHAT THE MPI WHEEL ACTUALLY BUYS, AND WHAT IT DOES NOT.
  #    `crates/ferric-python/src/lib.rs` exposes NO MPI entry point: there is
  #    no run_mpi_ri_mp2 binding, no rank/size accessor, no communicator. The
  #    genuinely MPI-parallel kernels (ferric_mp2::mpi_rimp2,
  #    ferric_rpa::mpi_rpa, ferric_gw::mpi_gw) are UNREACHABLE from Python.
  #    What the `mpi` feature does change is real but INDIRECT: every binding
  #    builds `ParallelContext::default()`, which under the feature calls
  #    mpi::initialize() and reads the true MPI_COMM_WORLD, and `run_rhf`
  #    passes it into solve_rhf -> fock_assembly::build_df_jk ->
  #    DfJ/DfK::new_banded(Some(ctx)). So `mpirun -np N python script.py` DOES
  #    stripe the DF-J/DF-K aux band across ranks with a real Allreduce.
  #    But it is SPMD: every rank runs the whole script, prints the same
  #    output, and races on the same output files, and Python cannot tell the
  #    ranks apart because no rank/size is exposed. Treat this wheel as an
  #    SCF-memory-scaling build for people who already know that, not as a
  #    parallel Python API. See crates/ferric-python/Cargo.toml's `mpi`
  #    feature comment for the same caveats next to the code.
  #
  # 2. OPENMPI ABI LOCK-IN. THIS IS NOT FIXABLE HERE, ONLY DISCLOSED.
  #    OpenMPI and MPICH/Intel MPI/Cray MPI are NOT ABI-compatible. This wheel
  #    links OpenMPI 4.x (AlmaLinux 8's openmpi-devel, soname libmpi.so.40).
  #    It will NOT run against an MPICH-family MPI. That is an accepted,
  #    deliberate trade -- hence the distinct package NAME below, so the
  #    constraint is visible at `pip install` time rather than as an
  #    unexplained symbol error at import.
  #
  # 3. THE WHEEL REQUIRES A SYSTEM OpenMPI 4.x. IT DELIBERATELY BUNDLES NONE.
  #    libmpi is NOT on auditwheel's manylinux_2_28 whitelist (verified
  #    directly in quay.io/pypa/manylinux_2_28_x86_64: the policy's
  #    lib_whitelist is libc/libm/libstdc++/libgcc_s/libX11/... and contains
  #    no MPI entry). A DEFAULT auditwheel repair therefore COPIES
  #    libmpi.so.40 and its runtime stack -- libopen-rte, libopen-pal,
  #    libhwloc, libevent -- into the wheel and rewrites the RPATH.
  #
  #    THAT VENDORED BUILD IS A DEAD END, and this job no longer produces
  #    one. Every project that ships working MPI wheels links the SYSTEM MPI
  #    instead: mpi4py, the reference binding, has used
  #    `auditwheel --exclude libmpi...` since 4.1.0 (2025-06-25);
  #    NWChemEx/ParallelZone moved to `--exclude` + system MPI only AFTER
  #    trying to vendor and failing; petsc4py/slepc4py ship sdists only;
  #    h5py/PyTorch/horovod/Firedrake put no MPI in the wheel at all; and the
  #    per-flavour `mpi4py-mpich` variant was abandoned. Three concrete
  #    failure modes of vendoring, all of which THIS job would have hit:
  #      (i)   MCA PLUGINS. auditwheel bundles only DT_NEEDED dependencies it
  #            finds via the loader -- NEVER the dlopen'd MCA component .so
  #            files. AlmaLinux 8's openmpi (exactly what this job links)
  #            uses dlopen'd components, so the vendored copy fails at
  #            startup with `opal_shmem_base_select failed`.
  #      (ii)  orted. auditwheel and delocate bundle shared libraries only,
  #            never the accompanying bin/ executables, and OpenMPI's
  #            launcher needs `orted`. This fails even at -np 1.
  #      (iii) TWO libmpi IMAGES -- the dangerous one, because it is
  #            SILENT-WRONG rather than a clean error. With a vendored libmpi
  #            loaded alongside the launcher's own, MPI_Init returns
  #            MPI_SUCCESS while `ompi_mpi_comm_world` stays zero-filled, and
  #            the process segfaults later, far from the cause.
  #
  #    So: `maturin build --auditwheel skip`, then an explicit
  #    `auditwheel repair --exclude <exact sonames>`, leaving the whole
  #    OpenMPI stack external. The resulting wheel NEEDS a system OpenMPI 4.x
  #    (soname libmpi.so.40) at run time and says so in its metadata; without
  #    one the user gets a clean, greppable loader error:
  #      ImportError: libmpi.so.40: cannot open shared object file:
  #      No such file or directory
  #    (that exact string was reproduced against a real repaired wheel, not
  #    guessed). This is the CORRECT behaviour -- it lets a cluster's own
  #    hardware-optimized OpenMPI and its own mpirun/PMIx drive the library.
  #
  #    The job still does not publish (see 4 below): the end-to-end
  #    multi-node story is unproven here, and PyPI uploads cannot be undone.
  #
  # 4. HOW THE PLAIN WHEEL STAYS UNAFFECTED. This job shares build-native-deps
  #    but is otherwise disjoint from build-wheels: different package name,
  #    different artifact name prefix (mpi-wheels-*, NOT wheels-*), no
  #    `needs:` edge from smoke-test or publish. It cannot change what
  #    `pip install ferric` resolves to. The artifact-name choice is
  #    load-bearing, not cosmetic -- see the publish job's
  #    `pattern: wheels-*` + `merge-multiple: true` download, which would
  #    otherwise SWEEP AN MPI WHEEL INTO A PYPI UPLOAD of the `ferric`
  #    package and also break its `wheel count == 4` assertion.
  mpi-wheel:
    needs: build-native-deps
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ONE interpreter, not the four build-wheels covers. This artifact is
        # not published, so a full matrix would quadruple runner time for a
        # build nobody installs from an index. 3.11 matches the version the
        # repo develops against (see CLAUDE.md's pytest invocation).
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk space
        run: |
          echo "--- before"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after"; df -h / | tail -1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-deps
          path: native-deps-cache

      - name: Restore native deps permissions
        run: chmod -R u+rwX native-deps-cache || true

      # RENAME THE PACKAGE, do not just tag the version. A local version label
      # (ferric-0.1.0+mpi) would still be the SAME distribution name `ferric`,
      # so it could satisfy a `ferric` requirement and shadow the portable
      # build in a resolver or a lockfile. A distinct name cannot: nothing
      # that asks for `ferric` ever resolves to `ferric-mpi`, and anyone
      # installing it has typed the MPI name on purpose. The name also
      # carries the ABI constraint into `pip list` output, which a build tag
      # would not.
      #
      # `module-name` keeps the IMPORT name `ferric`, so an existing script
      # runs unchanged under the MPI build -- only the DISTRIBUTION name
      # differs. That is deliberate: the two wheels are alternatives, and
      # installing both into one environment is a mistake (both own
      # `ferric/`). The Summary line below is what a user sees in
      # `pip show`, so the OpenMPI constraint is stated there too.
      - name: Rewrite package identity to ferric-mpi
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s2, n = re.subn(r'(?m)^name = "ferric"$', 'name = "ferric-mpi"', s, count=1)
          if n != 1:
              raise SystemExit(
                  "::error::expected exactly one `name = \"ferric\"` line in "
                  f"pyproject.toml, substituted {n}. Refusing to build an "
                  "MPI wheel that might still claim the `ferric` name."
              )
          # maturin needs module-name once the distribution name stops
          # matching the extension module's name, or the wheel installs a
          # top-level `ferric_mpi` nobody imports.
          if "[tool.maturin]" not in s2:
              raise SystemExit("::error::no [tool.maturin] section to pin module-name in")
          s2 = s2.replace(
              "[tool.maturin]",
              "[tool.maturin]\nmodule-name = \"ferric\"",
              1,
          )
          # Build the MPI feature ON TOP of the extension-module feature the
          # default build already uses -- replacing that list would drop
          # pyo3/extension-module and produce a wheel that cannot import.
          s2, n = re.subn(
              r'(?m)^features = \["pyo3/extension-module"\]$',
              'features = ["pyo3/extension-module", "ferric-python/mpi"]',
              s2,
              count=1,
          )
          if n != 1:
              raise SystemExit(
                  "::error::could not extend [tool.maturin] features with "
                  f"ferric-python/mpi (substituted {n}); the MPI feature would "
                  "be silently absent from a wheel named ferric-mpi."
              )
          p.write_text(s2)
          PYEOF
          grep -E '^name|module-name|^features' pyproject.toml

      - name: Prepare container script (Eigen + OpenMPI)
        run: |
          set -euo pipefail
          cat > native-deps-cache/prepare-container-mpi.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          EIGEN_VERSION="$1"
          cd /tmp
          # curl not wget -- the manylinux_2_28 image ships curl, not wget
          # (same finding as build-wheels' prepare-container.sh).
          curl -sSLo eigen-${EIGEN_VERSION}.tar.gz https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
          tar xzf eigen-${EIGEN_VERSION}.tar.gz
          mkdir -p /usr/include/eigen3
          cp -r eigen-${EIGEN_VERSION}/Eigen /usr/include/eigen3/
          cp -r eigen-${EIGEN_VERSION}/unsupported /usr/include/eigen3/

          # OpenMPI + clang, the two things the MPI wheel needs that the plain
          # one does not. Verified live against
          # quay.io/pypa/manylinux_2_28_x86_64:latest (AlmaLinux 8.10):
          # `dnf install -y openmpi-devel` resolves and installs OpenMPI 4.1.1,
          # landing mpicc under /usr/lib64/openmpi/bin and mpi.h under
          # /usr/include/openmpi-x86_64 -- NOT on the default PATH or include
          # path, which is why the env exports below are required rather than
          # optional.
          #
          # clang/llvm-devel: rsmpi 0.7's build script runs bindgen over
          # mpi.h, and bindgen needs libclang at build time. Without it the
          # build fails inside the `mpi` crate before any ferric code
          # compiles.
          dnf install -y openmpi-devel clang llvm-devel
          test -x /usr/lib64/openmpi/bin/mpicc || {
            echo "::error::openmpi-devel installed but /usr/lib64/openmpi/bin/mpicc is missing"
            exit 1
          }
          /usr/lib64/openmpi/bin/mpirun --version | head -1
          SCRIPT_EOF
          chmod +x native-deps-cache/prepare-container-mpi.sh

      - name: Build MPI wheel (manylinux_2_28 container)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: x86_64
          manylinux: 2_28
          # `--auditwheel skip` is LOAD-BEARING, not a shortcut. maturin does
          # NOT shell out to the auditwheel CLI -- it carries its own
          # reimplementation, and `maturin build --help` exposes only
          # `--auditwheel <repair|check|skip>` with NO `--exclude`
          # passthrough (verified against maturin 1.15.0 in
          # quay.io/pypa/manylinux_2_28_x86_64). There is therefore no way to
          # ask maturin for a repair that leaves libmpi external. So this
          # step produces an UNREPAIRED linux_x86_64 wheel and the next step
          # runs the real `auditwheel repair --exclude` over it. Do not
          # "restore" the default repair here: it would silently vendor
          # libmpi again and re-create every failure mode documented in this
          # job's header.
          args: --release --out dist-mpi-raw -i python${{ matrix.python-version }} --auditwheel skip
          # Same inline-export rule build-wheels documents: maturin-action
          # concatenates this with the build command into ONE shell script, so
          # `export` reaches the build, while $GITHUB_ENV would not (it lives
          # on the host, and only an allowlist of env prefixes is forwarded).
          before-script-linux: |
            set -euo pipefail
            NATIVE_PREFIX="$(pwd)/native-deps-cache"
            bash "$NATIVE_PREFIX/prepare-container-mpi.sh" "${{ env.EIGEN_VERSION }}"
            export LIBINT2_PREFIX="$NATIVE_PREFIX"
            export PKG_CONFIG_PATH="$NATIVE_PREFIX/lib/pkgconfig:$NATIVE_PREFIX/lib64/pkgconfig:/usr/lib64/openmpi/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64:/usr/lib64/openmpi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export LIBRARY_PATH="$NATIVE_PREFIX/lib:$NATIVE_PREFIX/lib64:/usr/lib64/openmpi/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
            export CPATH="$NATIVE_PREFIX/include${CPATH:+:$CPATH}"
            # OpenMPI on RHEL8 is NOT on the default PATH/include path (see
            # the prepare script). rsmpi finds the implementation through
            # mpicc, so PATH must reach it and MPICC must name it explicitly.
            export PATH="/usr/lib64/openmpi/bin:$PATH"
            export MPICC=/usr/lib64/openmpi/bin/mpicc
            # bindgen (rsmpi's build script) needs both libclang itself and
            # the MPI headers, which live in a versioned, arch-suffixed dir.
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib64 -name 'libclang.so*' | head -1)")"
            export BINDGEN_EXTRA_CLANG_ARGS="-I/usr/include/openmpi-x86_64"

      # Repair the wheel OURSELVES, with the MPI stack held EXTERNAL.
      #
      # This runs in the same manylinux_2_28 image the build used, because the
      # repair has to see the same libmpi/libopen-*/libhwloc/libevent the
      # extension linked against -- auditwheel resolves DT_NEEDED through the
      # loader, so the AlmaLinux 8 OpenMPI must be installed and on
      # LD_LIBRARY_PATH for it to be *recognised* and therefore excludable.
      #
      # WHY EXACT SONAMES, AND WHY WE DO NOT TRUST THE FLAG.
      # auditwheel 6.1.0 had a bug where `--exclude 'libmpi*'` was matched by
      # set membership rather than as a glob, so the flag parsed, the build
      # went green, and the library was bundled anyway. That failure is
      # invisible unless you inspect the artifact. Two defences: (1) exact
      # sonames, as mpi4py's own cibw/repair-wheel.sh uses
      # (`--exclude libmpi.so.40` etc.), which are correct under BOTH the
      # buggy set-membership path and the fixed glob path; (2) the next step
      # asserts on the RESULTING WHEEL, never on this command succeeding.
      #
      # WHY THE SATELLITES ARE EXCLUDED TOO -- this is the subtle one.
      # libopen-rte / libopen-pal / libhwloc / libevent are OpenMPI's OWN
      # internals, not neutral third-party libraries. Excluding libmpi while
      # vendoring them is the WORST of the three options, because the process
      # would then hold TWO OpenMPI runtimes: the system libmpi.so.40 resolved
      # via DT_NEEDED, and a private libopen-pal/libopen-rte pair loaded from
      # the wheel's RPATH. That is exactly NWChemEx's documented "two libmpi
      # images" failure -- MPI_Init returns MPI_SUCCESS while the other image's
      # globals (ompi_mpi_comm_world) stay zero-filled, and the crash lands far
      # from the cause. An MPI runtime must be ONE coherent set of libraries
      # from ONE install, so every member of the stack goes external together.
      # libevent/libhwloc are excluded for the same reason: OpenMPI's own
      # libopen-pal is built against the system copies, and PMIx/ORTE share
      # state through them with `orted`.
      - name: Repair with the MPI stack held external (auditwheel --exclude)
        run: |
          set -euo pipefail
          mkdir -p dist-mpi
          docker run --rm \
            -v "$PWD:/io" -w /io \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:${{ env.MANYLINUX_DIGEST }} \
            bash -euo pipefail -c '
              dnf install -y openmpi >/dev/null
              export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:${LD_LIBRARY_PATH:-}
              # Sonames READ OFF THE CONTAINER, not guessed. Verified by
              # `readelf -d /usr/lib64/openmpi/lib/libmpi.so.40` after
              # `dnf install -y openmpi` in this exact image (AlmaLinux 8.10,
              # OpenMPI 4.1.1):
              #   libopen-rte.so.40, libopen-pal.so.40,
              #   libopen-orted-mpir.so (UNVERSIONED -- note the missing
              #   .so.N; writing libopen-orted-mpir.so.40 by analogy would
              #   match nothing and silently vendor it),
              #   libhwloc.so.15, libevent_core-2.1.so.6,
              #   libevent_pthreads-2.1.so.6.
              # libevent is .so.6 on AlmaLinux 8, NOT the .so.7 that newer
              # distros carry. A soname guessed from a different distro is
              # precisely how an --exclude turns into a silent no-op, which
              # is why the verification step below inspects the artifact.
              auditwheel repair \
                --plat manylinux_2_28_x86_64 \
                --exclude libmpi.so.40 \
                --exclude libopen-rte.so.40 \
                --exclude libopen-pal.so.40 \
                --exclude libopen-orted-mpir.so \
                --exclude libhwloc.so.15 \
                --exclude libevent_core-2.1.so.6 \
                --exclude libevent_pthreads-2.1.so.6 \
                -w /io/dist-mpi /io/dist-mpi-raw/*.whl
            '
          ls -lh dist-mpi/

      # INVERTED verification. Under the vendoring strategy the assertion was
      # "libmpi IS in the wheel"; under system-MPI linkage the two things that
      # must hold are the exact opposite plus a liveness check:
      #
      #   (a) NO libmpi/libopen-*/libhwloc/libevent is bundled -- proving the
      #       --exclude actually took effect rather than merely parsing;
      #   (b) the extension's DT_NEEDED STILL names libmpi.so.40 -- proving the
      #       wheel is genuinely MPI-linked and will resolve against the
      #       system MPI at load time.
      #
      # (b) is not redundant with (a). Dropping the `mpi` feature would ALSO
      # produce a wheel with no bundled libmpi -- a serial build wearing an MPI
      # name, which is the failure the previous (vendoring-era) version of this
      # step was written to catch. (a) alone would pass for it; (a)+(b)
      # together cannot. Both are checked against the artifact with readelf and
      # unzip, not inferred from the repair command's exit status.
      - name: Verify MPI is EXTERNAL but still linked
        run: |
          set -euo pipefail
          WHL=$(ls dist-mpi/*.whl | head -1)
          echo "--- $WHL ---"
          case "$(basename "$WHL")" in
            ferric_mpi-*) echo "OK: distribution name is ferric_mpi" ;;
            *) echo "::error::wheel is not named ferric_mpi: $WHL"; exit 1 ;;
          esac

          rm -rf /tmp/whlx && mkdir -p /tmp/whlx
          python3 -m zipfile -e "$WHL" /tmp/whlx
          echo "--- shared objects in the wheel ---"
          find /tmp/whlx -name '*.so*' | sort

          # (a) The MPI stack must NOT be bundled. A hit here means --exclude
          # silently did nothing (the auditwheel 6.1.0 wildcard bug, or a
          # soname that changed with the distro's OpenMPI version).
          if find /tmp/whlx \( -name 'libmpi*' -o -name 'libopen-rte*' \
               -o -name 'libopen-pal*' -o -name 'libhwloc*' \
               -o -name 'libevent*' \) | grep -q .; then
            echo "::error::an OpenMPI library was VENDORED into the wheel despite --exclude. auditwheel did not honour the exclusion (check the sonames against the container's actual OpenMPI), and this wheel would carry the two-libmpi-images failure."
            find /tmp/whlx \( -name 'libmpi*' -o -name 'libopen-*' \
              -o -name 'libhwloc*' -o -name 'libevent*' \)
            exit 1
          fi
          echo "OK: no OpenMPI library is bundled"

          # (b) ...but the extension must still NEED it.
          # The extension is `ferric/ferric.cpython-3XX-x86_64-linux-gnu.so`.
          # Search under ferric/ specifically so a vendored library in
          # ferric_mpi.libs/ can never be mistaken for the extension itself
          # (which would make the DT_NEEDED assertion below test the wrong
          # file, and libopenblas DOES legitimately live in that sibling dir).
          EXT=$(find /tmp/whlx/ferric -maxdepth 1 -name 'ferric*.so' | head -1)
          test -n "$EXT" || { echo "::error::no ferric extension module in the wheel"; find /tmp/whlx -maxdepth 2; exit 1; }
          echo "--- DT_NEEDED of $EXT ---"
          readelf -d "$EXT" | grep -E 'NEEDED|RUNPATH|RPATH'
          if ! readelf -d "$EXT" | grep -q 'libmpi\.so\.40'; then
            echo "::error::the extension does not NEED libmpi.so.40, so this is a SERIAL wheel wearing an MPI name -- the mpi feature did not reach the build."
            exit 1
          fi
          echo "OK: extension DT_NEEDED names libmpi.so.40 (resolves against the system OpenMPI 4.x at load time)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # `mpi-wheels-`, NOT `wheels-`. The publish job below globs
          # `pattern: wheels-*` with merge-multiple, so a `wheels-`-prefixed
          # name here would put this wheel into a PyPI upload of the `ferric`
          # package. This prefix is a publish-safety control; do not "tidy" it
          # into the other jobs' naming convention.
          name: mpi-wheels-cp${{ matrix.python-version }}
          path: dist-mpi/*.whl
          if-no-files-found: error

  # The `pypi` GitHub Environment referenced below does not need protection
  # rules to make this job WORK, but adding a required reviewer there is the
  # cheapest available brake on an accidental tag push publishing a bad
  # wheel -- consider turning that on before the first real release.
  publish:
    needs: [build-wheels, smoke-test]
    # THIS GUARD IS THE ONLY THING STANDING BETWEEN A NIGHTLY CRON RUN AND A
    # REAL PYPI UPLOAD -- treat any change near it as a publish-safety change,
    # not a cosmetic one. On a `schedule` (or `workflow_dispatch`) event,
    # `github.ref` is the ref the run was triggered against, which for both of
    # those event types is always a BRANCH ref (`refs/heads/<default-branch>`,
    # i.e. `refs/heads/main` here) -- GitHub does not run scheduled/dispatched
    # workflows against a tag ref, only `push`-to-a-tag does that. So
    # `startsWith(github.ref, 'refs/tags/v')` is false for every scheduled run
    # by construction, with no code path in this workflow that can make it
    # true: nothing here reassigns GITHUB_REF, and this job takes no `inputs`
    # that could substitute a tag string in its place. Confirmed by reading
    # this file end to end for this task (see the wheels.yml nightly-schedule
    # change) -- if a future edit ever adds a workflow_dispatch `inputs:` block
    # with something like a "publish anyway" ref override, it must NOT be
    # allowed to reach this `if:` unchecked, or this invariant breaks.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing -- no PYPI_API_TOKEN secret
    steps:
      # pattern + merge-multiple: pulls all four wheels-cp3.NN artifacts
      # (built separately per Python version above) into one flat dist/ --
      # gh-action-pypi-publish uploads everything it finds there in one go.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Sanity-check what is about to be uploaded
        run: |
          set -euo pipefail
          echo "-- publishing from ref: ${GITHUB_REF} --"
          ls -lh dist/
          # Every wheel filename must carry the same version as the tag
          # (v0.1.0 -> ferric-0.1.0-*), and there must be exactly one wheel
          # per supported CPython tag. The "Stamp the version from the tag"
          # step in build-wheels is what makes this true in the normal case
          # -- pyproject.toml's version IS the tag by the time maturin builds
          # -- so a mismatch here means that step's rewrite didn't reach this
          # leg's build (a cache serving a pre-stamp checkout, a matrix leg
          # that failed before stamping and got re-run against stale state,
          # etc), not a hand-edited version drifting from the tag. Either
          # way: fail before PyPI ever sees it, since a bad upload to a
          # version that already exists cannot be overwritten or deleted,
          # only yanked.
          tag_version="${GITHUB_REF#refs/tags/v}"
          # DEFENCE IN DEPTH against the OpenMPI wheel variant reaching PyPI.
          # The mpi-wheel job already cannot land here: it uploads under
          # `mpi-wheels-cp*`, the download above globs `wheels-*`, and this
          # job does not `needs:` it. This check exists because that safety
          # rests entirely on an artifact NAME, and a future rename ("tidy the
          # artifact names up") would silently re-open the path -- publishing
          # an OpenMPI-ABI-locked, libmpi-vendoring build under the portable
          # `ferric` name, which cannot be un-published, only yanked.
          if ls dist/ | grep -qiE 'mpi'; then
            echo "::error::an MPI-variant wheel reached the publish staging dir. The ferric-mpi wheel is NEVER published from this workflow (OpenMPI 4.x ABI lock-in + an unbundled system-MPI runtime requirement); refusing to upload."
            ls -la dist/
            exit 1
          fi
          count=$(ls dist/*.whl | wc -l)
          echo "wheel count: $count (expect 4: cp310, cp311, cp312, cp313)"
          if [[ "$count" -ne 4 ]]; then
            echo "::error::expected 4 wheels, found $count -- refusing to publish a partial release"
            exit 1
          fi
          for whl in dist/*.whl; do
            case "$whl" in
              *"ferric-${tag_version}-"*) ;;
              *)
                echo "::error::$whl does not match tag version $tag_version"
                exit 1
                ;;
            esac
          done

      # Was `@release/v1`, a BRANCH ref, not a tag -- pinned to the commit
      # v1.14.2's (also annotated) tag peels to, which is confirmed to be the
      # SAME commit `release/v1` currently points at. So this is a
      # supply-chain pin only, not a publish-behaviour change: nothing this
      # job does at upload time is different after this pin than before it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
